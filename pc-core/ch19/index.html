<script>
'use strict';
const CHAPTER = { number: 19, title: 'Магические предметы и руны', minutes: 14, language: 'ru', next: '../ch20/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Item bonus and runes ITEM (purple, as the item bonus in ch03), gold GOLD, levels and numbers RULE, the GM GMC, a hero HERO.
const ITEM = COL.real, GOLD = COL.int;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0, dash) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5, ...(dash ? { 'stroke-dasharray': '8 6' } : {}) }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2, x = 800) => say(p, s, x, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });
const pw = (s, size) => s.length * size * .56 + 44;
// Pills of their own colours [[text, colour, t0], …] in a row centred on cx.
function pillsC(p, items, cx, y, size = 24) {
  const w = items.map(([s]) => pw(s, size)), tot = w.reduce((a, b) => a + b + 16, -16);
  let x = cx - tot / 2;
  return items.map(([s, c, t0], i) => { const g = pill(p, s, c, x + w[i] / 2, y, t0, size); x += w[i] + 16; return g; });
}
// A numbered step: amber disc with n, text after it.
function step(p, n, str, x, y, t0, size = 27, colr = COL.chalk) {
  const g = G(p, { x: -20, o: 0 });
  mk('circle', { cx: x, cy: y - size * .36, r: 22, fill: mix(COL.board, RULE, .3), stroke: RULE, 'stroke-width': 2.5 }, g);
  T(g, String(n), { x, y: y - size * .36 + 9, size: 24, fill: RULE, weight: 700, anchor: 'middle' });
  if (typeof str === 'string') T(g, str, { x: x + 40, y, size, fill: colr, weight: 500 });
  else { const e = T(g, '', { x: x + 40, y, size, weight: 500 }); str.forEach(([s, c = COL.chalk]) => { mk('tspan', { fill: c }, e).textContent = s; }); }
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  return g;
}
// A table: head [labels], rows [[cell | [cell, colour]]] with column widths cw; rows appear one by one: at(k, t0), lit(k, t0) frames a row.
function tbl(p, x, y, cw, head, rows, { rh = 54, size = 25 } = {}) {
  const W = cw.reduce((a, b) => a + b, 0), cx = []; let a = x;
  cw.forEach(w => { cx.push(a + 14); a += w; });
  const h = G(p, { o: 0 });
  head.forEach((s, i) => T(h, s, { x: cx[i], y: y + 22, size: 20, fill: COL.dim, weight: 600 }));
  path(h, `M${x} ${y + 36}H${x + W}`, { stroke: COL.faint, 'stroke-width': 2 });
  const R = rows.map((r, k) => {
    const g = G(p, { o: 0 }), yy = y + 36 + k * rh;
    r.forEach((c, i) => { const [s, col = COL.chalk] = Array.isArray(c) ? c : [c]; T(g, s, { x: cx[i], y: yy + rh / 2 + size * .36, size, fill: col, weight: 600 }); });
    return g;
  });
  return {
    head: t => show(h, t), at: (k, t) => show(R[k], t, .4),
    lit(k, t) { const r = mk('rect', { x: x + 2, y: y + 40 + k * rh, width: W - 4, height: rh - 8, rx: 10, fill: RULE, 'fill-opacity': .14, stroke: RULE, 'stroke-width': 2 }, p); put(r, { o: 0 }); show(r, t, .3); },
  };
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f (as in ch16).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return { X, cx, w, h, paint(f, deg, t1) {
    const [, , colr, op] = DEG.find(d => d[0] === deg);
    const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
    put(r, { o: 0 }); show(r, t1, .3);
    return r;
  } };
}
// A dashed square slot (a place for a rune or an invested item); returns {g, fill(label, colour, t0), clear(t0), mark(colour, t0)}.
function rslot(p, x, y, w, h, t0, label = '') {
  const g = G(p, { o: 0 });
  const r = mk('rect', { x, y, width: w, height: h, rx: 12, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2.5, 'stroke-dasharray': '8 6' }, g);
  const f = mk('rect', { x: x + 3, y: y + 3, width: w - 6, height: h - 6, rx: 10, fill: ITEM, 'fill-opacity': .5 }, g);
  put(f, { o: 0 });
  const tx = T(g, label, { x: x + w / 2, y: y + h / 2 + 7, size: 20, fill: COL.chalk, weight: 600, anchor: 'middle', o: label ? 1 : 0 });
  show(g, t0);
  return {
    g, fill(s, t, colr = ITEM) { prog(() => { tx.textContent = s; put(f, { c_fill: colr }); }, t, 0); tw(f, { o: 1 }, t, .3); tw(tx, { o: 1 }, t, .3); },
    clear(t) { tw(f, { o: 0 }, t, .4); tw(tx, { o: 0 }, t, .4); },
    mark(colr, t) { prog(() => { put(r, { c_stroke: colr }); }, t, 0); pulse(g, t, 1.08); },
  };
}

// A die outline with the number or name inside (the die label of dieShape sits below it).
const dn = (p, sides, x, y, c, t0, size, txt) => { const g = dieShape(p, sides, x, y, c, t0, size, null, false); T(g, txt, { y: sides === 6 ? 12 : 14, size: 34, fill: c, weight: 700, anchor: 'middle' }); return g; };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Магические предметы и руны', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 8 «Развитие» · Глава 19', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Магические предметы и руны', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'уровень предмета, руны, зелья и сокровища', 800, 560, Math.max(m('sub'), 1.2), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['item', 'Руны и уровень предмета', (m) => {
    const p = panel(0);
    title(p, 'Зачем руны. Уровень предмета');
    // attack bars: Shippa now and what the game expects of a level 5 hero
    const U = 40, bx = 440;
    const row = (y, label, t0, rune) => {
      say(p, label, 100, y + 8, t0, { size: 24, fill: COL.dim, anchor: 'start' });
      const g = G(p, { o: 0 });
      mk('rect', { x: bx, y: y - 28, width: 4 * U, height: 56, rx: 8, fill: HERO, 'fill-opacity': .5 }, g);
      T(g, 'Ловкость +4', { x: bx + 2 * U, y: y + 7, size: 19, weight: 600, anchor: 'middle' });
      mk('rect', { x: bx + 4 * U, y: y - 28, width: 7 * U, height: 56, rx: 8, fill: RULE, 'fill-opacity': .5 }, g);
      T(g, 'уровень и умение +7', { x: bx + 7.5 * U, y: y + 7, size: 19, weight: 600, anchor: 'middle' });
      show(g, t0);
      if (rune) {
        const r = G(p, { o: 0 });
        mk('rect', { x: bx + 11 * U + 6, y: y - 28, width: 70, height: 56, rx: 8, fill: 'none', stroke: ITEM, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, r);
        T(r, 'руны', { x: bx + 11 * U + 41, y: y + 7, size: 19, fill: ITEM, weight: 700, anchor: 'middle' });
        show(r, rune);
      }
    };
    row(150, 'Шиппа, 5-й уровень', .4);
    L(p, [['рапира ', COL.chalk], ['+11', RULE], [' · d6', COL.chalk]], 1030, 158, .8, 28);
    row(245, 'расчёт игры для 5-го', m('foe'), m('foe', 1.5));
    L(p, [['у Шиппы пока ', COL.chalk], ['нет рун', NO]], 1030, 253, m('foe', 3), 26);
    say(p, 'руны дают бонус поверх умения и уровня', 800, 330, m('foe', 5.2), { size: 27, fill: ITEM, weight: 600 });
    hr(p, 372, m('lvl', -.3));
    L(p, [['уровень предмета', RULE], [' — сложность вещи и сила магии в ней', COL.chalk]], 100, 420, m('lvl'), 27);
    pillsC(p, [['обычная рапира · 0', RULE, m('lvl', 6)], ['обычный доспех · 0', RULE, m('lvl', 6.6)], ['уровень не указан = 0', COL.dim, m('lvl', 5)]], 800, 482, 22);
    // the scale of item levels 0…8
    const cxs = i => 300 + i * 125, sy = 585;
    say(p, 'уровень', 130, sy + 38, m('use', -.6), { size: 22, fill: COL.dim, anchor: 'start' });
    const cells = [];
    for (let i = 0; i <= 8; i++) {
      const g = G(p, { o: 0 });
      cells.push(mk('rect', { x: cxs(i) - 50, y: sy, width: 100, height: 56, rx: 10, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2.5 }, g));
      T(g, String(i), { x: cxs(i), y: sy + 38, size: 26, fill: COL.chalk, weight: 600, anchor: 'middle' });
      show(g, m('use', -.6 + i * .06));
    }
    pill(p, 'герой 3-го', HERO, cxs(3), 700, m('use', 1.2), 22);
    pill(p, 'вещь 4-го', ITEM, cxs(4) + 20, 765, m('use', 3), 22);
    yesNo(p, true, cxs(4) + 190, 765, m('use', 4.6), .8);
    say(p, 'пользоваться можно любой вещью', cxs(4) + 230, 775, m('use', 4.6), { size: 24, fill: OK, weight: 600, anchor: 'start' });
    yesNo(p, false, 400, 835, m('make'), .8);
    say(p, 'создать самому: не выше своего уровня', 450, 845, m('make'), { size: 24, fill: NO, weight: 600, anchor: 'start' });
    const gmBox = (i, t0) => { const r = mk('rect', { x: cxs(i) - 54, y: sy - 4, width: 108, height: 64, rx: 12, fill: 'none', stroke: GMC, 'stroke-width': 3.5 }, p); put(r, { o: 0 }); show(r, t0, .3); };
    gmBox(3, m('gm', 1.8)); gmBox(4, m('gm', 2.6));
    pill(p, 'награды: уровень героев и на 1 выше', GMC, 800, 548, m('gm', 1), 22);
  }],
  ['invest', 'Настройка на предмет', (m) => {
    const p = panel(0);
    title(p, 'Настройка на предмет');
    pill(p, 'занятие «Настройка на предмет»', RULE, 470, 130, .5, 24);
    pill(p, 'в описании: «настроенность»', ITEM, 1130, 130, m('how', -4.2), 24);
    // two cloaks
    box(p, 100, 190, 650, 130, COL.faint, m('how', 7.2));
    box(p, 850, 190, 650, 130, ITEM, m('how', 9.5));
    say(p, 'плащ не настроен', 140, 240, m('how', 7.2), { size: 28, weight: 700, anchor: 'start' });
    say(p, 'защитит от дождя, магии нет', 140, 290, m('how', 7.4), { size: 24, fill: COL.dim, anchor: 'start' });
    say(p, 'плащ настроен', 890, 240, m('how', 9.5), { size: 28, fill: ITEM, weight: 700, anchor: 'start' });
    say(p, 'магия работает', 890, 290, m('how', 9.7), { size: 24, anchor: 'start' });
    L(p, [['настройка: ', COL.chalk], ['одно или несколько Взаимодействий', RULE], [' — как надеть вещь. Действует, пока вещь на герое', COL.chalk]], 100, 380, m('how', 1), 25);
    // ten slots
    const sx = i => 230 + i * 125, sy = 480;
    say(p, 'не больше 10 предметов в день', 800, 450, m('ten'), { size: 26, fill: RULE, weight: 700 });
    const S10 = [];
    for (let i = 0; i < 10; i++) S10.push(rslot(p, sx(i) - 50, sy, 100, 96, m('ten', .1 + i * .1)));
    S10[0].fill('плащ', m('ten', 1.2));
    S10[0].mark(NO, m('off'));
    L(p, [['снял — настройка слетает, но вещь ', COL.chalk], ['всё равно в пределе', NO]], 230, 640, m('off', 1), 25);
    pill(p, 'ежедневные приготовления: предел с нуля', DOWN, 800, 700, m('reset', .2), 24);
    S10[0].clear(m('reset', 1.8)); S10[0].mark(COL.faint, m('reset', 1.8));
    S10[0].fill('доспех', m('armor', 1), ITEM);
    S10[0].mark(ITEM, m('armor', 1));
    L(p, [['настроено: ', COL.chalk], ['1 из 10', OK]], 230, 790, m('armor', 1.2), 30);
    say(p, 'броня с любой руной получает дескриптор «настроенный»', 560, 790, m('armor', .2), { size: 24, fill: ITEM, weight: 600, anchor: 'start', });
    say(p, 'о пределе вспомнят позже: плащи и кольца', 800, 850, m('late'), { size: 24, fill: COL.dim });
  }],
  ['act', 'Активация', (m) => {
    const p = panel(0);
    title(p, 'Активация');
    box(p, 100, 130, 650, 200, OK, .4);
    say(p, 'работает сам', 140, 185, .5, { size: 30, fill: OK, weight: 700, anchor: 'start' });
    say(p, 'горящий топор: огонь срабатывает', 140, 240, .8, { size: 25, anchor: 'start' });
    say(p, 'при ударе, без действий', 140, 278, 1, { size: 25, anchor: 'start' });
    box(p, 850, 130, 650, 200, RULE, m('cost'));
    say(p, 'Активация', 890, 185, m('cost'), { size: 30, fill: RULE, weight: 700, anchor: 'start' });
    actGlyph(p, 2, 1380, 180, RULE, m('cost', .4));
    say(p, 'в описании: сколько действий', 890, 240, m('cost', 1.2), { size: 25, anchor: 'start' });
    say(p, 'и какой эффект', 890, 278, m('cost', 2.2), { size: 25, anchor: 'start' });
    L(p, [['настроенный предмет: ', COL.chalk], ['только если настроен на вас', HERO]], 100, 440, m('inv'), 27);
    L(p, [['лимит в день: ', COL.chalk], ['обновляется при ежедневных приготовлениях', DOWN]], 100, 520, m('lim'), 27);
    L(p, [['прервали: ', COL.chalk], ['действия потеряны', NO]], 100, 600, m('cut'), 27);
    say(p, 'пока нужны две простые активации', 800, 700, m('two'), { size: 26, fill: COL.dim });
    pillsC(p, [['выпить зелье', ITEM, m('two', 1.6)], ['прочесть свиток', ITEM, m('two', 2.6)]], 800, 780, 28);
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-inv', prompt: ['Предметы и настройка.'], build: blanks(Q_INV),
  }, {
    id: 'c-inv-tf', prompt: ['Верно или неверно?'], build: grid(Q_INV_TF, TF, { multi: false, text: true }),
  }], done) }],
  ['rune', 'Что такое руна', (m) => {
    const p = panel(0);
    title(p, 'Что такое руна');
    pill(p, 'магический знак на оружии или доспехе', ITEM, 470, 130, .5, 24);
    pill(p, 'свободное время · Создание предмета', DOWN, 1130, 130, m('name', -5.4), 24);
    say(p, 'название: усиление · фундаментальные · атрибутивные · основа', 800, 205, m('name'), { size: 22, fill: COL.dim });
    const nm = (parts, y, t0) => {
      let x = 160;
      parts.forEach(([s, c], i) => { const w = pw(s, 26); pill(p, s, c, x + w / 2, y, t0 + i * .5, 26); x += w + 18; });
    };
    nm([['+1', ITEM], ['разящая', ITEM], ['рапира', COL.chalk]], 270, m('name', .8));
    nm([['+2', ITEM], ['улучшенная', ITEM], ['укреплённая', ITEM], ['кольчуга', COL.chalk]], 360, m('name', 4.4));
    hr(p, 430, m('two', -.3));
    say(p, 'Фундаментальные: удар, урон, защита', 100, 475, m('two'), { size: 27, fill: RULE, weight: 700, anchor: 'start' });
    [['усиления оружия', 'оружие'], ['разящая', 'оружие'], ['усиления брони', 'броня'], ['укреплённая', 'броня'], ['армированная', 'щит']].forEach(([a, b], i) => {
      const t0 = m('tbl', .1 + i * 1.2);
      say(p, a, 120, 535 + i * 56, t0, { size: 26, fill: ITEM, weight: 600, anchor: 'start' });
      say(p, b, 470, 535 + i * 56, t0, { size: 26, fill: COL.dim, anchor: 'start' });
    });
    say(p, 'Атрибутивные: особый эффект', 900, 475, m('prop'), { size: 27, fill: RULE, weight: 700, anchor: 'start' });
    say(p, 'огонь на ударах', 920, 535, m('prop', 1.2), { size: 26, anchor: 'start' });
    say(p, 'сопротивление энергии на броне', 920, 591, m('prop', 2.4), { size: 26, anchor: 'start' });
    say(p, 'нужен только их лимит', 920, 680, m('prop', 4.2), { size: 25, fill: COL.dim, anchor: 'start' });
  }],
  ['limit', 'Лимит атрибутивных рун', (m) => {
    const p = panel(0);
    title(p, 'Лимит атрибутивных рун');
    say(p, 'сколько указано в руне усиления', 800, 120, .5, { size: 26, fill: COL.dim });
    const rowSlots = (y, label, n, t0) => {
      pill(p, label, ITEM, 330, y, t0, 26);
      for (let i = 0; i < n; i++) rslot(p, 560 + i * 90, y - 32, 74, 64, t0 + .3 + i * .2);
      say(p, 'атрибутивных: ' + n, 560 + n * 90 + 24, y + 9, t0 + .6, { size: 25, fill: RULE, weight: 600, anchor: 'start' });
    };
    rowSlots(200, '+1 руна усиления', 1, m('pot'));
    rowSlots(290, '+2 руна усиления', 2, m('pot', 1.8));
    pill(p, 'разящая', ITEM, 270, 390, m('fund'), 26); pill(p, 'укреплённая', ITEM, 480, 390, m('fund', .5), 26);
    say(p, 'фундаментальные: в лимит не входят', 640, 399, m('fund', 1.2), { size: 25, fill: OK, weight: 600, anchor: 'start' });
    pill(p, 'щит', COL.chalk, 270, 480, m('shield'), 26);
    yesNo(p, false, 360, 480, m('shield', .6), .8);
    say(p, 'атрибутивные руны не ложатся вообще', 410, 489, m('shield', .6), { size: 25, fill: NO, weight: 600, anchor: 'start' });
    hr(p, 540, m('lvl', -.3));
    L(p, [['уровень рунного предмета', RULE], [' = самый высокий из уровней основы и рун', COL.chalk]], 100, 590, m('lvl'), 26);
    const b3 = (x, w, a, b, c, t0) => { box(p, x, 650, w, 130, c, t0); say(p, a, x + w / 2, 705, t0, { size: 25, anchor: 'middle' }); say(p, b, x + w / 2, 752, t0, { size: 36, fill: c, weight: 700 }); };
    b3(100, 440, '+1 разящая булава', '4', RULE, m('lvl', 4.2));
    b3(620, 340, 'ледяная руна', '8', ITEM, m('lvl', 7.8));
    b3(1040, 460, 'предмет', '8', OK, m('eight'));
    say(p, '+', 580, 730, m('lvl', 7.8), { size: 40, fill: COL.dim });
    say(p, '→', 1000, 730, m('eight'), { size: 40, fill: COL.dim });
  }],
  ['pot', 'Руна усиления оружия', (m) => {
    const p = panel(0);
    title(p, 'Руна усиления оружия');
    pillsC(p, [['+1 руна усиления оружия', ITEM, .5], ['2-й уровень', RULE, 3], ['35 зм', GOLD, 3.6]], 800, 135, 26);
    const bw = 300, bx = i => 130 + i * 340;
