/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Level LVL (pink: no GM here), feats/ranks/numbers RULE, attributes HERO, spells MAG, items/runes ITEM, the party's jobs HERO pills,
// good OK, refusals/weak spots NO, enemies FOE; in HP: ancestry ANC, class CLS, Toughness TOUGH.
const LVL = COL.rat, ANC = COL.dim, CLS = COL.int, TOUGH = COL.real, MAG = COL.real, ITEM = COL.real;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2, x = 800) => say(p, s, x, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const pw = (s, size) => s.length * size * .56 + 44;
function pillsC(p, items, cx, y, size = 24) {
  const w = items.map(([s]) => pw(s, size)), tot = w.reduce((a, b) => a + b + 16, -16);
  let x = cx - tot / 2;
  return items.map(([s, c, t0], i) => { const g = pill(p, s, c, x + w[i] / 2, y, t0, size); x += w[i] + 16; return g; });
}
// A numbered step: amber disc with n, text after it.
function step(p, n, str, x, y, t0, size = 27, colr = COL.chalk) {
  const g = G(p, { x: -20, o: 0 });
  mk('circle', { cx: x, cy: y - size * .36, r: 22, fill: mix(COL.board, RULE, .3), stroke: RULE, 'stroke-width': 2.5 }, g);
  T(g, String(n), { x, y: y - size * .36 + 9, size: 24, fill: RULE, weight: 700, anchor: 'middle' });
  if (typeof str === 'string') T(g, str, { x: x + 40, y, size, fill: colr, weight: 500 });
  else { const e = T(g, '', { x: x + 40, y, size, weight: 500 }); str.forEach(([s, c = COL.chalk]) => { mk('tspan', { fill: c }, e).textContent = s; }); }
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  return g;
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f (as in ch09, ch14, ch16).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}
// A choice row: kind (dim, left), name and a line under it, the party's job as a pill on the right. Slides in at t0.
function rowCard(p, y, t0, kind, name, sub, job, { nc = COL.chalk, kc = COL.dim, h = 80 } = {}) {
  const g = G(p, { x: -24, o: 0 });
  mk('rect', { x: 100, y, width: 1400, height: h, rx: 16, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2 }, g);
  T(g, kind, { x: 128, y: y + h / 2 + 7, size: 20, fill: kc, weight: 600 });
  T(g, name, { x: 380, y: y + 35, size: 29, fill: nc, weight: 700 });
  const s = T(g, sub, { x: 380, y: y + 65, size: 21, fill: COL.dim });
  if (job) pill(g, job, HERO, 1488 - pw(job, 21) / 2, y + h / 2, null, 21);
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  return g;
}

// A sheet beat: the first of a run builds the sheet on a fresh panel filled with `states`; the next keeps it and replaces the left part.
function shBeat(states) {
  if (S.sh && S.shPanel === S.panel) {
    hide(S.shLeft, .1, .4);
    return [S.sh, (S.shLeft = G(S.panel)), true];
  }
  const p0 = panel(0), sh = S.sh = charSheet(p0, .3);
  S.shPanel = p0;
  states.forEach(l => l.forEach(a => sh.fill(...a)));
  return [sh, (S.shLeft = G(p0)), false];
}
