<script>
'use strict';
const CHAPTER = { number: 2, title: 'Проверка: d20 против сложности', minutes: 10, language: 'ru', next: '../ch03/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// DEG, degOf, DEGREES, numDie: lib/pf.js.
// Bracket under (dir 1) or over (dir −1) a span.
const bracket = (p, x1, x2, y, color, t0, dir = 1) =>
  draw(path(p, `M${x1} ${y - dir * 14}V${y}H${x2}V${y - dir * 14}`, { stroke: color, 'stroke-width': 4 }, { d: 0 }), t0, .6);
// A filled box, hidden until t0 (fade to opacity o).
function box(p, x, y, w, h, color, op, t0, o = 1, rx = 10) {
  const r = mk('rect', { x, y, width: w, height: h, rx, fill: color, 'fill-opacity': op, stroke: color, 'stroke-width': 2.5 }, p);
  put(r, { o: 0 });
  if (t0 != null) tw(r, { o }, t0, .5);
  return r;
}
// A shield with a short label inside.
function shield(p, label, color, x, y, t0) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M0 -62L54 -42V6Q54 46 0 68Q-54 46 -54 6V-42Z', { stroke: color, 'stroke-width': 4, fill: '#22322d', 'stroke-linejoin': 'round' });
  T(g, label, { y: 12, size: 30, fill: color, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// A strike-through line drawn on.
const strike = (p, x1, y1, x2, y2, t0) => draw(path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: NO, 'stroke-width': 6, 'stroke-linecap': 'round' }, { d: 0 }), t0, .4);

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Проверка: d20 против сложности', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 1 «Основы» · Глава 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Проверка: d20 против сложности', { x: 800, y: 440, size: 76, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'четыре шага, степени успеха, бонусы и штрафы, испытания', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['steps', 'Четыре шага', (m) => {
    const p = panel(0);
    say(p, 'Проверка в четыре шага', 90, 120, .2, { size: 36, weight: 600, anchor: 'start' });
    [['Бросьте d20, найдите модификаторы', 's1'], ['Сложите: получится итог', 's2'], ['Сравните итог со сложностью (СЛ)', 's3'], ['Определите степень успеха', 's4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 120, o: 0 });
      mk('circle', { cx: 116, cy: -10, r: 26, fill: RULE }, g);
      T(g, String(i + 1), { x: 116, y: 1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 162, size: 30, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    draw(path(p, 'M740 160V820', { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), m('ex', -.4), .5);
    say(p, 'Река: проверка Атлетики', 1150, 140, m('ex'), { size: 30, fill: COL.dim, weight: 600 });
    numDie(p, 12, 900, 300, m('die'), 58);
    say(p, '+5', 1040, 318, m('mod'), { size: 52, fill: RULE, weight: 700 });
    say(p, 'Атлетика', 1040, 380, m('mod', .2), { size: 22, fill: COL.dim });
    say(p, '=', 1150, 318, m('sum'), { size: 52, fill: RULE, weight: 700 });
    const tot = G(p, { x: 1250, y: 318, o: 0 });
    T(tot, '17', { size: 56, fill: RULE, weight: 700, anchor: 'middle' });
    pop(tot, m('sum', .2));
    const lx = v => 820 + (v - 10) * 66, ly = 580;
    draw(path(p, `M${lx(10)} ${ly}H${lx(20)}`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('dc'), .5);
    for (let v = 10; v <= 20; v++) {
      draw(path(p, `M${lx(v)} ${ly - 9}V${ly + 9}`, { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), m('dc', .2), .3);
      if (v % 5 === 0) say(p, String(v), lx(v), ly + 42, m('dc', .3), { size: 22, fill: COL.dim });
    }
    draw(path(p, `M${lx(15)} ${ly - 110}V${ly + 12}`, { stroke: RULE, 'stroke-width': 5 }, { d: 0 }), m('dc', .2), .5);
    say(p, 'СЛ 15', lx(15), ly - 124, m('dc', .4), { size: 28, fill: RULE, weight: 700 });
    box(p, lx(15), ly - 70, lx(20) - lx(15), 56, OK, .25, m('ok'));
    box(p, lx(10), ly - 70, lx(15) - lx(10), 56, NO, .2, m('ok'));
    say(p, 'успех', (lx(15) + lx(20)) / 2 + 60, ly - 33, m('ok', .2), { size: 24, fill: COL.chalk, weight: 700 });
    say(p, 'провал', (lx(10) + lx(15)) / 2, ly - 33, m('ok', .2), { size: 24, fill: COL.chalk, weight: 700 });
    tw(tot, { x: lx(17), y: ly + 100, s: .7 }, m('ok', -.3), .8);
    const dt = G(p, { x: lx(17), y: ly, o: 0 });
    mk('circle', { r: 12, fill: COL.chalk, stroke: COL.board, 'stroke-width': 3 }, dt);
    show(dt, m('ok', .3));
    say(p, '17 ≥ 15 → успех', 1150, 760, m('ok', .5), { size: 34, fill: OK, weight: 700 });
    const eq = G(p, { x: lx(15), y: ly, o: 0 });
    mk('circle', { r: 12, fill: COL.board, stroke: OK, 'stroke-width': 4 }, eq);
    show(eq, m('eq'));
    say(p, 'итог 15 = СЛ 15 — тоже успех', 1150, 820, m('eq', .2), { size: 28, fill: COL.dim, weight: 600 });
  }],
  ['sheet', 'Число на листе', (m) => {
    const p = panel(0);
    say(p, 'лист персонажа', 800, 78, .2, { size: 22, fill: COL.dim });
    const sh = G(p, { x: 800, y: 150, o: 0 });
    mk('rect', { x: -230, y: -52, width: 460, height: 104, rx: 16, fill: '#22322d', stroke: HERO, 'stroke-width': 2.5 }, sh);
    T(sh, 'Атлетика', { x: -196, y: 16, size: 44, weight: 600 });
    const five = T(sh, '+5', { x: 160, y: 18, size: 52, fill: RULE, weight: 700, anchor: 'middle' });
    show(sh, .2);
    say(p, 'модификатор = характеристика + бонус умения', 800, 250, m('two'), { size: 28, fill: COL.dim, weight: 600 });
    infoCard(p, 130, 300, 580, 'Модификатор характеристики', ['природные данные героя', 'плавание: Сила'], RULE, m('attr'), .9);
    infoCard(p, 890, 300, 580, 'Бонус умения', ['изучен: уровень + 2 = 1 + 2', ['неизучен: +0', COL.dim]], RULE, m('prof'), m('none') - m('prof') - .3);
    const part = (str, x, y) => { const g = G(p, { x: 960, y: 168, o: 0 }); T(g, str, { size: 52, fill: RULE, weight: 700, anchor: 'middle' }); return [g, x, y]; };
    const parts = [part('+2', 640, 360), part('+3', 1400, 360)];
    tw(five, { o: .3 }, m('two', .3), .4);
    parts.forEach(([g, x, y], i) => { show(g, m('two', .3), .3); tw(g, { x, y }, m(i ? 'prof' : 'attr', -.2), .9); });
    say(p, 'подробно — в главе 3', 800, 560, m('later'), { size: 28, fill: COL.dim });
    parts.forEach(([g]) => tw(g, { x: 960, y: 168 }, m('later', 2.2), .8));
    parts.forEach(([g]) => hide(g, m('later', 3), .3));
    tw(five, { o: 1 }, m('later', 3), .3);
    pulse(sh, m('later', 3.1), 1.08);
    say(p, 'на листе уже сложено: 2 + 3 = 5', 800, 620, m('later', 2.6), { size: 30, fill: RULE, weight: 700 });
    pill(p, 'd20 + число с листа + ситуация', RULE, 800, 760, m('sit'), 32);
  }],
  ['dc', 'Кто знает СЛ', (m) => {
    const p = panel(0);
    say(p, 'Кто знает СЛ?', 800, 100, .2, { size: 40, weight: 600 });
    shield(p, 'КБ', FOE, 240, 260, m('ac'));
    say(p, 'Класс брони врага = СЛ удара по нему', 330, 250, m('ac', .3), { size: 30, anchor: 'start', weight: 600 });
    say(p, 'после пары атак его можно прикинуть', 330, 296, m('ac', 3), { size: 26, fill: COL.dim, anchor: 'start' });
    const gm = who(p, 'Ведущий', GMC, 1200, 600, m('gm'));
    const scr = G(p, { x: 1050, y: 610, o: 0 });
    path(scr, 'M-46 -62H46V62H-46Z', { stroke: GMC, 'stroke-width': 3, fill: '#22322d' });
    T(scr, 'СЛ ?', { y: 10, size: 28, fill: GMC, weight: 700, anchor: 'middle' });
    show(scr, m('gm', .3));
    say(p, 'СЛ 15 знает только ведущий', 1150, 740, m('gm', .6), { size: 24, fill: GMC });
    who(p, 'Игрок', HERO, 400, 600, m('gm', .2));
    bubble(p, 'Итог 17!', 400, 470, HERO, m('say'));
    bubble(p, 'Успех: вы на том берегу', 1200, 460, GMC, m('ans'));
    pulse(gm, m('ans'), 1.1);
    say(p, 'обстановка меняется — спрашивайте ведущего', 800, 840, m('ask'), { size: 28, fill: COL.dim });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-pass', prompt: ['Успех или провал?'],
    build: grid(Q_PASS, [['s', 'Успех', OK], ['f', 'Провал', NO]], { multi: false, text: true }),
  }], done) }],
  ['degrees', 'Четыре степени успеха', (m) => {
    const p = panel(0), ly = 560, dx = v => 170 + v * 42;
    say(p, 'Река: Атлетика +5 против СЛ 15', 800, 100, .2, { size: 32, fill: COL.dim, weight: 600 });
    draw(path(p, `M${dx(0)} ${ly}H${dx(30)}`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), .3, .6);
    for (let v = 0; v <= 30; v++) {
      draw(path(p, `M${dx(v)} ${ly - (v % 5 ? 7 : 11)}V${ly + (v % 5 ? 7 : 11)}`, { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), .5, .3);
      if (v % 5 === 0) say(p, String(v), dx(v), ly + 42, .6, { size: 22, fill: COL.dim });
    }
    draw(path(p, `M${dx(15)} ${ly - 240}V${ly + 14}`, { stroke: RULE, 'stroke-width': 5 }, { d: 0 }), .6, .5);
    say(p, 'СЛ 15', dx(15) + 14, ly - 216, .8, { size: 28, fill: RULE, weight: 700, anchor: 'start' });
    const band = (a, b, [, name, colr, op], range, t0) => {
      const r = box(p, dx(a), ly - 130, dx(b) - dx(a), 116, colr, op, t0, 1, 6);
      say(p, name, (dx(a) + dx(b)) / 2, ly - 80, t0 + .2, { size: 24, weight: 700 });
      say(p, range, (dx(a) + dx(b)) / 2, ly - 44, t0 + .2, { size: 22, fill: COL.chalk });
      return r;
    };
    band(14.5, 24.5, DEG[1], '15–24', m('s'));
    band(24.5, 30.4, DEG[0], '25 и выше', m('cs'));
    bracket(p, dx(15), dx(25), ly + 78, OK, m('cs', .5));
    say(p, 'СЛ + 10', dx(20), ly + 114, m('cs', .7), { size: 26, fill: OK, weight: 700 });
    band(5.5, 14.5, DEG[2], '6–14', m('f'));
    const cfBand = band(-.4, 5.5, DEG[3], '5 и ниже', m('cf'));
    bracket(p, dx(5), dx(15), ly + 78, NO, m('cf', .5));
    say(p, 'СЛ − 10', dx(10), ly + 114, m('cf', .7), { size: 26, fill: NO, weight: 700 });
    const mkr = G(p, { x: dx(2), y: ly, o: 0 });
    mk('circle', { r: 13, fill: COL.chalk, stroke: COL.board, 'stroke-width': 3 }, mkr);
    show(mkr, m('run'), .3);
    const rd = say(p, '', 800, 770, m('run'), { size: 34, weight: 700 });
    const setV = v => {
      const r = Math.round(v), d = degOf(r, 15);
      put(mkr, { x: dx(v) });
      rd.textContent = `итог ${r} → ${d[1]}`;
      rd.setAttribute('fill', d[2]);
    };
    prog(q => setV(2 + 26 * q), m('run', .2), 3.6, lin);
    prog(q => setV(28 - 11 * q), m('run', 4), 1);
    bracket(p, dx(6), dx(25), ly - 160, HERO, m('hero'), -1);
    say(p, 'с +5 итог: от 6 до 25', dx(6), ly - 186, m('hero', .3), { size: 26, fill: HERO, weight: 600, anchor: 'start' });
    tw(cfBand, { o: .35 }, m('hero', 1.5), .6);
    say(p, 'удар: крит. успех → двойной урон', 800, 826, m('desc', 2), { size: 26, fill: COL.chalk });
    say(p, 'ничего особого не сказано → как обычный успех или провал', 800, 866, m('plain'), { size: 26, fill: COL.dim });
  }],
  ['nat', 'Натуральные 20 и 1', (m) => {
    const p = panel(0), x0 = 280, cw = 60, cy = 340, cx = i => x0 + (i - 1) * cw;
    say(p, 'Атлетика +5 против СЛ 15', 800, 100, .2, { size: 32, fill: COL.dim, weight: 600 });
    pill(p, '20 на кубике: на степень лучше', OK, 470, 200, m('n20'), 28);
    pill(p, '1 на кубике: на степень хуже', NO, 1130, 200, m('n1'), 28);
    say(p, 'кубик', x0 - 20, cy + 44, m('strip'), { size: 22, fill: COL.dim, anchor: 'end' });
    say(p, 'итог', x0 - 20, cy + 116, m('strip'), { size: 22, fill: COL.dim, anchor: 'end' });
    const over = [];
    for (let i = 1; i <= 20; i++) {
      const t0 = m('strip', .2 + i * .04);
      box(p, cx(i), cy, cw - 6, 70, COL.chalk, 0, t0, 1, 8).setAttribute('stroke', COL.faint);
      say(p, String(i), cx(i) + (cw - 6) / 2, cy + 46, t0, { size: 28, fill: RULE, weight: 700 });
      say(p, String(i + 5), cx(i) + (cw - 6) / 2, cy + 116, t0 + .1, { size: 24, fill: COL.chalk });
      over[i] = box(p, cx(i), cy, cw - 6, 70, i >= 10 ? OK : NO, i === 20 ? .55 : .3, null, 1, 8);
    }
    for (let i = 2; i <= 19; i++) tw(over[i], { o: 1 }, m('mid', i < 10 ? .1 + (i - 2) * .05 : 2 + (i - 10) * .05), .4);
    bracket(p, cx(2), cx(9) + cw - 6, cy + 150, NO, m('mid', .6));
    say(p, 'провал', (cx(2) + cx(9) + cw) / 2, cy + 192, m('mid', .8), { size: 26, fill: NO, weight: 700 });
    bracket(p, cx(10), cx(19) + cw - 6, cy + 150, OK, m('mid', 2.5));
    say(p, 'успех', (cx(10) + cx(19) + cw) / 2, cy + 192, m('mid', 2.7), { size: 26, fill: OK, weight: 700 });
    tw(over[20], { o: 1 }, m('top'), .4);
    say(p, 'крит. успех', cx(20) + 27, cy + 192, m('top', .4), { size: 24, fill: OK, weight: 700 });
    say(p, 'выше некуда', cx(20) + 27, cy + 226, m('top', 2.5), { size: 22, fill: COL.dim });
    tw(over[1], { o: 1 }, m('low', 1), .4);
    const fl = say(p, 'провал', cx(1) + 27, cy + 192, m('low', 1.2), { size: 24, fill: NO, weight: 700 });
    tw(over[1], { 'a_fill-opacity': .65 }, m('drop'), .5);
    pulse(over[1], m('drop'), 1);
    hide(fl, m('drop'), .3);
    arrowTo(p, cx(1) + 27, cy + 170, cx(1) + 27, cy + 250, NO, m('drop', .3));
    say(p, 'крит. провал', cx(1) + 27, cy + 290, m('drop', .5), { size: 26, fill: NO, weight: 700 });
    say(p, 'итог 6 — провал, натуральная 1 → на степень ниже', 800, 760, m('drop', 1), { size: 28, fill: COL.chalk, weight: 600 });
  }],
  ['extremes', 'Не всегда крит', (m) => {
    const p = panel(0);
    draw(path(p, 'M800 140V700', { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), .2, .5);
    const ys = [300, 378, 456, 534];
    const ladder = (cx) => DEG.forEach(([, name, colr, op], i) => {
      box(p, cx - 160, ys[i] - 32, 320, 64, colr, op, .3 + i * .08);
      say(p, name, cx, ys[i] + 9, .4 + i * .08, { size: 26, weight: 700 });
    });
    ladder(420); ladder(1180);
    const frame = (cx, i, t0) => {
      const g = G(p, { x: cx, y: ys[i], o: 0 });
      mk('rect', { x: -176, y: -40, width: 352, height: 80, rx: 14, fill: 'none', stroke: RULE, 'stroke-width': 5 }, g);
      show(g, t0);
      return g;
    };
    say(p, '+2 против СЛ 30', 420, 140, m('hi'), { size: 32, weight: 600 });
    numDie(p, 20, 290, 205, m('hi', 2), 34);
    say(p, '→ итог 22', 340, 216, m('hi', 2.4), { size: 30, fill: RULE, weight: 700, anchor: 'start' });
    const f1 = frame(420, 2, m('hi', 3.6));
    tw(f1, { y: ys[1] }, m('up'), .7, back);
    say(p, 'натуральная 20: +1 степень', 420, 630, m('up', .5), { size: 28, fill: OK, weight: 700 });
    say(p, '+20 против СЛ 10', 1180, 140, m('lo'), { size: 32, weight: 600 });
    numDie(p, 1, 1050, 205, m('lo', 2.6), 34);
    say(p, '→ итог 21', 1100, 216, m('lo', 3), { size: 30, fill: RULE, weight: 700, anchor: 'start' });
    const f2 = frame(1180, 0, m('lo', 4));
    tw(f2, { y: ys[1] }, m('down'), .7, back);
    say(p, 'натуральная 1: −1 степень', 1180, 630, m('down', .5), { size: 28, fill: NO, weight: 700 });
    say(p, '20 и 1 сдвигают результат ровно на одну степень', 800, 780, m('down', 2), { size: 30, fill: COL.chalk, weight: 600 });
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-degree', prompt: ['Определите степень успеха. Не забудьте про 20 и 1 на кубике.'],
    build: grid(Q_DEGREE, DEGREES, { multi: false, text: true }),
  }], done) }],
  ['bonus', 'Три вида бонусов', (m) => {
    const p = panel(0);
    say(p, 'Бонусы: кроме бонуса умения — три вида', 800, 74, .2, { size: 32, weight: 600 });
    infoCard(p, 60, 110, 460, 'Ситуативный', ['от положения дел', 'укрытие: +2 к КБ', 'помощь союзника'], RULE, m('circ'), .5);
    infoCard(p, 570, 110, 460, 'Предмета', ['от снаряжения', 'броня: к КБ', 'инструменты: к навыку'], RULE, m('item'), .5);
    infoCard(p, 1080, 110, 460, 'Состояния', ['от магии', '«Героизм»: +1 к атакам,', 'испытаниям, навыкам'], RULE, m('stat'), .7);
    say(p, 'разные виды складываются · из одного вида — только самый большой', 800, 400, m('rule'), { size: 28, fill: RULE, weight: 700 });
    say(p, 'Скрытность за укрытием', 200, 480, m('ex'), { size: 28, fill: COL.dim, weight: 600, anchor: 'start' });
    const row = (y, n, kind, src, t0) => {
      const g = G(p, { y, o: 0 });
      T(g, n, { x: 330, y: 16, size: 44, fill: RULE, weight: 700, anchor: 'end' });
      put(pill(g, kind, RULE, 470, 0, null, 26), { o: 1 });
      T(g, src, { x: 610, y: 10, size: 28 });
      show(g, t0);
      return g;
    };
    const r1 = row(560, '+2', 'ситуативный', 'укрытие', m('ex', .3));
    const r2 = row(640, '+1', 'ситуативный', 'помощь союзника', m('aid'));
    tw(r2, { o: .4 }, m('cut', .5), .4);
    strike(p, 240, 640, 880, 640, m('cut'));
    say(p, 'один вид → только +2', 920, 650, m('cut', .6), { size: 28, fill: NO, weight: 700, anchor: 'start' });
