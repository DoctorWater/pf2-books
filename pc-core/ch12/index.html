<script>
'use strict';
const CHAPTER = { number: 12, title: 'Состояния', minutes: 13, language: 'ru', next: '../ch13/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Heroes HERO, the bandit FOE, rules and dice RULE; penalties and condition cards NO, hits and successes OK.
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const C0 = COL.chalk, DIM = COL.dim;
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch08–ch09).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// A die outline of `sides` with the rolled number inside, no label (ch09).
function dieNum(p, sides, n, x, y, t0, size = 44, colr = RULE) {
  const d = dieShape(p, sides, x, y, colr, t0, size, null, false);
  T(d, String(n), { y: size * .3, size: size * .8, fill: colr, weight: 700, anchor: 'middle' });
  return d;
}
// A ring with a letter, no name under it (ch09).
function tok(p, letter, colr, x, y, t0, r = 34) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };
// A line through a drawn word (a sum that does not happen).
const strike = (p, x1, x2, y, t0) => draw(path(p, `M${x1} ${y}L${x2} ${y - 6}`, { stroke: NO, 'stroke-width': 4 }, { d: 0 }), t0, .3);

// A condition card: the name and, for a valued condition, a round counter on the right; left edge x, middle y.
// set(v, t) changes the counter (at 0 the card fades: the condition is over); end(t) fades the card.
function cond(p, name, val, x, y, t0, { size = 26, colr = NO } = {}) {
  const hasV = val != null, h = size + 30, w = uiW(name, size) + (hasV ? 104 : 46);
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: 0, y: -h / 2, width: w, height: h, rx: 12, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, g);
  T(g, name, { x: 22, y: size * .36, size, fill: colr, weight: 600 });
  let num = null;
  if (hasV) {
    mk('circle', { cx: w - 36, cy: 0, r: h / 2 - 5, fill: colr, 'fill-opacity': .28, stroke: colr, 'stroke-width': 2 }, g);
    num = T(g, String(val), { x: w - 36, y: size * .37, size: size * 1.05, fill: C0, weight: 700, anchor: 'middle' });
  }
  if (t0 != null) show(g, t0);
  return {
    g, w, num,
    set(v, t1) { prog(() => { num.textContent = String(v); }, t1, 0); pulse(num, t1, 1.5); if (v === 0) tw(g, { o: 0 }, t1 + 1, .6); },
    end(t1) { tw(g, { o: 0 }, t1, .6); },
  };
}
// The bandit's card: name, HP and base AC on top, condition cards listed below (add); hp(v, t) updates the HP.
function foeCard(p, x, y, t0, { hp = 18, w = 440, h = 340, extra = '' } = {}) {
  box(p, x, y, w, h, FOE, t0);
  say(p, 'Разбойник', x + 28, y + 50, t0, { size: 28, fill: FOE, weight: 700, anchor: 'start' });
  const hpT = say(p, 'ПЗ ' + hp, x + w - 28, y + 50, t0, { size: 30, fill: FOE, weight: 700, anchor: 'end' });
  say(p, 'КБ 16' + extra, x + 28, y + 100, t0, { size: 25, anchor: 'start' });
  say(p, 'состояния:', x + 28, y + 150, t0, { size: 21, fill: DIM, anchor: 'start' });
  let n = 0;
  const C = {};
  return {
    C,
    hp(v, t1) { setText(hpT, 'ПЗ ' + v, t1); },
    add(key, name, val, t1) { return (C[key] = cond(p, name, val, x + 28, y + 196 + n++ * 64, t1, { size: 24 })); },
  };
}
// A row of n action cells from x (top y); lose(i, t) crosses cell i, note(i, s, t) writes under it.
function actRow(p, x, y, n, t0, { w = 110, h = 76, gap = 10, colr = RULE, extra = -1 } = {}) {
  const X = i => x + i * (w + gap), cells = [];
  for (let i = 0; i < n; i++) {
    const g = G(p, { o: 0 }), c = i === extra ? OK : colr;
    mk('rect', { x: X(i), y, width: w, height: h, rx: 12, fill: c, 'fill-opacity': .18, stroke: c, 'stroke-width': 2.5 }, g);
    const gl = glyph(g, 1, X(i) + w / 2, y + h / 2, 0, .5, c);
    show(g, t0 + i * .12);
    cells.push({ g, gl });
  }
  return {
    X, w,
    lose(i, t1) {
      const a = X(i) + 18, b = X(i) + w - 18;
      draw(path(cells[i].g, `M${a} ${y + 12}L${b} ${y + h - 12}M${b} ${y + 12}L${a} ${y + h - 12}`, { stroke: NO, 'stroke-width': 5 }, { d: 0 }), t1, .4);
      tw(cells[i].gl, { o: .3 }, t1, .3);
    },
  };
}
// Twenty small d20 faces in a row from x0; faces from..20 are filled (succeed), the rest red.
function strip(p, x0, y, from, t0, { w = 34, gap = 4, h = 40, label = true } = {}) {
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    const ok = f >= from, c = ok ? OK : NO;
    mk('rect', { x: x0 + (f - 1) * (w + gap), y, width: w, height: h, rx: 5, fill: c, 'fill-opacity': ok ? .45 : .18, stroke: c, 'stroke-width': 1.5 }, g);
    if (label) T(g, String(f), { x: x0 + (f - 1) * (w + gap) + w / 2, y: y + h * .66, size: 17, fill: C0, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  return { g, X: f => x0 + (f - 1) * (w + gap), w, h };
}

// Pills in a row from the left edge x (ch09's pillRow, left-aligned).
function pillsFrom(p, items, x, y, size, colr, t0s) {
  return items.map((s, i) => { const w = s.length * size * .56 + 44, g = pill(p, s, colr, x + w / 2, y, t0s[i], size); x += w + 16; return g; });
}

const PPL = { b: ['Бронна', HERO], t: ['Тиль', HERO], r: ['Разбойник', FOE], s: ['Шиппа', HERO] };
const ORDER = ['b', 't', 'r', 's'];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Состояния', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 4 «Бой» · Глава 12', { x: 800, y: 330, size: 28, fill: DIM, anchor: 'middle' });
    T(g, 'Состояния', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'испуг, падение, огонь — и когда это проходит', 800, 560, Math.max(m('sub'), 1.1), { size: 34, fill: DIM });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['table', 'За столом', (m) => {
    const p = panel(0);
    title(p, 'За столом');
    who(p, 'Шиппа', HERO, 200, 430, .3, 56);
    bubble(p, 'Сюда уже бежит стража!', 300, 260, HERO, .6, { size: 26, side: 'left' });
    who(p, 'Разбойник', FOE, 560, 430, .4, 56);
    who(p, 'Ведущий', GMC, 920, 430, m('gm', -.4), 56);
    bubble(p, 'Успех. Испуг 1', 920, 260, GMC, m('gm'), { size: 26 });
    cond(p, 'испуг', 1, 478, 600, m('gm', 1.6));
    who(p, 'Бронна', HERO, 1320, 430, m('ask', -.3), 56);
    bubble(p, 'А мне что это даёт?', 1320, 260, HERO, m('ask', .2), { size: 26, side: 'right' });
    colorLine(p, [['все проверки и СЛ разбойника ', C0], ['−1', NO]], 1060, 590, m('ans', 1.4), { size: 30 });
    say(p, 'до конца его следующего хода', 1060, 636, m('ans', .4), { size: 24, fill: DIM });
    colorLine(p, [['КБ 16 → 15: ', C0], ['по нему легче попасть', OK]], 1060, 690, m('ans', 4.4), { size: 28 });
    pill(p, 'состояние', RULE, 565, 690, m('cond', .6), 26);
    say(p, 'в книге правил их почти полсотни · для первых боёв хватит дюжины', 800, 800, m('dozen', -1.2), { size: 25, fill: DIM });
  }],
  ['how', 'Как устроено состояние', (m) => {
    const p = panel(0);
    title(p, 'Как устроено состояние');
    say(p, 'состояние держится, пока…', 800, 128, .3, { size: 26, fill: DIM });
    [['кончился срок', 'названный в эффекте', 0], ['его сняли', 'навык, заклинание', 'rem'], ['сработало его правило', 'из описания состояния', 'own']].forEach(([a, b, mark], i) => {
      const x = 100 + i * 480, t0 = mark ? m(mark) : .5;
      box(p, x, 160, 440, 110, RULE, t0);
      say(p, a, x + 220, 206, t0, { size: 28, weight: 700 });
      say(p, b, x + 220, 246, t0 + .2, { size: 22, fill: DIM });
    });
    hr(p, 310, m('val', -.3));
    say(p, 'значение состояния', 100, 370, m('val'), { size: 26, fill: RULE, weight: 600, anchor: 'start' });
    const c = cond(p, 'испуг', 2, 100, 440, m('val', .5), { size: 30 });
    const pen = L(p, [['→ ', DIM], ['−2', NO], [' ко всем проверкам и СЛ', C0]], 100 + c.w + 30, 450, m('val', 3.2), 30);
    c.set(1, m('zero', .2)); c.set(0, m('zero', 1.2));
    tw(pen, { o: 0 }, m('zero', 2.2), .6);
    L(p, [['значение 0 → ', C0], ['состояние закончилось', OK]], 100, 520, m('zero', 2), 28);
    hr(p, 570, m('kind', -.3));
    box(p, 100, 600, 660, 170, NO, m('kind'));
    say(p, 'штраф состояния', 130, 650, m('kind'), { size: 30, fill: NO, weight: 700, anchor: 'start' });
    say(p, 'почти все состояния', 130, 710, m('kind', .5), { size: 26, anchor: 'start' });
    box(p, 840, 600, 660, 170, NO, m('circ'));
    say(p, 'ситуативный штраф', 870, 650, m('circ'), { size: 30, fill: NO, weight: 700, anchor: 'start' });
    say(p, 'застигнут врасплох, распластанность', 870, 710, m('circ', 2), { size: 26, anchor: 'start' });
    say(p, 'вид штрафа важен, когда состояний несколько', 800, 830, m('need'), { size: 26, fill: RULE, weight: 600 });
  }],
  ['fright', 'Испуг', (m) => {
    const p = panel(0);
    title(p, 'Испуг');
    cond(p, 'испуг', 'N', 100, 150, .3, { size: 30 });
    L(p, [['штраф ', C0], ['−N', NO], [' ко всем своим проверкам и СЛ', C0]], 100, 240, .6, 28);
    pillsFrom(p, ['атаки', 'испытания', 'навыки', 'Внимание'], 100, 310, 22, RULE, [0, 1, 2, 3].map(i => m('list', i * .6)));
    L(p, [['КБ', C0], [' — тоже СЛ: падает и он', DIM]], 100, 400, m('ac'), 28);
    L(p, [['в конце каждого своего хода: ', C0], ['значение − 1', RULE]], 100, 470, m('tick'), 28);
    // the bandit's numbers with fright 0, 1, 2
    box(p, 800, 110, 700, 370, FOE, m('tab', -.3));
    say(p, 'Разбойник', 830, 160, m('tab', -.3), { size: 26, fill: FOE, weight: 700, anchor: 'start' });
    const cols = [1110, 1260, 1410];
    ['без испуга', 'испуг 1', 'испуг 2'].forEach((s, i) => say(p, s, cols[i], 160, i ? m(['', 'f1', 'f2'][i]) : m('tab'), { size: 22, fill: i ? NO : DIM, weight: 600 }));
    const R = [['Дубинка', ['+7', '+6', '+5']], ['КБ', ['16', '15', '14']], ['СЛ Реакции', ['15', '14', '13']], ['СЛ Воли', ['12', '11', '10']]];
    R.forEach(([n, v], r) => {
      const y = 230 + r * 64;
      say(p, n, 830, y, m('tab', r * .6), { size: 26, anchor: 'start' });
      v.forEach((s, i) => say(p, s, cols[i], y, i ? m(['', 'f1', 'f2'][i], .3 + r * .15) : m('tab', .3 + r * .6), { size: 28, fill: i ? NO : C0, weight: 700 }));
    });
    hr(p, 560, m('dem', -.3));
    L(p, [['Деморализация', HERO], [' (глава 7): ', DIM], ['успех → испуг 1', OK], [' · ', DIM], ['крит. успех → испуг 2', OK]], 100, 640, m('dem'), 30);
  }],
  ['tick', 'Когда испуг спадает', (m) => {
    const p = panel(0);
    title(p, 'Когда испуг спадает');
    const W = 96, cx = (r, i) => 300 + (r * 4 + i) * 104 + W / 2, yT = 205;
    for (let r = 0; r < 3; r++) {
      say(p, 'раунд ' + (r + 1), (cx(r, 0) + cx(r, 3)) / 2, 140, .3, { size: 22, fill: DIM, weight: 600 });
      if (r) draw(path(p, `M${cx(r, 0) - 52} 120V660`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), .3, .4);
    }
    const cur = put(mk('rect', { x: -46, y: -40, width: 92, height: 80, rx: 14, fill: 'none', stroke: RULE, 'stroke-width': 4 }, p), { x: cx(0, 3), y: yT, o: 0 });
    for (let r = 0; r < 3; r++) ORDER.forEach((k, i) => tok(p, PPL[k][0][0], PPL[k][1], cx(r, i), yT, m('ord', i * .5), 28));
    const go = (r, i, t1) => tw(cur, { x: cx(r, i), o: 1 }, t1, .4);
    // one row of fright values; a cell holds the value during that turn, a note under it what the turn sees
    const cell = (y, r, i, v, note, t1, tEnd) => {
      const g = G(p, { o: 0 }), x = cx(r, i) - W / 2;
      if (v) mk('rect', { x, y, width: W, height: 74, rx: 10, fill: NO, 'fill-opacity': .14 + .14 * v, stroke: NO, 'stroke-width': 2 }, g);
      else mk('rect', { x, y, width: W, height: 74, rx: 10, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
      T(g, String(v), { x: x + W / 2, y: y + 50, size: 36, fill: v ? C0 : DIM, weight: 700, anchor: 'middle' });
      if (note) T(g, note, { x: x + W / 2, y: y + 108, size: 21, fill: note[0] === 'К' ? RULE : FOE, weight: 600, anchor: 'middle' });
      if (tEnd != null) {   // the value drops at the end of the bandit's turn
        const b = G(p, { x: x + W, y: y + 4, o: 0 });
        mk('circle', { r: 17, fill: NO }, b);
        T(b, '−1', { y: 7, size: 18, fill: COL.board, weight: 700, anchor: 'middle' });
        show(b, tEnd); pulse(b, tEnd, 1.4);
      }
      show(g, t1);
    };
    const yA = 300, yB = 500;
    say(p, 'итог 14', 100, yA + 30, m('r1'), { size: 26, anchor: 'start' });
    say(p, 'испуг 1', 100, yA + 66, m('r1', .3), { size: 26, fill: NO, weight: 600, anchor: 'start' });
    go(0, 3, m('r1')); cell(yA, 0, 3, 1, '', m('r1', 2.6));
    go(1, 0, m('b2')); cell(yA, 1, 0, 1, 'КБ 15', m('b2', .3)); cell(yA, 1, 1, 1, 'КБ 15', m('b2', .8));
    go(1, 2, m('r2')); cell(yA, 1, 2, 1, '+6', m('r2', .3), m('end', .3));
    go(1, 3, m('s2')); cell(yA, 1, 3, 0, 'КБ 16', m('s2', .3));
    say(p, 'итог 23', 100, yB + 30, m('alt'), { size: 26, anchor: 'start' });
    say(p, 'испуг 2', 100, yB + 66, m('alt', .3), { size: 26, fill: NO, weight: 600, anchor: 'start' });
    go(0, 3, m('alt')); cell(yB, 0, 3, 2, '', m('alt', 1.6));
    go(1, 0, m('alt2')); cell(yB, 1, 0, 2, 'КБ 14', m('alt2', .3)); cell(yB, 1, 1, 2, 'КБ 14', m('alt2', .6)); cell(yB, 1, 2, 2, '+5', m('alt2', 1), m('alt3', .2));
    go(1, 3, m('alt3')); cell(yB, 1, 3, 1, 'КБ 15', m('alt3', .8)); cell(yB, 2, 0, 1, 'КБ 15', m('alt3', 1.3)); cell(yB, 2, 1, 1, 'КБ 15', m('alt3', 1.7));
    go(2, 2, m('alt4')); cell(yB, 2, 2, 1, '+6', m('alt4', .3), m('alt4', 1.2)); cell(yB, 2, 3, 0, 'КБ 16', m('alt4', 1.6));
    tw(cur, { o: 0 }, m('who', -.2), .3);
    say(p, 'значение − 1 в конце хода испуганного, а не того, кто напугал', 800, 730, m('who'), { size: 28, fill: RULE, weight: 600 });
    say(p, 'больше всех выигрывают Бронна и Тиль: они ходят перед разбойником', 800, 785, m('who', 4.6), { size: 25, fill: DIM });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-fr', prompt: ['Разбойник: КБ 16, дубинка +7.'], build: blanks(Q_FR),
  }, {
    id: 'c-fr-tf', prompt: ['Верно или неверно?'], build: grid(Q_FR_TF, TF, { multi: false, text: true }),
  }], done) }],
  ['offguard', 'Застигнут врасплох', (m) => {
    const p = panel(0);
    title(p, 'Застигнут врасплох');
    cond(p, 'застигнут врасплох', null, 100, 160, .3, { size: 30 });
    L(p, [['−2 к КБ', NO]], 100, 260, .6, 34);
    pill(p, 'ситуативный', NO, 340, 250, .9, 24);
    L(p, [['атаки, испытания, навыки — ', C0], ['без изменений', OK]], 100, 340, m('only'), 26);
    // who gains after Shippa's Feint
    tok(p, 'Р', FOE, 1230, 360, m('narrow'), 38);
    tok(p, 'Ш', HERO, 960, 360, m('narrow', .3), 34);
    arrowTo(p, 1000, 360, 1186, 360, OK, m('narrow', .8));
    say(p, 'Шиппа: КБ 14', 1090, 430, m('narrow', 1.4), { size: 24, fill: OK, weight: 700 });
    say(p, 'следующая атака вблизи', 1090, 462, m('narrow', 2.2), { size: 20, fill: DIM });
    tok(p, 'Б', HERO, 1230, 170, m('others'), 34);
    arrowTo(p, 1230, 208, 1230, 316, DIM, m('others', .2));
    say(p, 'Бронна: КБ 16', 1270, 268, m('others', .5), { size: 24, fill: DIM, weight: 700, anchor: 'start' });
    tok(p, 'Т', HERO, 1460, 360, m('others', .4), 34);
    arrowTo(p, 1422, 360, 1274, 360, DIM, m('others', .6));
    say(p, 'Тиль: КБ 16', 1460, 430, m('others', .9), { size: 24, fill: DIM, weight: 700 });
    say(p, 'после Финта', 1230, 120, m('narrow'), { size: 22, fill: DIM });
    L(p, [['сказано просто «застигнут врасплох» → ', C0], ['против всех атак', NO]], 100, 560, m('all'), 28);
    hr(p, 620, m('src', -.3));
    say(p, 'делают:', 100, 700, m('src'), { size: 26, fill: DIM, anchor: 'start' });
    pill(p, 'Финт', HERO, 300, 690, m('src', .6), 26);
    pill(p, 'Лазание', HERO, 470, 690, m('src', 1.2), 26);
    pill(p, 'взятие в тиски', HERO, 720, 690, m('src', 1.8), 26);
    say(p, 'входит в:', 100, 800, m('in'), { size: 26, fill: DIM, anchor: 'start' });
    cond(p, 'распластанность', null, 240, 790, m('in', 1.4), { size: 24 });
