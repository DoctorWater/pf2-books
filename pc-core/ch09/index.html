<script>
'use strict';
const CHAPTER = { number: 9, title: 'Удар и урон', minutes: 13, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Attribute modifier HERO, proficiency and dice RULE (ch03); hits OK, misses, penalties and lost HP NO.
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch08).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// A die outline of `sides` with the rolled number inside, no label.
function dieNum(p, sides, n, x, y, t0, size = 44, colr = RULE) {
  const d = dieShape(p, sides, x, y, colr, t0, size, null, false);
  T(d, String(n), { y: size * .3, size: size * .8, fill: colr, weight: 700, anchor: 'middle' });
  return d;
}
// Pills in a row centred on cx (as in ch07).
const pw = (s, size) => s.length * size * .56 + 44;
function pillRow(p, items, cx, y, size, colr, t0s) {
  const w = items.map(s => pw(s, size)), tot = w.reduce((a, b) => a + b + 18, -18);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, colr, x + w[i] / 2, y, t0s[i], size); x += w[i] + 18; return g; });
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f with a degree of success (DEG key).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);   // paint lies over the numbers; the fill is translucent, so they stay readable
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}
// A vertical bar on baseline y that grows to height h at t0.
function bar(p, x, y, w, h, colr, t0, { op = .45, dash = false } = {}) {
  const r = mk('rect', { x: x - w / 2, y, width: w, height: 0, rx: 6, fill: dash ? 'none' : colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5, ...(dash ? { 'stroke-dasharray': '8 6' } : {}) }, p);
  prog(q => { r.setAttribute('y', y - h * q); r.setAttribute('height', h * q); }, t0, .6, out);
  return r;
}
// A ring with a letter, no name under it (tight diagrams).
function tok(p, letter, colr, x, y, t0, r = 34) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Удар и урон', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 4 «Бой» · Глава 9', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Удар и урон', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'попала ли атака и сколько она сняла', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['table', 'За столом', (m) => {
    const p = panel(0);
    title(p, 'За столом');
    who(p, 'Шиппа', HERO, 260, 400, .3, 56);
    who(p, 'Разбойник', FOE, 520, 400, .4, 56);
    arrowTo(p, 325, 400, 455, 400, HERO, .7);
    bubble(p, 'Бью рапирой: на кубике 11, итог 17', 400, 230, HERO, m('say'), { size: 26, side: 'left' });
    who(p, 'Ведущий', GMC, 1000, 400, m('gm', -.4), 56);
    box(p, 1110, 330, 400, 140, FOE, m('gm'));
    say(p, 'Разбойник · знает ведущий', 1140, 380, m('gm'), { size: 24, fill: FOE, weight: 700, anchor: 'start' });
    say(p, 'КБ 16', 1140, 440, m('gm', .3), { size: 34, weight: 700, anchor: 'start' });
    L(p, [['17 ≥ КБ 16 → ', COL.chalk], ['попадание', OK]], 820, 560, m('hit'), 34);
    dieShape(p, 6, 400, 690, RULE, m('dmg'), 50);
    L(p, [['кубик урона рапиры', RULE]], 490, 700, m('dmg', .4), 30);
  }],
  ['strike', 'Действие Удар', (m) => {
    const p = panel(0);
    title(p, 'Действие Удар');
    glyph(p, 1, 130, 140, .3, .55);
    say(p, 'Удар', 170, 152, .3, { size: 36, weight: 700, anchor: 'start' });
    say(p, 'одно действие из трёх за ход', 290, 152, .5, { size: 26, fill: COL.dim, anchor: 'start' });
    pill(p, 'атака', RULE, 840, 140, m('trait'), 28);
    say(p, '→ штраф за последовательные атаки', 920, 150, m('trait', 1), { size: 25, fill: COL.dim, anchor: 'start' });
    L(p, [['оружие или безоружная атака · ', COL.chalk], ['цель всегда одна', RULE]], 100, 240, m('how'), 28);
    // melee: the target in the next cell; ranged: within the weapon's range
    const cells = G(p, { o: 0 });
    for (let i = 0; i < 3; i++) mk('rect', { x: 120 + i * 100, y: 300, width: 94, height: 94, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, cells);
    show(cells, m('melee'));
    tok(p, 'Ш', HERO, 167, 347, m('melee'));
    tok(p, 'Р', FOE, 267, 347, m('melee', .2));
    say(p, 'ближний бой: рядом,', 440, 340, m('melee', .4), { size: 26, anchor: 'start' });
    say(p, 'обычно соседняя клетка', 440, 378, m('melee', .6), { size: 24, fill: COL.dim, anchor: 'start' });
    tok(p, 'Ш', HERO, 880, 347, m('ranged'));
    arrowTo(p, 925, 347, 1150, 347, HERO, m('ranged', .3), true);

    say(p, 'дальний бой: в пределах дистанции', 1040, 300, m('ranged', .6), { size: 24, fill: COL.dim });

    const G4 = [['cs', '×2', 'двойной урон'], ['s', 'урон', 'обычный'], ['f', '—', 'ничего'], ['cf', '—', 'ничего']];
    G4.forEach(([k, v, s], i) => {
      const [, name, colr, op] = DEG.find(d => d[0] === k), x = 120 + i * 350, t0 = m(k === 'cf' ? 'f' : k, k === 'cf' ? 1.2 : 0);
      const r = mk('rect', { x, y: 520, width: 320, height: 200, rx: 14, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, p);
      put(r, { o: 0 }); show(r, t0);
      say(p, name, x + 160, 568, t0, { size: 26, weight: 700 });
      say(p, v, x + 160, 640, t0 + .2, { size: 48, fill: COL.chalk, weight: 700 });
      say(p, s, x + 160, 690, t0 + .3, { size: 22, fill: COL.chalk });
    });
  }],
  ['unarmed', 'Безоружная атака', (m) => {
    const p = panel(0);
    title(p, 'Безоружная атака');
    say(p, 'почти все классы обучают ей с 1-го уровня, барда тоже', 800, 130, .4, { size: 26, fill: COL.dim });
    box(p, 100, 190, 680, 560, HERO, m('fist', -.3));
    say(p, 'Кулак', 140, 250, m('fist', -.3), { size: 34, fill: HERO, weight: 700, anchor: 'start' });
    dieShape(p, 4, 220, 380, RULE, m('fist'), 56);
    say(p, 'дробящий', 220, 520, m('fist', .6), { size: 26 });
    ['быстрое', 'фехтовальное', 'несмертельное', 'безоружное'].forEach((s, i) => pill(p, s, RULE, 560, 300 + i * 100, m('tr', .8 + i * .9), 28));
    infoCard(p, 840, 190, 680, 'Несмертельное', [['не убивает, а лишает сознания'], ['подробно — глава 11', COL.dim]], RULE, m('nl'));
    infoCard(p, 840, 420, 680, 'Насмерть', [['можно, но с −2 к атаке', NO]], NO, m('kill'));
    infoCard(p, 840, 590, 680, 'Кулак — не оружие', [['правила для оружия на него не действуют,'], ['если не сказано отдельно', COL.dim]], COL.dim, m('nw'));
  }],
  ['attack', 'Проверка атаки', (m) => {
    const p = panel(0);
    title(p, 'Проверка атаки');
    say(p, 'против класса брони (КБ) цели', 800, 122, .4, { size: 26, fill: COL.dim });
    const row = (label, attr, y, t0) => {
      say(p, label, 100, y, t0, { size: 26, fill: COL.dim, anchor: 'start' });
      numDie(p, '?', 400, y - 10, t0 + .2, 30);
      return L(p, [['+ ' + attr, HERO], [' + умение с оружием', RULE], [' + прочие бонусы и штрафы', COL.dim]], 450, y, t0 + .4, 30);
    };
    row('ближний бой', 'Сила', 230, m('melee'));
    row('дальний бой', 'Ловкость', 330, m('ranged'));
    pill(p, 'фехтовальное', RULE, 210, 440, m('fin'), 28);
    L(p, [['ближний бой: ', COL.chalk], ['Ловкость', HERO], [' вместо Силы', COL.chalk]], 360, 450, m('fin', .4), 28);
    hr(p, 510, m('ship', -.3));
    say(p, 'Шиппа', 100, 570, m('ship', -.2), { size: 28, fill: HERO, weight: 700, anchor: 'start' });
    [['рапира', 'фехтовальное'], ['кинжал', 'фехтовальное'], ['кулак', 'фехтовальное'], ['праща', 'дальний бой']].forEach(([w, s], i) => {
      pill(p, w, HERO, 340 + i * 280, 600, m('ship', .3 + i * .5), 30);
      say(p, s, 340 + i * 280, 670, m('ship', .5 + i * .5), { size: 22, fill: COL.dim });
    });
    colorLine(p, [['Ловкость +3', HERO], [' + ', COL.chalk], ['изучен +3', RULE], [' = ', COL.chalk], ['+6', RULE], [' с любым её оружием', COL.chalk]], 800, 780, m('sum'), { size: 36 });
  }],
  ['scale', 'Рапира +6 против КБ 16', (m) => {
    const p = panel(0);
    title(p, 'Рапира +6 против КБ 16');
    const F = faces(p, 170, 260, .3, { w: 62 });
    say(p, 'кубик', 150, 310, .3, { size: 22, fill: COL.dim, anchor: 'end' });
    say(p, 'итог', 150, 400, .5, { size: 22, fill: COL.dim, anchor: 'end' });
    const tot = G(p, { o: 0 });
    for (let f = 1; f <= 20; f++) T(tot, String(f + 6), { x: F.cx(f), y: 400, size: 24, fill: COL.dim, anchor: 'middle' });
    show(tot, .5);
    const xAC = (F.X(9) + F.w + F.X(10)) / 2;
    draw(path(p, `M${xAC} 228V420`, { stroke: RULE, 'stroke-width': 4 }, { d: 0 }), .6, .4);
    say(p, 'КБ 16', xAC, 214, .7, { size: 24, fill: RULE, weight: 700 });
    for (let f = 10; f <= 19; f++) F.paint(f, 's', m('ten', .6 + (f - 10) * .06));
    for (let f = 2; f <= 9; f++) F.paint(f, 'f', m('nine', .3 + (9 - f) * .05));
    F.paint(20, 'cs', m('twenty', 1.4));
    F.paint(1, 'cf', m('one', 2.8));
    const band = (a, b, s, colr, t0) => say(p, s, (F.X(a) + F.X(b) + F.w) / 2, 470, t0, { size: a === b ? 21 : 24, fill: colr, weight: 700 });
    band(10, 19, 'попадание', OK, m('ten', 1.4));
    band(2, 9, 'промах', NO, m('nine', .8));
    band(20, 20, 'крит. попадание', OK, m('twenty', 1.6));
    band(1, 1, 'крит. провал', NO, m('one', 3));
    pulse(tot.children[9], m('ten'), 1.4); pulse(tot.children[8], m('nine'), 1.4); pulse(tot.children[19], m('twenty'), 1.4);
    pulse(tot.children[18], m('n19'), 1.4); pulse(tot.children[0], m('one'), 1.4);
    L(p, [['10 + 6 = 16 ≥ 16 → ', COL.chalk], ['попадание', OK], [' (равный итог — тоже)', COL.dim]], 170, 570, m('ten', .4));
    L(p, [['9 + 6 = 15 < 16 → ', COL.chalk], ['промах', NO]], 170, 620, m('nine', .3));
    L(p, [['20 + 6 = 26 = 16 + 10 → ', COL.chalk], ['критическое попадание', OK]], 170, 670, m('twenty', .3));
    L(p, [['19 + 6 = 25, на 9 больше → ', COL.chalk], ['обычное попадание', OK]], 170, 720, m('n19', .3));
    L(p, [['натуральная 1: 7 → ', COL.chalk], ['критический провал', NO], [' · для Удара — тот же промах', COL.dim]], 170, 770, m('one', 1));
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-hit', prompt: ['Шиппа бьёт рапирой (+6), у разбойника КБ 16.'], build: blanks(Q_HIT),
  }, {
    id: 'c-hit-tf', prompt: ['Верно или неверно?'], build: grid(Q_HIT_TF, TF, { multi: false, text: true }),
  }], done) }],
  ['map', 'Штраф за последовательные атаки', (m) => {
    const p = panel(0);
    title(p, 'Штраф за последовательные атаки');
    colorLine(p, [['2-я атака за ход ', COL.chalk], ['−5', NO]], 560, 136, m('second'), { size: 30 });
    colorLine(p, [['3-я и дальше ', COL.chalk], ['−10', NO]], 1060, 136, m('third'), { size: 30 });
    const R = [['1-й удар', '+6', 10, 'r1', '10–20 · 11 из 20'], ['2-й удар', '+1', 15, 'r2', '15–20 · 6 из 20'], ['3-й удар', '−4', 20, 'r3', 'только 20 · 1 из 20']];
    const ry = i => 190 + i * 210, Fs = [];
    R.forEach(([name, mod, need, mark, txt], i) => {
      const t0 = m(mark, -.3), y = ry(i);
      say(p, name, 100, y + 38, t0, { size: 26, anchor: 'start' });
      say(p, mod, 100, y + 76, t0, { size: 30, fill: i ? NO : RULE, weight: 700, anchor: 'start' });
      const F = faces(p, 280, y, t0, { w: 52, h: 76, size: 22 });
      Fs.push(F);
      for (let f = need; f <= 20; f++) F.paint(f, f === 20 ? 'cs' : 's', m(mark, .6 + (f - need) * .05));
      const x = (F.X(need - 1) + F.w + F.X(need)) / 2;
      draw(path(p, `M${x} ${y - 14}V${y + 90}`, { stroke: RULE, 'stroke-width': 4 }, { d: 0 }), m(mark, .3), .4);
      say(p, 'попадает: ' + txt, F.X(20) + F.w, y + 110, m(mark, 1.6), { size: 24, fill: OK, weight: 600, anchor: 'end' });
      if (i) {   // the threshold moves five faces to the right
        const x0 = (Fs[i - 1].X(need - 6) + F.w + Fs[i - 1].X(need - 5)) / 2;
        arrowTo(p, x0, y - 30, x - 6, y - 30, NO, m(mark, .2));
        say(p, '+5 граней', (x0 + x) / 2, y - 42, m(mark, .4), { size: 20, fill: NO, weight: 600 });
      }
    });
    Fs.forEach(F => pulse(F.paint(20, 'cs', m('crit')), m('crit', .2), 1.15));
    say(p, 'критическое попадание — только на 20', 800, 850, m('crit', .5), { size: 26, fill: RULE, weight: 600 });
  }],
  ['why', 'Шансы в урон', (m) => {
    const p = panel(0);
    title(p, 'Шансы в урон');
    L(p, [['рапира в среднем: попадание ', COL.chalk], ['3,5', RULE], [' · крит ', COL.chalk], ['11,5', RULE]], 100, 140, m('avg'), 28);
    const base = 700, k = 160, V = [[2.3, 'e1'], [1.5, 'e2'], [0.6, 'e3']], bx = i => 220 + i * 220;
    draw(path(p, `M120 ${base}H760`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('e1', -.4), .4);
    say(p, 'средний урон за удар', 100, 220, m('e1', -.4), { size: 24, fill: COL.dim, anchor: 'start' });
    V.forEach(([v, mark], i) => {
      bar(p, bx(i), base, 120, v * k, i ? NO : OK, m(mark));
      say(p, '≈ ' + String(v).replace('.', ','), bx(i), base - v * k - 18, m(mark, .5), { size: 30, weight: 700 });
      say(p, ['1-й', '2-й', '3-й'][i], bx(i), base + 40, m(mark), { size: 26, fill: COL.dim });
    });
    [1, 2].forEach(i => bar(p, bx(i), base, 120, 2.3 * k, COL.dim, m('flat', .4 + i * .3), { dash: true }));
    say(p, 'пунктир — без штрафа', 440, base + 90, m('flat', 1.2), { size: 22, fill: COL.dim });
    box(p, 840, 200, 680, 600, RULE, m('flat', -.3));
    say(p, 'без штрафа три удара подряд —', 880, 260, m('flat'), { size: 26, anchor: 'start' });
    say(p, 'всегда лучший ход', 880, 300, m('flat', .6), { size: 26, anchor: 'start' });
    say(p, 'третье действие лучше потратить на другое:', 880, 380, m('other'), { size: 25, fill: RULE, weight: 600, anchor: 'start' });
    const tc = turnCells(p, 880, 420, m('other'), { w: 190, h: 112, react: false });
    tc.spend(0, 'Удар', m('other', .5)); tc.spend(1, 'Удар', m('other', .9));
    say(p, '?', tc.X(2) + 95, 518, m('other', 1.2), { size: 34, fill: RULE, weight: 700 });
    [['Финт (перед ударами)', 'feint'], ['Шаг', 'step'], ['зарядить пращу', 'load']].forEach(([s, mark], i) => pill(p, s, HERO, 1180, 610 + i * 64, m(mark), 24));
  }],
  ['agile', 'Быстрое оружие', (m) => {
    const p = panel(0);
    title(p, 'Быстрое оружие: −4 и −8');
    const cols = [480, 790, 1100], head = ['1-й удар', '2-й удар', '3-й удар'];
    head.forEach((s, i) => say(p, s, cols[i], 150, .3, { size: 22, fill: COL.dim }));
    say(p, 'урон', 1380, 150, .3, { size: 22, fill: COL.dim });
    hr(p, 170, .3, 100, 1500);
    // a small strip of the twenty faces: hits filled
    const mini = (x, y, need, t0) => {
      const g = G(p, { o: 0 });
      for (let f = 1; f <= 20; f++) mk('rect', { x: x - 130 + (f - 1) * 13, y, width: 11, height: 26, rx: 2, fill: f >= need ? OK : COL.faint, 'fill-opacity': f >= need ? .7 : .35 }, g);
      show(g, t0);
    };
    const R = [['рапира', [['+6', 10, '10–20', '11 из 20'], ['+1', 15, '15–20', '6 из 20'], ['−4', 20, '20', '1 из 20']], 'd6', 250, null],
      ['кинжал', [['+6', 10, '10–20', '11 из 20'], ['+2', 14, '14–20', '7 из 20'], ['−2', 18, '18–20', '3 из 20']], 'd4', 420, 'dag']];
    const cnt = [];
