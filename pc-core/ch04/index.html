<script>
'use strict';
const CHAPTER = { number: 4, title: 'Народ, родословная, происхождение', minutes: 12, language: 'ru', next: '../ch05/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Attribute modifier, boost (+1), flaw (−1); ancestry Hit Points as in ch03.
const ATTR = HERO, BOOST = RULE, FLAW = NO, ANC = COL.dim;
const hr = (p, y, t0, x1 = 120, x2 = 1480) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
// Attribute board helpers (attrBoard, bump, give, clearBoard, boostToken, ATTRS, CH, sgn) live in lib/pf.js.
// A body outline of height h standing on (x, base).
function figure(p, x, base, h, colr, t0) {
  const g = G(p, { x, y: base, o: 0 }), r = h * .13;
  mk('circle', { cx: 0, cy: -h + r, r, fill: 'none', stroke: colr, 'stroke-width': 3 }, g);
  mk('rect', { x: -h * .17, y: -h + 2 * r + 6, width: h * .34, height: h - 2 * r - 6, rx: h * .1, fill: 'none', stroke: colr, 'stroke-width': 3 }, g);
  show(g, t0);
  return g;
}

// Player Core ancestries: name, HP, size, Speed, boosts, flaw (PC1 p. 44–72).
const PEOPLES = [
  ['Дварф', '10', 'Средний', '20 футов', 'Выносливость, Мудрость, универсальное', 'Харизма'],
  ['Эльф', '6', 'Средний', '30 футов', 'Ловкость, Интеллект, универсальное', 'Выносливость'],
  ['Гном', '8', 'Небольшой', '25 футов', 'Выносливость, Харизма, универсальное', 'Сила'],
  ['Гоблин', '6', 'Небольшой', '25 футов', 'Ловкость, Харизма, универсальное', 'Мудрость'],
  ['Полурослик', '6', 'Небольшой', '25 футов', 'Ловкость, Мудрость, универсальное', 'Сила'],
  ['Человек', '8', 'Средний', '25 футов', 'два универсальных', '—'],
  ['Леший', '8', 'Небольшой', '25 футов', 'Выносливость, Мудрость, универсальное', 'Интеллект'],
  ['Орк', '10', 'Средний', '25 футов', 'два универсальных', '—'],
];
const FOLK = [
  ['Дварфы', ['невысокие, крепкие', 'и упрямые; ценят ремесло', 'и данное слово'], 'dw'],
  ['Эльфы', ['живут очень долго', 'быстрее всех на ногах'], 'el'],
  ['Гномы', ['маленькие, любопытные', 'в родстве с феями'], 'gn'],
  ['Гоблины', ['шумные, неунывающие', 'их долго боялись —', 'доказывают, что они', 'не такие'], 'gb'],
  ['Полурослики', ['любят приключения', 'и домашний уют', 'славятся везучестью'], 'hf'],
  ['Люди', ['самые разные', 'легко собрать', 'под любой класс'], 'hu'],
  ['Лешие', ['духи природы', 'в небольших телах', 'из растений'], 'le'],
  ['Орки', ['сильные, выносливые', 'ценят мощь', 'и славу в бою'], 'or'],
];
// Backgrounds (PC1 p. 85–86): name, boost choice, skill, Lore, skill feat.
const BGS = [
  ['Трактирщик', 'Выносливость или Харизма', 'Дипломатия', 'Знание (выпивка)', 'Неформальное общение'],
  ['Послушник', 'Интеллект или Мудрость', 'Религия', 'Знание (письмо)', 'Знаток канонов'],
  ['Акробат', 'Сила или Ловкость', 'Акробатика', 'Знание (цирк)', 'Устойчивое равновесие'],
  ['Ремесленник', 'Сила или Интеллект', 'Ремесло', 'Знание (гильдии)', 'Ремесленник-специалист'],
];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Народ, родословная, происхождение', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Создание героя» · Глава 4', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Народ, родословная, происхождение', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'кто герой по рождению и чем жил до приключений', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['concept', 'За кого вы хотите играть', (m) => {
    const p = panel(0);
    say(p, 'За кого вы хотите играть?', 800, 80, .2, { size: 40, weight: 600 });
    bubble(p, 'храбрый воин', 420, 190, HERO, m('short'));
    bubble(p, 'эльф, который вырос среди людей и сбежал из академии', 900, 290, HERO, m('long'), { size: 25 });
    colorLine(p, [['или наоборот: понравился ', COL.dim], ['народ', COL.chalk], [' или ', COL.dim], ['класс', COL.chalk], [' — образ складывается вокруг', COL.dim]], 800, 400, m('rules'), { size: 28 });
    hr(p, 450, m('group', -.4));
    const xs = [560, 800, 1040], y = 540;
    ['Тарн', 'Ива', 'Бор'].forEach((n, i) => who(p, n, HERO, xs[i], y, m('group', .2 + i * .2), 40));
    [0, 1].forEach(k => draw(path(p, `M${xs[k] + 52} ${y}H${xs[k + 1] - 52}`, { stroke: HERO, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { d: 0 }), m('ties', k * .3), .5));
    say(p, 'общее прошлое: родственники, соседи, бывали в переделках вместе', 800, 676, m('ties', .4), { size: 26, fill: COL.dim });
    say(p, 'три выбора по правилам', 800, 752, m('three'), { size: 26, fill: COL.dim, weight: 600 });
    const sx = [520, 800, 1080];
    [['народ', 'anc'], ['происхождение', 'bg'], ['класс', 'cls']].forEach(([s, mark], i) => {
      pill(p, s, COL.chalk, sx[i], 808, m(mark), 28);
      if (i) arrowTo(p, sx[i - 1] + (i === 1 ? 68 : 132), 808, sx[i] - (i === 1 ? 132 : 68), 808, COL.dim, m(mark));
    });
    colorLine(p, [['каждый ', COL.dim], ['поднимает характеристики', ATTR]], 800, 872, m('attrs'), { size: 26 });
  }],
  ['boosts', 'Повышения и понижения', (m) => {
    const p = panel(0);
    say(p, 'Повышения и понижения', 800, 70, .2, { size: 36, weight: 600 });
    const b = attrBoard(p, 800, 600, .3);
    give(b, boostToken(p, 'повышение +1', 'fix', 300, 260, m('up')), 0, 1, m('up', .6));
    give(b, boostToken(p, 'понижение −1', 'flaw', 1300, 260, m('down')), 5, -1, m('down', .6));
    // three kinds of boost
    const kg = G(p, { o: 1 });
    say(kg, 'три вида повышений', 800, 140, m('kinds'), { size: 26, fill: COL.dim, weight: 600 });
    [['Ловкость', 'fix', 'конкретная', 'fix'], ['Сила или Ловкость', 'fix', 'одна из двух', 'two'], ['любая', 'free', 'универсальное', 'free']]
      .forEach(([s, k, cap, mark], i) => { boostToken(kg, s, k, 400 + i * 400, 210, m(mark)); say(kg, cap, 400 + i * 400, 272, m(mark, .3), { size: 24, fill: COL.dim }); });
    hide(kg, m('rule1', -.2), .4);
    // rule 1: boosts gained together go to different attributes
    clearBoard(b, m('rule1'));
    say(p, '1. Полученные одновременно — в разные характеристики', 800, 150, m('rule1', .3), { size: 28, weight: 600 });
    const lx = b.cols[1].x;
    give(b, boostToken(p, 'народ', 'fix', 360, 290, m('twice')), 1, 1, m('twice', .5));
    const n2 = boostToken(p, 'народ', 'fix', 520, 290, m('twice', .2));
    tw(n2, { x: lx, y: b.y0 - 1.5 * CH }, m('twice', .9), .6);
    tw(n2.firstChild, { c_stroke: NO, c_fill: mix(COL.board, NO, .3) }, m('twice', 1.5), .3);
    tw(n2.lastChild, { c_fill: NO }, m('twice', 1.5), .3);
    draw(path(n2, 'M-58 -20L58 20', { stroke: NO, 'stroke-width': 5 }, { d: 0 }), m('twice', 1.7), .3);
    const no = say(p, 'второе от народа — нельзя', lx, b.capY - 24, m('twice', 1.7), { size: 26, fill: NO, weight: 700 });
    hide(n2, m('later', 1.2), .3); hide(no, m('later', 1.2), .3);
    give(b, boostToken(p, 'происхождение', 'fix', 1000, 290, m('later')), 1, 1, m('later', 1.6));
    const yes = say(p, 'следующий шаг — можно', lx, b.capY - 24, m('later', 2.4), { size: 26, fill: OK, weight: 700 });
    hide(yes, m('cap', -.3), .3);
    // rule 2: the +4 line
    say(p, '2. На 1-м уровне — не выше +4', 800, 205, m('cap'), { size: 28, weight: 600 });
    tw(b.cap, { c_stroke: BOOST, 'a_stroke-width': 4 }, m('cap', .4), .4);
    say(p, 'предел +4', b.xR + 8, b.capY + 8, m('cap', .5), { size: 24, fill: BOOST, weight: 700, anchor: 'start' });
    const ghost = mk('rect', { x: lx - b.cw / 2, y: b.capY - CH + 3, width: b.cw, height: CH - 6, rx: 6, fill: 'none', stroke: NO, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, p);
    put(ghost, { o: 0 }); show(ghost, m('cap', 1.4));
    draw(path(p, `M${lx - 40} ${b.capY - CH + 6}L${lx + 40} ${b.capY - 6}`, { stroke: NO, 'stroke-width': 4 }, { d: 0 }), m('cap', 1.7), .3);
    say(p, '+5 — нельзя', lx + 64, b.capY - CH / 2 + 8, m('cap', 1.7), { size: 22, fill: NO, weight: 700, anchor: 'start' });
  }],
  ['sources', 'Откуда повышения', (m) => {
    const p = panel(0);
    say(p, 'Откуда повышения', 800, 70, .2, { size: 36, weight: 600 });
    const rows = [
      ['народ', 'anc', [['повышение', 'fix'], ['повышение', 'fix'], ['любая', 'free'], ['понижение (иногда)', 'flaw']], 'глава 4', .3],
      ['происхождение', 'bg', [['одна из двух', 'fix'], ['любая', 'free']], 'глава 4', .3],
      ['класс', 'cls', [['ключевая', 'fix']], 'глава 5', 2.2],
      ['в конце', 'end', [['любая', 'free'], ['любая', 'free'], ['любая', 'free'], ['любая', 'free']], 'глава 6', 3.6],
    ];
    rows.forEach(([name, mark, toks, ch, dt], i) => {
      const y = 200 + i * 150;
      say(p, name, 120, y + 10, .4 + i * .1, { size: 32, weight: 700, anchor: 'start' });
      let x = 480;
      toks.forEach(([s, k], j) => { const w = uiW(s, 24) + 40; boostToken(p, s, k, x + w / 2, y, m(mark, .3 + j * .35)); x += w + 24; });
      say(p, ch, 1480, y + 10, m('now', dt), { size: 26, fill: COL.dim, anchor: 'end' });
    });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-rules', prompt: ['Можно или нельзя?'], build: grid(Q_RULES, CAN, { multi: false, text: true }),
  }], done) }],
  ['ancestry', 'Народ', (m) => {
    const p = panel(0);
    say(p, 'Народ', 800, 70, .2, { size: 36, weight: 600 });
    say(p, 'дварфы, эльфы, люди, гоблины и другие', 800, 118, .5, { size: 26, fill: COL.dim });
    who(p, 'Дварф', HERO, 250, 250, m('dw'), 56);
    // sizes to scale: Small is half of Medium
    const md = figure(p, 170, 790, 300, COL.chalk, m('size'));
    say(p, 'Средний', 170, 832, m('size'), { size: 24, weight: 600 });
    say(p, '≈ взрослый человек', 160, 864, m('size', .4), { size: 20, fill: COL.dim });
    figure(p, 380, 790, 150, COL.chalk, m('small'));
    say(p, 'Небольшой', 380, 832, m('small'), { size: 24, weight: 600 });
    say(p, '≈ вдвое меньше', 390, 864, m('small', .4), { size: 20, fill: COL.dim });
    pulse(md, m('mid'), 1.08);
    say(p, 'дварф', 170, 466, m('mid'), { size: 24, fill: HERO, weight: 700 });
    // the ancestry card fills row by row
    const box = mk('rect', { x: 530, y: 150, width: 970, height: 620, rx: 18, fill: '#22322d', stroke: HERO, 'stroke-width': 2.5 }, p);
    put(box, { o: 0 }); show(box, .3);
    const labels = ['ПЗ 1-го уровня', 'Размер', 'Скорость', 'Повышения', 'Понижение', 'Языки', 'Особое', 'Черта народа'];
    const ry = i => 210 + i * 72;
    labels.forEach((s, i) => say(p, s, 560, ry(i) + 9, .5 + i * .06, { size: 24, fill: COL.dim, anchor: 'start' }));
    const vx = 820, v = (s, i, t0, opts = {}) => say(p, s, vx, ry(i) + 10, t0, { size: 28, weight: 600, anchor: 'start', ...opts });
    v('10', 0, m('hp', .3), { size: 30, weight: 700 });
    say(p, '+ ПЗ класса — позже', vx + 60, ry(0) + 10, m('hp', 2.2), { size: 24, fill: COL.dim, anchor: 'start' });
    v('Средний', 1, m('mid'));
    v('20 футов', 2, m('spd', .4));
    let x = vx;
    [['Выносливость', 'fix'], ['Мудрость', 'fix'], ['любая', 'free']].forEach(([s, k], j) => {
      const w = uiW(s, 24) + 40; boostToken(p, s, k, x + w / 2, ry(3), m('boost', .2 + j * .55)); x += w + 18;
    });
    boostToken(p, 'Харизма', 'flaw', vx + (uiW('Харизма', 24) + 40) / 2, ry(4), m('flaw', .2));
    v('всеобщий, язык дварфов', 5, m('lang', .4));
    v('видит в темноте (ночное зрение)', 6, m('sense', .6));
    v('1-й уровень', 7, m('feat', .4));
    say(p, 'потом 5, 9, 13 и 17-й', vx + uiW('1-й уровень', 28) + 24, ry(7) + 10, m('more', .6), { size: 26, fill: COL.dim, anchor: 'start' });
  }],
  ['folk', 'Народы коротко', (m) => {
    const p = panel(0);
    say(p, 'Народы Player Core', 800, 70, .2, { size: 36, weight: 600 });
    FOLK.forEach(([name, lines, mark], i) => {
      const x = 60 + (i % 4) * 375, y = i < 4 ? 130 : 480;
      const r = mk('rect', { x, y, width: 350, height: 310, rx: 18, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2.5 }, p);
      put(r, { o: 0 }); show(r, .3 + i * .06);
      say(p, name, x + 26, y + 54, .4 + i * .06, { size: 32, fill: HERO, weight: 700, anchor: 'start' });
      tw(r, { c_stroke: HERO }, m(mark), .3);
      lines.forEach((ln, j) => say(p, ln, x + 26, y + 112 + j * 42, m(mark, .2 + j * .4), { size: 24, anchor: 'start' }));
    });
  }],
  ['peoples', 'Народы в цифрах', (m) => {
    const p = panel(0);
    say(p, 'Народы Player Core', 800, 70, .2, { size: 36, weight: 600 });
    const cx = [100, 360, 520, 690, 800, 1290], an = ['start', 'middle', 'middle', 'middle', 'start', 'start'];
    ['Народ', 'ПЗ', 'Размер', 'Скорость', 'Повышения', 'Понижение'].forEach((s, j) => say(p, s, cx[j], 150, .3, { size: 22, fill: COL.dim, weight: 600, anchor: an[j] }));
    const ry = i => 205 + i * 52;
    const cell = PEOPLES.map((row, i) => row.map((s, j) => say(p, s, cx[j], ry(i), .4 + i * .08, { size: j ? 24 : 26, weight: j ? 500 : 700, anchor: an[j] })));
    // a frame walks over the columns
    const fr = mk('rect', { x: 316, y: 166, width: 88, height: 420, rx: 12, fill: 'none', stroke: BOOST, 'stroke-width': 3 }, p);
    put(fr, { o: 0 }); show(fr, m('hp'), .3);
    const hl = (i, j, t0, t1) => { tw(cell[i][j], { c_fill: HERO }, t0, .3); if (t1) tw(cell[i][j], { c_fill: COL.chalk }, t1, .3); };
    [0, 7].forEach(i => hl(i, 1, m('hp', 2.2), m('sm', -.2)));
    tw(fr, { a_x: 436, a_width: 168 }, m('sm', -.3), .5);
    [2, 3, 4, 6].forEach((i, k) => hl(i, 2, m('sm', .2 + k * .5), m('spd', -.2)));
    tw(fr, { a_x: 626, a_width: 128 }, m('spd', -.3), .5);
    hl(0, 3, m('dw')); hl(1, 3, m('el'));
    tw(fr, { a_x: 786, a_width: 700, a_y: 440, a_height: 152 }, m('free', -.3), .5);
    hide(fr, m('pc2', -.3), .3);
    [5, 7].forEach(i => { hl(i, 4, m('free', .4)); hl(i, 5, m('free', .4)); });
    // Player Core 2
    hr(p, 630, m('pc2', -.4));
    say(p, 'Player Core 2', 800, 690, m('pc2'), { size: 26, fill: COL.dim, weight: 600 });
    const pc2 = ['котолюд', 'хобгоблин', 'холо', 'кобольд', 'людоящер', 'крысолюд', 'тэнгу', 'трипки'];
    const ws = pc2.map(s => uiW(s, 24) + 44), W = ws.reduce((a, b) => a + b, 0) + 16 * 7;
    let x = 800 - W / 2;
    pc2.forEach((s, i) => { pill(p, s, COL.chalk, x + ws[i] / 2, 754, m('pc2', 1.2 + i * .45), 24); x += ws[i] + 16; });
    colorLine(p, [['все — ', COL.dim], ['необычные', COL.chalk], [': сначала обсудите с ', COL.dim], ['ведущим', GMC]], 800, 848, m('unc'), { size: 28 });
  }],
  ['swap', 'Замена повышений народа', (m) => {
    const p = panel(0);
    say(p, 'Замена повышений народа', 800, 70, .2, { size: 36, weight: 600 });
    const b = attrBoard(p, 800, 560, .3);
    const c1 = say(p, 'обычный полурослик', 800, 140, m('std'), { size: 28, fill: COL.dim, weight: 600 });
    give(b, boostToken(p, 'Ловкость', 'fix', 560, 260, m('std', .2)), 1, 1, m('std', 1.2));
    give(b, boostToken(p, 'Мудрость', 'fix', 760, 260, m('std', .5)), 4, 1, m('std', 1.8));
    give(b, boostToken(p, 'любая', 'free', 960, 260, m('sfree')), 2, 1, m('sfree', 1.5));
    give(b, boostToken(p, 'Сила', 'flaw', 1140, 260, m('sflaw')), 0, -1, m('sflaw', .6));
    clearBoard(b, m('swap'));
    hide(c1, m('swap'), .3);
    say(p, 'вместо этого: два универсальных, без понижения', 800, 140, m('swap', .3), { size: 28, weight: 600 });
    give(b, boostToken(p, 'любая', 'free', 680, 260, m('swap', .8)), 0, 1, m('strong', .3));
    give(b, boostToken(p, 'любая', 'free', 920, 260, m('swap', 1)), 2, 1, m('strong', 1));
    say(p, 'сильный полурослик', 800, 200, m('strong', 2), { size: 28, fill: OK, weight: 700 });
    say(p, 'по желанию — лишние понижения: только ради образа, предупредите группу', 800, 800, m('vol'), { size: 26, fill: COL.dim });
    say(p, 'не больше одного понижения на характеристику', 800, 852, m('one'), { size: 26, fill: COL.dim });
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-elf', prompt: ['Эльф: повышения Ловкости и Интеллекта, универсальное — в Силу, понижение Выносливости. Посчитайте модификаторы.'], build: blanks(Q_ELF),
  }, {
    id: 'c-elf2', prompt: ['Тот же эльф берёт вместо этого два универсальных повышения: в Ловкость и в Интеллект.'], build: blanks(Q_ELF2),
  }], done) }],
  ['heritage', 'Родословная', (m) => {
    const p = panel(0);
    say(p, 'Родословная', 800, 70, .2, { size: 36, weight: 600 });
