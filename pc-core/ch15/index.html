'use strict';
const CHAPTER = { number: 15, title: 'Исследование и свободное время', minutes: 14, language: 'ru', next: '../ch16/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Modes: exploration EXP, encounter ENC, downtime DOWN (pf.js). Heroes HERO, the bandit FOE, rules and DCs RULE, money MON.
const MON = COL.int, C0 = COL.chalk, DIM = COL.dim;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch08–ch14).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// A ring with a letter, no name (as in ch09–ch14).
function tok(p, letter, colr, x, y, t0, r = 30) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// Pills in a row centred on cx (as in ch07, ch09, ch13, ch14).
const pw = (s, size) => s.length * size * .56 + 44;
function pillRow(p, items, cx, y, size, colr, t0s) {
  const w = items.map(s => pw(s, size)), tot = w.reduce((a, b) => a + b + 18, -18);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, colr, x + w[i] / 2, y, t0s[i], size); x += w[i] + 18; return g; });
}
// A table: cols [[x, anchor], …], a dim header at y0, rows every dy (cells: text or [text, colour]); t0r(i) — when row i appears.
// hl(i, t, colour) lights row i from behind.
function table(p, cols, head, rows, y0, dy, t0h, t0r, { size = 26, hsize = 21, x1 = 80, x2 = 1520, fill = () => C0 } = {}) {
  const back = G(p), Y = i => y0 + 58 + i * dy;
  head.forEach((s, j) => say(p, s, cols[j][0], y0, t0h, { size: hsize, fill: DIM, weight: 600, anchor: cols[j][1] }));
  hr(p, y0 + 18, t0h, x1, x2);
  rows.forEach((r, i) => r.forEach((c, j) => {
    const [str, colr = fill(i, j)] = [].concat(c);
    say(p, str, cols[j][0], Y(i), t0r(i) + j * .08, { size, fill: colr, weight: 600, anchor: cols[j][1] });
  }));
  return {
    Y,
    hl(i, t1, colr = RULE) {
      const e = mk('rect', { x: x1, y: Y(i) - size - 4, width: x2 - x1, height: size + 20, rx: 10, fill: colr, 'fill-opacity': .14, stroke: colr, 'stroke-width': 2 }, back);
      put(e, { o: 0 }); show(e, t1, .3);
      return e;
    },
  };
}
// A card with a coloured title and short lines [[text, colour, size?], …] every `step` px; lines appear at t0s[i] (or t0).
function pcard(p, x, y, w, h, name, colr, lines, t0, { step = 44, top = 100, t0s = [] } = {}) {
  box(p, x, y, w, h, colr, t0);
  say(p, name, x + 28, y + 50, t0, { size: 28, fill: colr, weight: 700, anchor: 'start' });
  lines.forEach(([s, c = C0, size = 24], i) => say(p, s, x + 28, y + top + i * step, t0s[i] ?? t0 + .3 + i * .3, { size, fill: c, weight: 600, anchor: 'start' }));
}
// A row of n HP cells from x; cells below `cur` are filled; set(v, t) fills or empties them; thr draws the Broken Threshold after cell thr.
function hpCells(p, x, y, n, t0, { cw = 56, h = 56, gap = 6, thr = 0 } = {}) {
  const X = i => x + i * (cw + gap), fills = [];
  const g = G(p, { o: 0 });
  for (let i = 0; i < n; i++) {
    mk('rect', { x: X(i), y, width: cw, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(i + 1), { x: X(i) + cw / 2, y: y + h + 24, size: 18, fill: DIM, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  for (let i = 0; i < n; i++) fills.push(put(mk('rect', { x: X(i), y, width: cw, height: h, rx: 8, fill: HERO, 'fill-opacity': .5, stroke: HERO, 'stroke-width': 2 }, p), { o: 0 }));
  if (thr) {
    const tx = X(thr) - gap / 2, tl = G(p, { o: 0 });
    path(tl, `M${tx} ${y - 14}V${y + h + 34}`, { stroke: NO, 'stroke-width': 4, 'stroke-dasharray': '10 7' });
    T(tl, 'предел прочности 6', { x: tx, y: y + h + 62, size: 20, fill: NO, weight: 600, anchor: 'middle' });
    show(tl, t0 + .4);
  }
  let cur = 0;
  return {
    X,
    set(v, t1, step = .08) {
      const from = cur;
      for (let i = Math.min(from, v); i < Math.max(from, v); i++) tw(fills[i], { o: v > from ? 1 : 0 }, t1 + Math.abs(i - from) * step, .2);
      cur = v;
    },
  };
}
// Downtime calendar: 7 day columns from CAL.x; block(row, d1, d2, …) spans days d1..d2 (0-based).
const CAL = { x: 300, w: 166, gap: 8, y: 190, h: 84, dy: 100 };
const calX = d => CAL.x + d * (CAL.w + CAL.gap);
function calBlock(p, row, d1, d2, label, colr, t0, sub) {
  const x = calX(d1), w = calX(d2) + CAL.w - x, y = CAL.y + row * CAL.dy, g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: CAL.h, rx: 12, fill: colr, 'fill-opacity': .2, stroke: colr, 'stroke-width': 2.5 }, g);
  T(g, label, { x: x + w / 2, y: y + (sub ? 36 : 50), size: 22, fill: C0, weight: 600, anchor: 'middle' });
  if (sub) T(g, sub, { x: x + w / 2, y: y + 66, size: 18, fill: DIM, weight: 600, anchor: 'middle' });
  show(g, t0);
  return g;
}
// The road map: village (left) → mill (right), 1 mile = 400 px.
const MX = mi => 180 + mi * 400, RY = 200;
function roadMap(p, t0) {
  const g = G(p, { o: 0 });
  [[90, 196], [140, 184]].forEach(([x, y]) => path(g, `M${x - 22} ${y + 20}V${y - 4}L${x} ${y - 24}L${x + 22} ${y - 4}V${y + 20}Z`, { stroke: C0, 'stroke-width': 3, fill: '#22322d' }));
  T(g, 'деревня', { x: 115, y: 254, size: 22, fill: DIM, weight: 600, anchor: 'middle' });
  path(g, 'M1462 222V172H1508V222Z', { stroke: C0, 'stroke-width': 3, fill: '#22322d' });
  path(g, 'M1485 160L1455 130M1485 160L1515 130M1485 160L1455 190M1485 160L1515 190', { stroke: C0, 'stroke-width': 4 });
  T(g, 'мельница', { x: 1485, y: 254, size: 22, fill: DIM, weight: 600, anchor: 'middle' });
  // meadow: tufts of grass along the first mile; road: a solid line; river: a wave under the road
  for (let x = MX(0) + 14; x < MX(1) - 10; x += 34) path(g, `M${x} ${RY + 14}l6 -16l6 16m4 0l6 -12`, { stroke: COL.faint, 'stroke-width': 2.5 });
  path(g, `M${MX(0)} ${RY}H${MX(1)}`, { stroke: DIM, 'stroke-width': 4, 'stroke-dasharray': '4 10' });
  path(g, `M${MX(1)} ${RY}H${MX(3)}`, { stroke: C0, 'stroke-width': 6 });
  let w = `M${MX(1)} ${RY + 34}`;
  for (let x = MX(1); x < MX(3); x += 40) w += `q10 -10 20 0t20 0`;
  path(g, w, { stroke: COL.faint, 'stroke-width': 2.5 });
  [0, 1, 2, 3].forEach(i => path(g, `M${MX(i)} ${RY - 12}V${RY + 12}`, { stroke: C0, 'stroke-width': 3 }));
  T(g, 'луг · 1 миля', { x: (MX(0) + MX(1)) / 2, y: RY - 30, size: 22, weight: 600, anchor: 'middle' });
  T(g, 'дорога вдоль реки · 2 мили', { x: (MX(1) + MX(3)) / 2, y: RY - 30, size: 22, weight: 600, anchor: 'middle' });
  show(g, t0);
  return g;
}
// The party: three small rings moving along the road.
function party(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 });
  [['Ш', -26, -10], ['Б', 0, 12], ['Т', 26, -10]].forEach(([s, dx, dy]) => {
    mk('circle', { cx: dx, cy: dy, r: 15, fill: COL.board, stroke: HERO, 'stroke-width': 3 }, g);
    T(g, s, { x: dx, y: dy + 6, size: 15, fill: HERO, weight: 700, anchor: 'middle' });
  });
  show(g, t0);
  return g;
}
