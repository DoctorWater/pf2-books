<script>
'use strict';
const CHAPTER = { number: 5, title: 'Класс', minutes: 12, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Attribute modifier, proficiency rank, magic; HP parts: ancestry, class (as in ch03).
const ATTR = HERO, PROF = RULE, MAGIC = COL.real, ANC = COL.dim, CLS = COL.int;
const hr = (p, y, t0, x1 = 120, x2 = 1480) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
// A horizontal HP segment of n points (u px each) growing from x at t0.
function hpSeg(p, x, y, n, u, colr, t0, h = 50) {
  const r = mk('rect', { x, y, width: 0, height: h, rx: 6, fill: colr, 'fill-opacity': .55, stroke: colr, 'stroke-width': 2 }, p);
  tw(r, { a_width: n * u - 2 }, t0, .6);
  return r;
}
// A class card: name, book, key attribute, class HP as a bar to scale; its short lines appear from tLines.
function classCard(p, x, y, w, h, c, t0, tLines, ls = 21) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2.5 }, g);
  T(g, c.name, { x: x + 22, y: y + 46, size: 32, weight: 700 });
  T(g, c.book, { x: x + w - 18, y: y + 40, size: 18, fill: COL.dim, anchor: 'end' });
  T(g, 'ключевая', { x: x + 22, y: y + 84, size: 19, fill: COL.dim });
  const key = T(g, c.key, { x: x + 22, y: y + 114, size: 23, fill: ATTR, weight: 600 });
  const u = 14;
  mk('rect', { x: x + 22, y: y + 132, width: c.hp * u, height: 24, rx: 5, fill: CLS, 'fill-opacity': .55, stroke: CLS, 'stroke-width': 2 }, g);
  T(g, 'ПЗ ' + c.hp, { x: x + 32 + c.hp * u, y: y + 152, size: 22, fill: CLS, weight: 700 });
  show(g, t0);
  // a line too long for the card shrinks to fit
  c.lines.forEach((ln, i) => say(p, ln, x + 22, y + 196 + i * ls * 1.5, tLines + i * .35, { size: Math.min(ls, ls * (w - 44) / uiW(ln, ls)), anchor: 'start' }));
  return { g, key };
}
const CLASS_W = n => (1600 - 2 * 48 - (n - 1) * 20) / n;

// Class data (PC1 p. 96–194, PC2 p. 58–160): name, key attribute, HP per level, book, lines.
const FIGHTERS = [
  { name: 'Воин', key: 'Сила или Ловкость', hp: 10, book: 'PC1', lines: ['эксперт в оружии', 'внеочередная атака:', 'бьёт того, кто', 'идёт мимо'], mark: 'ftr' },
  { name: 'Варвар', key: 'Сила', hp: 12, book: 'PC2', lines: ['ярость:', 'бьёт сильнее,', 'временные ПЗ,', 'хуже защищается'], mark: 'bar' },
  { name: 'Поборник', key: 'Сила или Ловкость', hp: 10, book: 'PC2', lines: ['служит божеству', 'тяжёлая броня', 'бережёт союзников', 'возложение рук'], mark: 'cha' },
  { name: 'Монах', key: 'Сила или Ловкость', hp: 10, book: 'PC2', lines: ['без брони и оружия', 'эксперт во всех', 'испытаниях'], mark: 'mon' },
  { name: 'Следопыт', key: 'Сила или Ловкость', hp: 10, book: 'PC1', lines: ['охота на добычу:', 'одну цель лучше', 'выслеживает и бьёт'], mark: 'ran' },
];
const TRICKSTERS = [
  { name: 'Плут', key: 'Ловкость или другая', hp: 8, book: 'PC1', lines: ['больше всех навыков', 'атака исподтишка —', 'по застигнутому', 'врасплох'], mark: 'rog' },
  { name: 'Сорвиголова', key: 'Ловкость', hp: 10, book: 'PC2', lines: ['эффектные трюки', 'копят кураж', '→ решающий удар'], mark: 'swa' },
  { name: 'Следователь', key: 'Интеллект', hp: 8, book: 'PC2', lines: ['к20 бросает заранее', 'бьёт по расчёту:', 'Интеллект вместо', 'Силы или Ловкости'], mark: 'inv' },
  { name: 'Алхимик', key: 'Интеллект', hp: 8, book: 'PC2', lines: ['не заклинатель', 'пробирки → бомбы,', 'эликсиры, мутагены'], mark: 'alc' },
];
const CASTERS = [
  { name: 'Бард', key: 'Харизма', hp: 8, book: 'PC1', lines: ['оккультная, спонтанные', 'песнь отваги'], mark: 'bard', grp: 'grp' },
  { name: 'Жрец', key: 'Мудрость', hp: 8, book: 'PC1', lines: ['сакральная,', 'подготовленные', 'капеллан или затворник'], mark: 'cle', grp: 'grp2' },
  { name: 'Друид', key: 'Мудрость', hp: 8, book: 'PC1', lines: ['первобытная,', 'подготовленные', 'орден: зверь, бури…'], mark: 'dru', grp: 'grp2' },
  { name: 'Ведьма', key: 'Интеллект', hp: 6, book: 'PC1', lines: ['традиция покровителя', 'подготовленные', 'фамильяр'], mark: 'wit', grp: 'grp3' },
  { name: 'Волшебник', key: 'Интеллект', hp: 6, book: 'PC1', lines: ['мистическая,', 'подготовленные', 'больше всех заклинаний'], mark: 'wiz', grp: 'grp3' },
  { name: 'Оракул', key: 'Харизма', hp: 8, book: 'PC2', lines: ['сакральная, спонтанные', 'тайна и проклятие'], mark: 'ora', grp: 'grp' },
  { name: 'Чародей', key: 'Харизма', hp: 6, book: 'PC2', lines: ['традиция наследия', 'спонтанные', 'магия в крови'], mark: 'sor', grp: 'grp' },
];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Класс', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Создание героя» · Глава 5', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Класс', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'кем стал ваш герой', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['what', 'Что даёт класс', (m) => {
    const p = panel(0);
    const sx = [400, 800, 1200];
    [['народ', 'кем родился', .3], ['происхождение', 'кем был', m('bg')], ['класс', 'кем стал', m('cls')]].forEach(([s, cap, t0], i) => {
      pill(p, s, i === 2 ? HERO : COL.chalk, sx[i], 110, t0, 32);
      say(p, cap, sx[i], 180, t0 + .3, { size: 26, fill: i === 2 ? HERO : COL.dim });
      if (i) arrowTo(p, sx[i - 1] + (i === 1 ? 92 : 152), 110, sx[i] - (i === 1 ? 152 : 76), 110, COL.dim, t0);
    });
    say(p, 'самое важное решение при создании героя', 800, 262, m('most'), { size: 30, weight: 700 });
    [['как сражается', 'fight', 260], ['сколько ударов выдержит', 'hp', 620], ['в чём обучен', 'prof', 980], ['что получит с уровнями', 'lvl', 1340]]
      .forEach(([s, mark, x]) => say(p, s, x, 338, m(mark), { size: 25, fill: COL.dim }));
    box(p, 420, 400, 760, 440, COL.faint, m('card', -.2));
    say(p, 'начало описания каждого класса', 800, 452, m('card'), { size: 24, fill: COL.dim, weight: 600 });
    [['ключевая характеристика', ATTR], ['пункты здоровья за уровень', CLS], ['начальные умения', PROF], ['классовые особенности', COL.chalk], ['таблица развития', COL.chalk]]
      .forEach(([s, c], i) => {
        const y = 520 + i * 64, t0 = m('r' + (i + 1));
        if (i === 3) hr(p, y - 38, t0 - .2, 470, 1130);
        say(p, String(i + 1), 480, y + 10, t0, { size: 28, fill: COL.dim, weight: 700 });
        say(p, s, 520, y + 10, t0, { size: 30, fill: c, weight: 600, anchor: 'start' });
      });
  }],
  ['keyattr', 'Ключевая характеристика', (m) => {
    const p = panel(0);
    pill(p, 'ключевая характеристика', ATTR, 800, 80, .2, 32);
    const tg = [['классовая СЛ', 'у всех классов', 330, 'dc'], ['СЛ и атаки заклинаний', 'у заклинателей', 800, 'spell'], ['точность атак', 'у многих классов', 1270, 'atk']];
    tg.forEach(([s, cap, x, mark]) => {
      arrowTo(p, 800 + (x - 800) * .18, 112, x, 196, COL.dim, m(mark));
      say(p, s, x, 236, m(mark, .2), { size: 28, weight: 700 });
      say(p, cap, x, 272, m(mark, .4), { size: 22, fill: COL.dim });
    });
    colorLine(p, [['выбор класса → ', COL.dim], ['повышение ключевой', PROF], [' (+1)', PROF]], 800, 340, m('boost'), { size: 28 });
    const b = attrBoard(p, 800, 640, m('boost', .4));
    const tk1 = boostToken(p, 'Сила или Ловкость', 'fix', 800, 410, m('two'));
    give(b, tk1, 0, 1, m('two', 2.4));
    colorLine(p, [['Сила', ATTR], [': дерётся вплотную', COL.chalk]], 760, 830, m('str'), { size: 26, anchor: 'end' });
    clearBoard(b, m('dex', -.1));
    const tk2 = boostToken(p, 'Сила или Ловкость', 'fix', 800, 410, m('dex', -.1));
    give(b, tk2, 1, 1, m('dex', .3));
    say(p, 'или', 800, 830, m('dex', .3), { size: 26, fill: COL.dim });
    colorLine(p, [['Ловкость', ATTR], [': стреляет или фехтует', COL.chalk]], 840, 830, m('dex', 1.1), { size: 26, anchor: 'start' });
  }],
  ['hp', 'ПЗ за уровень', (m) => {
    const p = panel(0), x0 = 120, u = 36;
    say(p, 'Пункты здоровья за уровень', 800, 70, .2, { size: 36, weight: 600 });
    colorLine(p, [['от 6 до 12', CLS], [' + Выносливость', ATTR]], 800, 126, .5, { size: 30 });
    [[12, 'варвар', 'b12'], [10, 'воин, поборник, монах, следопыт, сорвиголова', 'b10'],
      [8, 'плут, следователь, алхимик, бард, жрец, друид, оракул', 'b8'], [6, 'ведьма, волшебник, чародей', 'b6']].forEach(([n, names, mark], i) => {
      const y = 180 + i * 76;
      hpSeg(p, x0, y, n, u, CLS, m(mark));
      say(p, String(n), x0 + n * u - 12, y + 36, m(mark, .5), { size: 30, fill: COL.board, weight: 700, anchor: 'end' });
      say(p, names, 600, y + 35, m(mark, .3), { size: 25, anchor: 'start' });
    });
    hr(p, 500, m('first', -.4));
    colorLine(p, [['ПЗ 1-го уровня = ', COL.chalk], ['народ', ANC], [' + ', COL.dim], ['класс', CLS], [' + ', COL.dim], ['Выносливость', ATTR]], 800, 560, m('first'), { size: 30 });
    const bx = 260, bu = 30, by = 620;
    say(p, 'человек-воин', bx - 20, by + 34, m('ex'), { size: 24, fill: HERO, weight: 600, anchor: 'end' });
    hpSeg(p, bx, by, 8, bu, ANC, m('ex', .8));
    hpSeg(p, bx + 8 * bu, by, 10, bu, CLS, m('ex', 2.6));
    hpSeg(p, bx + 18 * bu, by, 2, bu, ATTR, m('ex', 3.8));
    say(p, 'народ 8', bx + 4 * bu, by + 84, m('ex', 1), { size: 22, fill: ANC, weight: 600 });
    say(p, 'класс 10', bx + 13 * bu, by + 84, m('ex', 2.8), { size: 22, fill: CLS, weight: 600 });
    say(p, '2', bx + 19 * bu, by + 84, m('ex', 4), { size: 22, fill: ATTR, weight: 600 });
    const tot = say(p, '20', bx + 20 * bu + 20, by + 38, m('ex', 4.6), { size: 40, weight: 700, anchor: 'start' });
    hpSeg(p, bx + 20 * bu, by, 10, bu, CLS, m('next', .6));
    hpSeg(p, bx + 30 * bu, by, 2, bu, ATTR, m('next', 1.2));
    tw(tot, { x: bx + 32 * bu + 20 }, m('next', .6), 1);
    prog(q => { tot.textContent = String(Math.round(20 + 12 * q)); }, m('next', .6), 1);
    colorLine(p, [['2-й уровень: + ', COL.dim], ['10', CLS], [' + ', COL.dim], ['2', ATTR]], bx + 26 * bu, by + 84, m('next', 1.4), { size: 22 });
  }],
  ['profs', 'Начальные умения', (m) => {
    const p = panel(0);
    say(p, 'Начальные умения: воин', 800, 70, .2, { size: 36, weight: 600 });
    box(p, 70, 120, 760, 600, COL.faint, .3);
    const rows = [['Внимание', 'эксперт', 'per'], ['Стойкость', 'эксперт', 'fort'], ['Реакция', 'эксперт', 'fort'], ['Воля', 'изучен', 'will'],
      ['Простое и особое оружие', 'эксперт', 'weap'], ['Любая броня', 'изучен', 'arm'], ['Классовая СЛ', 'изучен', 'dc']];
    rows.forEach(([s, r, mark], i) => {
      const y = 180 + i * 76, t0 = m(mark, i === 2 ? .5 : 0);
      say(p, s, 100, y + 9, t0, { size: 28, anchor: 'start' });
      pill(p, r, PROF, 700, y, t0 + .2, 24);
    });
    say(p, 'не назван — неизучен', 1180, 170, m('none'), { size: 30, weight: 700 });
    say(p, 'если ранг не дали народ или происхождение', 1180, 214, m('none', .6), { size: 22, fill: COL.dim });
    pill(p, 'заклинания: неизучен', COL.dim, 1180, 280, m('none', 1.2), 24);
    hr(p, 340, m('sk', -.4), 900, 1480);
    say(p, 'Навыки', 1180, 396, m('sk'), { size: 30, weight: 700 });
    say(p, 'Акробатика или Атлетика', 1180, 446, m('sk', .6), { size: 26, fill: HERO });
    colorLine(p, [['+ 3 + ', COL.chalk], ['Интеллект', ATTR], [' на выбор', COL.dim]], 1180, 494, m('sk', 2.6), { size: 28 });
    colorLine(p, [['Интеллект +1', ATTR], [': 3 + 1 = ', COL.chalk], ['4', COL.chalk]], 1180, 580, m('int'), { size: 30 });
    colorLine(p, [['Интеллект 0', ATTR], [': 3 + 0 = ', COL.chalk], ['3', COL.chalk]], 1180, 640, m('zero'), { size: 30 });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-skills', prompt: ['Волшебник: обучен Мистицизму и ещё 2 навыкам плюс Интеллект. Интеллект +3.'], build: blanks(Q_SKILLS),
  }, {
    id: 'c-hp', prompt: ['Эльф (6 ПЗ от народа) становится волшебником (6 ПЗ за уровень). Выносливость +1.'], build: blanks(Q_HP),
  }], done) }],
  ['features', 'Особенности и развитие', (m) => {
    const p = panel(0);
    say(p, 'Классовые особенности', 800, 70, .2, { size: 36, weight: 600 });
    colorLine(p, [['ярость', HERO], [' варвара · ', COL.dim], ['атака исподтишка', HERO], [' плута · ', COL.dim], ['заклинания', HERO], [' волшебника', COL.dim]], 800, 130, m('ex'), { size: 27 });
    say(p, 'многие требуют выбора', 800, 186, m('choice'), { size: 25, fill: COL.dim, weight: 600 });
    [['Жрец', 'божество', 330, 'cl'], ['Плут', 'плутовской стиль', 800, 'ro'], ['Чародей', 'наследие', 1270, 'so']].forEach(([c, ch, x, mark]) => {
      say(p, c, x, 254, m(mark), { size: 30, weight: 700 });
      arrowTo(p, x, 270, x, 316, COL.dim, m(mark, .2));
      pill(p, ch, HERO, x, 348, m(mark, .4), 26);
    });
    hr(p, 400, m('tab', -.4));
    say(p, 'Таблица развития барда (начало)', 800, 450, m('tab'), { size: 28, weight: 700 });
    const L = ['народ, происхождение, начальные умения, заклинания, муза…', 'черта барда, черта навыка', 'общая черта, прибавка навыка…',
      'черта барда, черта навыка', 'повышения характеристик, черта народа, прибавка навыка…'];
    const ry = i => 510 + i * 66;
    L.forEach((s, i) => {
      say(p, (i + 1) + '-й', 190, ry(i) + 9, m('tab', 1 + i * .15), { size: 26, fill: PROF, weight: 700, anchor: 'end' });
      say(p, s, 230, ry(i) + 9, m('tab', 1 + i * .15), { size: 24, anchor: 'start' });
    });
    const fr = mk('rect', { x: 120, y: ry(1) - 28, width: 1380, height: 56, rx: 10, fill: 'none', stroke: RULE, 'stroke-width': 3 }, p);
    put(fr, { o: 0 }); show(fr, m('l2'), .3);
    tw(fr, { a_y: ry(2) - 28 }, m('l3'), .5);
    tw(fr, { a_y: ry(4) - 28 }, m('l5'), .5);
    tw(fr, { a_y: ry(3) - 28, c_stroke: OK }, m('up'), .5);
    say(p, 'новый уровень → его строка', 1480, ry(3) + 8, m('up', .4), { size: 22, fill: OK, weight: 700, anchor: 'end' });
  }],
  ['roles', 'Роли в группе', (m) => {
    const p = panel(0);
    say(p, 'Роли в группе', 800, 70, .2, { size: 36, weight: 600 });
    const cols = [['держит врагов', ['воин', 'поборник'], 'tank'], ['урон', ['варвар', 'сорвиголова'], 'dmg'],
      ['лечит, поддерживает', ['бард', 'жрец'], 'sup'], ['навыки', ['плут', 'следователь'], 'sk']];
    const xs = [230, 610, 990, 1370];
    const pills = cols.map(([h, cls, mark], i) => {
      say(p, h, xs[i], 160, m(mark), { size: 28, weight: 700 });
      return cls.map((c, j) => pill(p, c, HERO, xs[i], 230 + j * 70, m(mark, .3 + j * .25), 26));
    });
    say(p, 'вскрывает замки, ведёт переговоры', xs[3], 400, m('sk', 1), { size: 21, fill: COL.dim });
    colorLine(p, [['и хорошо, если есть ', COL.dim], ['магия', MAGIC]], 800, 470, m('mag'), { size: 30 });
    hr(p, 520, m('soft', -.3));
    say(p, 'роли не жёсткие', 800, 580, m('soft'), { size: 30, weight: 700 });
    const cap = pill(p, 'жрец-капеллан', HERO, xs[2], 670, m('cap'), 26);
    tw(cap, { x: xs[0] + 40 }, m('cap', 1.2), 1);
    say(p, 'в броне — в первом ряду', xs[0] + 40, 740, m('cap', 2.2), { size: 22, fill: OK, weight: 600 });
    pulse(pills[3][0], m('rog'), 1.25);
    say(p, 'разведчик', xs[3] - 90, 670, m('rog', .5), { size: 24, fill: OK, weight: 600 });
    say(p, 'переговорщик', xs[3] + 80, 670, m('rog', 1.3), { size: 24, fill: OK, weight: 600 });
    say(p, 'обсудите с группой: кого не хватает и что интересно вам', 800, 840, m('talk'), { size: 28, fill: COL.dim });
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-class', prompt: ['Верно или неверно?'], build: grid(Q_CLASS, TF, { multi: false, text: true }),
  }], done) }],
  ['magic', 'Традиции и круги', (m) => {
    const p = panel(0);
    say(p, 'Заклинатели: четыре традиции', 800, 70, .2, { size: 36, weight: 600 });
    const T4 = [['Мистическая', ['изучение', 'законов мира'], 'arc', ['волшебник'], 'cls'], ['Сакральная', ['сила богов'], 'div', ['жрец', 'оракул'], 'cls2'],
      ['Оккультная', ['тайны разума', 'и непознанного'], 'occ', ['бард'], 'cls3'], ['Первобытная', ['сила природы'], 'pri', ['друид'], 'cls4']];
    T4.forEach(([name, desc, mark, cls, cm], i) => {
