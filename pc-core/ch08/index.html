<script>
'use strict';
const CHAPTER = { number: 8, title: 'Бой: инициатива, раунд, три действия', minutes: 13, language: 'ru', next: '../ch09/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Participants of the chapter's fight: heroes HERO, the bandit FOE; the initiative order of the example.
const PPL = { b: ['Бронна', HERO], t: ['Тиль', HERO], r: ['Разбойник', FOE], s: ['Шиппа', HERO] };
const ORDER = ['b', 't', 'r', 's'];
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
// A die with its roll and a coloured sum after it, left-aligned at x (as in ch07).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}

// The mill yard of the example round: 8 × 3 cells of 5 feet, gate on the left, barn in the last column.
const MAP = { x: 120, y: 250, c: 100 };
const cellXY = (c, r) => [MAP.x + c * MAP.c + MAP.c / 2, MAP.y + r * MAP.c + MAP.c / 2];
function yard(p, t0) {
  const g = G(p, { o: 0 }), { x, y, c } = MAP;
  for (let i = 0; i < 7; i++) for (let j = 0; j < 3; j++)
    mk('rect', { x: x + i * c + 3, y: y + j * c + 3, width: c - 6, height: c - 6, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
  mk('rect', { x: x + 7 * c + 6, y: y - 10, width: c - 6, height: 3 * c + 20, rx: 6, fill: '#2a2620', stroke: COL.dim, 'stroke-width': 3 }, g);
  mk('rect', { x: x + 7 * c, y: y + c + 12, width: 14, height: c - 24, rx: 3, fill: COL.dim }, g);
  T(g, 'амбар', { x: x + 7.5 * c + 3, y: y - 22, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  path(g, `M${x - 14} ${y - 10}V${y + c * .45}M${x - 14} ${y + c * 2.55}V${y + 3 * c + 10}`, { stroke: COL.dim, 'stroke-width': 8 });
  T(g, 'ворота', { x: x - 14, y: y - 22, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  T(g, 'мельничный двор · клетка 5 футов', { x: x + 3.5 * c, y: y + 3 * c + 44, size: 22, fill: COL.dim, anchor: 'middle' });
  show(g, t0);
}
// A token on the yard: ring with the first letter.
function mtok(p, k, c, r, t0) {
  const [x, y] = cellXY(c, r), g = G(p, { x, y, o: 0 });
  mk('circle', { r: 34, fill: COL.board, stroke: PPL[k][1], 'stroke-width': 4 }, g);
  T(g, PPL[k][0][0], { y: 12, size: 34, fill: PPL[k][1], weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
const moveTok = (g, c, r, t0, dur = .8) => { const [x, y] = cellXY(c, r); tw(g, { x, y }, t0, dur); };
// A raised shield on a token (child of the token group, so it moves with it).
function shieldOn(g, t0) {
  const s = path(g, 'M0 -16L14 -10V2C14 10 7 15 0 18C-7 15 -14 10 -14 2V-10Z', { fill: RULE, stroke: COL.board, 'stroke-width': 2 }, { x: 30, y: -30, o: 0 });
  if (t0 != null) pop(s, t0); else put(s, { o: 1 });
  return s;
}
// The common picture of the round beats: order, yard, tokens, the bandit's card (known to the GM) and the heroes' line.
function yardScene(p, { pos, shield, foeHp, shHp, cur, foeT0 = .4 }) {
  title(p, 'Раунд у мельницы');
  const rib = ribbon(p, ORDER, 1090, 120, 130, .2, 30);
  if (cur) rib.cur(cur, .3, .01);
  yard(p, .2);
  const tok = {};
  ORDER.forEach((k, i) => { tok[k] = mtok(p, k, ...pos[k], .3 + i * .08); });
  const sh = shield ? shieldOn(tok.b) : null;
  box(p, 1000, 250, 560, 180, FOE, foeT0);
  say(p, 'Разбойник · знает ведущий', 1030, 296, foeT0, { size: 25, fill: FOE, weight: 700, anchor: 'start' });
  say(p, 'КБ 16 · дубинка +7', 1030, 346, foeT0 + .2, { size: 27, anchor: 'start' });
  say(p, 'Внеочередной атаки нет', 1030, 396, foeT0 + .4, { size: 23, fill: COL.dim, anchor: 'start' });
  const fhp = say(p, 'ПЗ ' + foeHp, 1530, 296, foeT0, { size: 30, fill: FOE, weight: 700, anchor: 'end' });
  box(p, 1000, 450, 560, 140, HERO, .5);
  say(p, 'Шиппа: КБ 18 · рапира +6', 1030, 492, .5, { size: 23, anchor: 'start' });
  const shp = say(p, 'ПЗ ' + shHp, 1530, 492, .5, { size: 25, fill: HERO, weight: 700, anchor: 'end' });
  say(p, 'Бронна: длинный меч +9 · КБ 18 · щит', 1030, 532, .5, { size: 23, anchor: 'start' });
  say(p, 'Тиль: атака заклинанием +7 · Обман +3', 1030, 572, .5, { size: 23, anchor: 'start' });
  return { rib, tok, sh, fhp, shp };
}
const setHp = (e, v, t0) => { prog(() => { e.textContent = 'ПЗ ' + v; }, t0, 0); pulse(e, t0, 1.3); };
// Damage floating up from a token.
function hurt(p, g, str, t0) {
  const e = say(p, str, st(g).x + 52, st(g).y - 30, t0, { size: 30, fill: NO, weight: 700, anchor: 'start' });
  tw(e, { y: st(g).y - 70, o: 0 }, t0 + 1.4, .8);
}
const RX = 910, RY = 650, RDY = 46;   // result lines of the round beats, right of the turn cells
const rline = i => RY + i * RDY;

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Бой: инициатива, раунд, три действия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 4 «Бой» · Глава 8', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Бой: инициатива, раунд, три действия', { x: 800, y: 440, size: 62, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'кто когда ходит и что успевает', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['mill', 'Бросайте инициативу', (m, D) => {
    const p = panel(0);
    // the mill: tower, roof, door and four sails turning slowly
    const mill = G(p, { x: 1150, y: 300, o: 0 });
    path(mill, 'M-80 330L-55 30H55L80 330Z', { fill: '#2a2620', stroke: COL.dim, 'stroke-width': 4 });
    path(mill, 'M-70 34L0 -40L70 34Z', { fill: '#2a2620', stroke: COL.dim, 'stroke-width': 4 });
    mk('rect', { x: -22, y: 250, width: 44, height: 80, rx: 6, fill: COL.board, stroke: COL.dim, 'stroke-width': 3 }, mill);
    const sails = G(mill);
    [0, 90, 180, 270].forEach(a => {
      const b = G(sails, { r: a });
      path(b, 'M0 0V-150', { stroke: COL.dim, 'stroke-width': 5 });
      mk('rect', { x: 4, y: -150, width: 30, height: 110, rx: 3, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, b);
    });
    mk('circle', { r: 10, fill: COL.dim }, mill);
    show(mill, .2);
    prog(q => put(sails, { r: q * 60 }), 0, D, lin);
    ['s', 'b', 't'].forEach((k, i) => who(p, PPL[k][0], HERO, 170 + i * 160, 560, .4 + i * .15));
    const ban = who(p, 'Разбойник', FOE, 1150, 600, .5);
    T(ban, 'с дубинкой', { y: 46 + 66, size: 22, fill: COL.dim, anchor: 'middle' });
    tw(ban, { x: 1420 }, .5, 1.4, out);
    who(p, 'Ведущий', GMC, 170, 790, m('gm'), 40);
    bubble(p, 'Бросайте инициативу', 470, 790, GMC, m('gm', .3), { size: 26, side: 'left' });
    pill(p, 'бой', ENC, 640, 150, m('enc'), 40);
    colorLine(p, [['раунд', RULE], [' = 6 секунд', COL.chalk]], 640, 250, m('rnd'), { size: 34 });
    say(p, 'каждый действует в свою очередь', 640, 310, m('turn'), { size: 28, fill: COL.dim });
  }],
  ['init', 'Инициатива', (m) => {
    const p = panel(0);
    title(p, 'Инициатива');
    numDie(p, '?', 140, 186, .4, 40);
    colorLine(p, [['+ Внимание', HERO], [' = итог', COL.chalk]], 200, 200, .5, { size: 34, anchor: 'start' });
    say(p, 'итог ни с какой СЛ не сравнивают', 100, 280, .9, { size: 26, fill: COL.dim, anchor: 'start' });
    // three totals sort themselves: the highest goes first
    const V = [[14, 0], [9, 1], [18, 2]], px = i => 160 + i * 150;
    const pills = V.map(([v, i]) => pill(p, String(v), RULE, px(i), 390, m('sort', i * .2), 32));
    [1, 2, 0].forEach((to, i) => tw(pills[i], { x: px(to) }, m('sort', 1.4), .8));
    ['1-й', '2-й', '3-й'].forEach((s, i) => say(p, 'ходит ' + s, px(i), 460, m('sort', 2.3) + i * .2, { size: 22, fill: COL.dim }));
    say(p, 'по убыванию: больший ходит первым', 100, 530, m('sort', 2.9), { size: 26, anchor: 'start' });
    box(p, 720, 130, 820, 480, COL.faint, m('per', -.3));
    say(p, 'Какой проверкой', 760, 182, m('per', -.3), { size: 28, fill: RULE, weight: 700, anchor: 'start' });
    [['обычно', 'Внимание', 'per', 250], ['крался (Незаметное перемещение)', 'Скрытность', 'sneak', 330], ['переговоры сорвались', 'Обман', 'talk', 410]]
      .forEach(([s, sk, mark, y]) => {
        say(p, s, 760, y + 9, m(mark), { size: 25, anchor: 'start' });
        pill(p, sk, HERO, 1430 - (sk.length * 26 * .56 + 44) / 2, y, m(mark, .4), 26);
      });
    hr(p, 470, m('any', -.3), 750, 1510);
    colorLine(p, [['почти всегда можно взять ', COL.chalk], ['Внимание', OK]], 760, 540, m('any'), { size: 28, anchor: 'start' });
    who(p, 'Ведущий', GMC, 170, 740, m('gm'), 40);
    say(p, 'бросает за всех, кроме героев', 240, 752, m('gm', .3), { size: 28, anchor: 'start' });
  }],
  ['order', 'Порядок инициативы', (m) => {
    const p = panel(0);
    title(p, 'Порядок инициативы');
    ['участник', 'Внимание', 'кубик', 'итог'].forEach((s, i) => say(p, s, [120, 520, 690, 870][i], 150, .3, { size: 22, fill: COL.dim, anchor: i ? 'middle' : 'start' }));
    hr(p, 170, .3, 100, 940);
    const R = [['b', 6, 12], ['t', 4, 14], ['r', 4, 10], ['s', 5, 9]], ry = i => 230 + i * 80;
    const tots = R.map(([k, mod, die], i) => {
      const [d1, d2, d3] = k === 'b' ? [4.4, 5.9, 7.3] : [1.2, 2.1, 3], t0 = .5 + i * .3, y = ry(i);
      say(p, PPL[k][0] + (k === 'b' ? ', дварф-воин' : k === 't' ? ', эльф-волшебник' : ''), 120, y, t0, { size: 28, fill: PPL[k][1], weight: 700, anchor: 'start' });
      say(p, '+' + mod, 520, y, m(k, d1), { size: 30 });
      numDie(p, die, 690, y - 10, m(k, d2), 30);
      return say(p, String(mod + die), 870, y, m(k, d3), { size: 34, fill: RULE, weight: 700 });
    });
    const brace = (i, colr, lines, t0) => {
      draw(path(p, `M950 ${ry(i) - 40}H970V${ry(i + 1) + 14}H950`, { stroke: colr, 'stroke-width': 4 }, { d: 0 }), t0, .5);
      lines.forEach(([s, c], k) => say(p, s, 995, ry(i) + 10 + k * 40, t0 + .3 + k * .5, { size: 26, fill: c, weight: k ? 500 : 700, anchor: 'start' }));
      pulse(tots[i], t0, 1.3); pulse(tots[i + 1], t0, 1.3);
    };
    brace(0, HERO, [['18 = 18, оба героя:', HERO], ['договорились — Бронна первой', COL.chalk]], m('tie1'));
    brace(2, FOE, [['14 = 14, герой и враг:', FOE], ['враг ходит раньше', COL.chalk]], m('tie2'));
    say(p, 'очередь', 120, 650, m('row'), { size: 26, fill: COL.dim, anchor: 'start' });
    ORDER.forEach((k, i) => {
      who(p, PPL[k][0], PPL[k][1], 400 + i * 270, 640, m('row', .3 + i * .5), 40);
      if (i) say(p, '→', 265 + i * 270, 652, m('row', .3 + i * .5), { size: 34, fill: COL.dim });
    });
    say(p, 'до конца боя · в новом раунде инициативу не перебрасывают', 800, 820, m('keep'), { size: 28, fill: RULE, weight: 600 });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-init', prompt: ['Итоги: Бронна 18, Тиль 18, разбойник 14, Шиппа 14. В бой вступает волк: Внимание +6.'], build: blanks(Q_INIT),
  }, {
    id: 'c-init-tf', prompt: ['Верно или неверно?'], build: grid(Q_INIT_TF, TF, { multi: false, text: true }),
  }], done) }],
  ['round', 'Раунд и ход', (m) => {
    const p = panel(0);
    title(p, 'Раунд и ход');
    const cx = 330, cy = 480, R = 200, at = i => [cx + R * Math.sin(i * Math.PI / 2), cy - R * Math.cos(i * Math.PI / 2)];
    draw(path(p, `M${cx} ${cy - R}A${R} ${R} 0 1 1 ${cx - .1} ${cy - R}`, { stroke: COL.faint, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { d: 0 }), .2, .8);
    const hl = put(mk('circle', { r: 46, fill: 'none', stroke: RULE, 'stroke-width': 4 }, p), { x: at(0)[0], y: at(0)[1], o: 0 });
    ORDER.forEach((k, i) => who(p, PPL[k][0], PPL[k][1], ...at(i), .3 + i * .1, 36));
    say(p, 'раунд', cx, cy - 6, .5, { size: 32, fill: RULE, weight: 700 });
    say(p, '6 секунд', cx, cy + 34, .6, { size: 24, fill: COL.dim });
    show(hl, .8);
    [1, 2, 3].forEach(i => tw(hl, { x: at(i)[0], y: at(i)[1] }, m('last', -.6 + i * .5), .4));
    tw(hl, { x: at(0)[0], y: at(0)[1] }, m('next'), .5);
    say(p, 'и снова по кругу', cx, cy + R + 110, m('next', .3), { size: 22, fill: COL.dim });
    const row = (name, y, d) => pill(p, name, RULE, 800, y, m('turn', d), 26);
    row('начало', 200, 1.2); row('действия', 450, 2.2); row('конец', 580, 3.6);
    say(p, 'эффекты на несколько раундов: −1', 900, 209, m('start'), { size: 26, anchor: 'start' });
    say(p, 'заклинание на 3 раунда:', 900, 262, m('spell'), { size: 23, fill: COL.dim, anchor: 'start' });
    [['ход 2: ещё 2', 3], ['ход 3: ещё 1', 4.8], ['ход 4: конец', 6.4]].forEach(([s, d], i) => say(p, s, 900 + i * 210, 312, m('spell', d), { size: 25, fill: i === 2 ? NO : COL.chalk, anchor: 'start' }));
    say(p, 'затем:', 900, 383, m('get', -.2), { size: 23, fill: COL.dim, anchor: 'start' });
    glyph(p, 3, 970, 446, m('get'), .6); glyph(p, 'r', 1070, 446, m('get', .9), .6);
    say(p, '3 действия и 1 ответное', 1120, 458, m('get', .9), { size: 27, anchor: 'start' });
    say(p, 'кончается то, что «до конца хода»', 900, 575, m('end'), { size: 26, anchor: 'start' });
    say(p, 'испуг слабеет на 1', 900, 615, m('end', 2.4), { size: 24, fill: COL.dim, anchor: 'start' });
    hr(p, 680, m('early', -.3), 720, 1520);
    say(p, 'завершить ход раньше:', 740, 740, m('early'), { size: 26, anchor: 'start' });
    colorLine(p, [['действия пропадут', NO], [' · ', COL.dim], ['ответное останется', OK]], 740, 790, m('early', 1.5), { size: 28, anchor: 'start' });
  }],
  ['actions', 'Три действия и одно ответное', (m) => {
    const p = panel(0);
    title(p, 'Три действия и одно ответное');
    const tc = turnCells(p, 310, 130, m('a3', -.2), { w: 220, h: 150, gap: 20, rgap: 60, rt0: m('r1') });
    say(p, 'в свой ход · в любом порядке', 800, 345, m('any'), { size: 28 });
    tc.spend(0, 'Удар', m('any', 1.2)); tc.spend(1, 'Шаг', m('any', 1.8));
    say(p, 'начатое — закончить, потом браться за следующее', 800, 392, m('any', 2.6), { size: 24, fill: COL.dim });
    hr(p, 430, m('lost', -.3));
    tc.lose(2, m('lost', 1.2));
    say(p, 'копить нельзя: неистраченные действия пропадают в конце хода', 800, 480, m('lost', 1), { size: 26, fill: NO });
    tc.lose(3, m('rlost', .8));
    glyph(p, 'r', tc.X(3) + 220 + 60, 190, m('rlost', 3.2), .5, OK);
    say(p, 'новое', tc.X(3) + 220 + 60, 250, m('rlost', 3.4), { size: 22, fill: OK });
    say(p, 'ответное — до начала следующего хода, потом приходит новое', 800, 530, m('rlost', 1), { size: 26, fill: COL.dim });
    who(p, 'Шиппа', HERO, 330, 720, m('talk'), 46);
    bubble(p, 'Тиль, он идёт к тебе', 720, 680, HERO, m('talk', 2.4), { size: 26, side: 'left' });
    colorLine(p, [['говорить можно ', COL.chalk], ['без действий', OK]], 1000, 780, m('talk', .3), { size: 30, anchor: 'start' });
  }],
  ['react', 'Ответное действие и условие', (m) => {
    const p = panel(0);
    title(p, 'Ответное действие и условие');
    colorLine(p, [['в любой ход, свой или чужой — ', COL.chalk], ['но только по условию', RULE]], 800, 130, .4, { size: 28 });
    // Bronna and the eight cells around her
    const zone = G(p, { o: 0 });
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++)
      mk('rect', { x: 300 + i * 120, y: 410 + j * 120, width: 114, height: 114, rx: 8, fill: i || j ? HERO : 'none', 'fill-opacity': .1, stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, zone);
    show(zone, .3);
    const br = who(p, 'Бронна', HERO, 357, 467, .4, 42);
    const ban = who(p, 'Разбойник', FOE, 477, 467, .6, 42);
    say(p, 'зона досягаемости', 357, 225, m('cond', .3), { size: 22, fill: HERO });
    box(p, 760, 200, 790, 400, RULE, m('rs'));
    glyph(p, 'r', 806, 252, m('rs'), .6);
    say(p, 'Внеочередная атака', 850, 262, m('rs'), { size: 32, fill: RULE, weight: 700, anchor: 'start' });
    say(p, 'воин, с 1-го уровня', 1520, 262, m('rs', .6), { size: 22, fill: COL.dim, anchor: 'end' });
    say(p, 'Условие: существо в зоне досягаемости', 790, 330, m('cond'), { size: 26, weight: 600, anchor: 'start' });
    [['· действие с манипуляцией или движением', 1.4], ['· атакует издалека', 4.4], ['· уходит из клетки', 5.8]].forEach(([s, d], i) => say(p, s, 810, 380 + i * 44, m('cond', d), { size: 25, anchor: 'start' }));
    colorLine(p, [['→ ', COL.dim], ['удар вне очереди', HERO]], 790, 560, m('hit'), { size: 28, anchor: 'start' });
    tw(ban, { x: 660 }, m('hit', -.9), .8);
    const rg = glyph(br, 'r', 0, -78, m('hit'), .5);
