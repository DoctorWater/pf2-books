<script>
'use strict';
const CHAPTER = { number: 16, title: 'Новый уровень', minutes: 13, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Level LVL (pink: no GM in this chapter), rank and proficiency RULE, attributes HERO; in HP: ancestry ANC, class CLS, Constitution HERO,
// Toughness TOUGH; spells MAG; a rank going up OK.
const LVL = COL.rat, ANC = COL.dim, CLS = COL.int, TOUGH = COL.real, MAG = COL.real;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2, x = 800) => say(p, s, x, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };
// Pills of their own colours [[text, colour, t0], …] in a row centred on cx.
const pw = (s, size) => s.length * size * .56 + 44;
function pillsC(p, items, cx, y, size = 24) {
  const w = items.map(([s]) => pw(s, size)), tot = w.reduce((a, b) => a + b + 16, -16);
  let x = cx - tot / 2;
  return items.map(([s, c, t0], i) => { const g = pill(p, s, c, x + w[i] / 2, y, t0, size); x += w[i] + 16; return g; });
}
// A numbered step: amber disc with n, text after it; returns the group (hidden until t0).
function step(p, n, str, x, y, t0, size = 27, colr = COL.chalk) {
  const g = G(p, { x: -20, o: 0 });
  mk('circle', { cx: x, cy: y - size * .36, r: 22, fill: mix(COL.board, RULE, .3), stroke: RULE, 'stroke-width': 2.5 }, g);
  T(g, String(n), { x, y: y - size * .36 + 9, size: 24, fill: RULE, weight: 700, anchor: 'middle' });
  if (typeof str === 'string') T(g, str, { x: x + 40, y, size, fill: colr, weight: 500 });
  else { const e = T(g, '', { x: x + 40, y, size, weight: 500 }); str.forEach(([s, c = COL.chalk]) => { mk('tspan', { fill: c }, e).textContent = s; }); }
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  return g;
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f (as in ch09, ch14).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}

/* ---------- Shippa's sheet (page 1) at levels 1, 2, 4, 5 ---------- */
const SH1 = [['name', 'Шиппа'], ['lvl', '1'], ['anc', 'гоблин'], ['her', 'небьющийся гоблин'], ['bg', 'трактирщик'], ['cls', 'бард'],
  ['a0', '0'], ['a1', '+3'], ['a2', '+2'], ['a3', '0'], ['a4', '0'], ['a5', '+4'], ['hp', '20', '10+8+2'], ['ac', '18', '10+3+3+2'],
  ['per', '+5', 'эксперт'], ['will', '+5', 'эксперт'], ['fort', '+5', 'изучен'], ['ref', '+6', 'изучен'],
  ['sk0', 'Дипломатия', 'изучен · +7'], ['sk1', 'Знание (выпивка)', 'изучен · +3'], ['sk2', 'Оккультизм', 'изучен · +3'], ['sk3', 'Исполнение', 'изучен · +7'],
  ['sk4', 'Обман, Общество, Религия, Скрытность', ''], ['ft_anc', 'Гоблинская песня'], ['ft_skill', 'Неформальное общение'], ['ft_cls', 'Продолжительная композиция'],
  ['size', 'Небольшой'], ['spd', '25 футов'], ['sense', 'ночное зрение'], ['lang', 'всеобщий, гоблинский'], ['prof', 'изучен']];
const SH2 = [['lvl', '2'], ['hp', '30', '20+8+2'], ['ft_cls', 'ещё Посвящение в плуты'], ['ft_skill', 'ещё Обаятельный лжец'],
  ['ac', '19', '10+3+4+2'], ['per', '+6', 'эксперт'], ['sk0', 'Дипломатия', 'изучен · +8'], ['sk1', 'Знание (выпивка)', 'изучен · +4'],
  ['sk2', 'Оккультизм', 'изучен · +4'], ['sk3', 'Исполнение', 'изучен · +8'], ['fort', '+6', 'изучен'], ['ref', '+7', 'изучен'], ['will', '+6', 'эксперт']];
const SH4 = [['lvl', '4'], ['hp', '54', ''], ['ac', '21', '10+3+6+2'], ['per', '+8', 'эксперт'], ['fort', '+8', 'изучен'], ['ref', '+11', 'эксперт'], ['will', '+8', 'эксперт'],
  ['sk0', 'Обман', 'эксперт · +12'], ['sk1', 'Исполнение', 'изучен · +10'], ['sk2', 'Дипломатия', 'изучен · +10'], ['sk3', 'Скрытность', 'изучен · +8'],
  ['sk4', 'Оккультизм, Общество и др.', 'изучен · +6']];
// A sheet beat: the first one of a run builds the sheet on a fresh panel filled with `states`; the next keeps it and replaces the left part.
function shBeat(states) {
  if (S.sh && S.shPanel === S.panel) {
    hide(S.shLeft, .1, .4);
    return [S.sh, (S.shLeft = G(S.panel)), true];
  }
  const p0 = panel(0), sh = S.sh = charSheet(p0, .3);
  S.shPanel = p0;
  states.forEach(l => l.forEach(a => sh.fill(...a)));
  return [sh, (S.shLeft = G(p0)), false];
}
const SHX = 560;   // centre of the picture left of the sheet

/* ---------- maximum HP as a bar of pieces ---------- */
const HPX = 240, HPU = 10, HPH = 50, hpY = lv => 230 + (lv - 1) * 92;
// Pieces of Shippa's max HP at level lv: [hp, colour, kind]; kind false — earlier levels, true — this level, 'retro' — Constitution back-pay.
function hpPieces(lv) {
  const P = [[10, ANC, lv === 1]];
  for (let l = 1; l <= lv; l++) {
    const now = l === lv;
    P.push([8, CLS, now]);
    if (lv === 5 && !now) P.push([2, HERO, false], [1, HERO, 'retro']);
    else P.push([lv === 5 ? 3 : 2, HERO, now]);
  }
  if (lv === 3) P.push([3, TOUGH, true]);
  if (lv > 3) P.push([lv - 1, TOUGH, false], [1, TOUGH, true]);
  return P;
}
const HP_TOT = [0, 20, 30, 43, 54, 70];
const HP_NOTE = ['', '10 (народ) + 8 + 2', '+ 8 + 2', '+ 8 + 2, Живучесть +3', '+ 8 + 2, Живучесть ещё +1', '+ 8 + 3, задним числом +4, Живучесть +1'];
// One bar; times {old, now, retro, tough} for the kinds of pieces.
function hpRow(p, lv, t) {
  const y = hpY(lv), tk = (c, k) => k === 'retro' ? t.retro : k ? (c === TOUGH ? t.tough ?? t.now : t.now) : t.old;
  say(p, lv + '-й', HPX - 30, y + 35, t.old, { size: 26, fill: COL.dim, weight: 600, anchor: 'end' });
  let x = HPX;
  hpPieces(lv).forEach(([v, c, k]) => {
    const r = mk('rect', { x: x + 1, y, width: v * HPU - 2, height: HPH, rx: 5, fill: c, 'fill-opacity': k ? .85 : .3,
      ...(k === 'retro' ? { stroke: OK, 'stroke-width': 3 } : {}) }, p);
    put(r, { o: 0 }); show(r, tk(c, k), .35);
    x += v * HPU;
  });
  say(p, '= ' + HP_TOT[lv], 960, y + 36, t.sum ?? t.now, { size: 30, fill: COL.chalk, weight: 700, anchor: 'start' });
  say(p, HP_NOTE[lv], 1090, y + 34, t.sum ?? t.now, { size: 21, fill: COL.dim, anchor: 'start' });
}
function hpHead(p, t0) {
  say(p, 'уровень', HPX - 30, 210, t0, { size: 19, fill: COL.dim, anchor: 'end' });
  say(p, 'максимум ПЗ', 960, 210, t0, { size: 19, fill: COL.dim, anchor: 'start' });
  say(p, 'что прибавилось', 1090, 210, t0, { size: 19, fill: COL.dim, anchor: 'start' });
}

/* ---------- a Charisma column for the partial boost ---------- */
const CC = 52;
function chaCol(p, cx, base, t0, filled, mark) {
  const g = G(p, { o: 0 });
  for (let k = 0; k < 5; k++) {
    const y = base - (k + 1) * CC;
    mk('rect', { x: cx - 50, y: y + 3, width: 100, height: CC - 6, rx: 6, fill: k < filled ? RULE : 'none', 'fill-opacity': .55,
      stroke: k < filled ? RULE : COL.faint, 'stroke-width': 2, ...(k < filled ? {} : { 'stroke-dasharray': '6 5' }) }, g);
  }
  path(g, `M${cx - 66} ${base - 4 * CC}H${cx + 66}`, { stroke: COL.dim, 'stroke-width': 2 });
  path(g, `M${cx - 66} ${base}H${cx + 66}`, { stroke: COL.dim, 'stroke-width': 3 });
  show(g, t0);
  if (mark) {   // the partial-boost mark in the fifth cell
    const m = G(p, { x: cx, y: base - 4.5 * CC, o: 0, s: .6 });
    mk('rect', { x: -50, y: -CC / 2 + 3, width: 100, height: CC - 6, rx: 6, fill: 'none', stroke: RULE, 'stroke-width': 3 }, m);
    path(m, 'M-14 0L-4 11L16 -12', { stroke: RULE, 'stroke-width': 6 });
    pop(m, mark);
    return m;
  }
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Новый уровень', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 8 «Развитие» · Глава 16', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Новый уровень', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'опыт, здоровье, ранги и повышения', 800, 560, Math.max(m('sub'), 1.2), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['xp', 'Тысяча пунктов опыта', (m) => {
    const [sh, p] = shBeat([SH1]);
    title(p, 'Тысяча пунктов опыта', .2, SHX);
    const x0 = 100, u = .9, y = 230, h = 56, bx = v => x0 + v * u;
    const frame = G(p, { o: 0 });
    mk('rect', { x: x0, y, width: 1000 * u, height: h, rx: 10, fill: 'none', stroke: COL.faint, 'stroke-width': 2.5 }, frame);
    T(frame, '0', { x: x0, y: y + h + 34, size: 22, fill: COL.dim, anchor: 'middle' });
    T(frame, '1000 ПО', { x: bx(1000), y: y + h + 34, size: 22, fill: COL.dim, anchor: 'middle' });
    show(frame, .4);
    const old = mk('rect', { x: x0, y, width: 960 * u, height: h, rx: 10, fill: RULE, 'fill-opacity': .45 }, p);
    put(old, { o: 0 }); show(old, .6);
    say(p, '960 ПО', x0 + 24, y + 38, .7, { size: 26, weight: 700, anchor: 'start' });
    const add = G(p, { o: 0 });
    mk('rect', { x: bx(960), y, width: 80 * u, height: h, rx: 6, fill: OK, 'fill-opacity': .8 }, add);
    T(add, '+80', { x: bx(1000), y: y - 14, size: 24, fill: OK, weight: 700, anchor: 'middle' });
    show(add, m('xp', 1));
    L(p, [['960 + ', COL.chalk], ['80', OK], [' = 1040 ПО', COL.chalk]], x0, 380, m('xp', 3), 30);
    hr(p, 420, m('lvl', -.3), 100, 1040);
    L(p, [['каждые 1000 ПО → ', COL.chalk], ['уровень +1', LVL]], x0, 470, m('lvl'), 30);
    sh.set('lvl', '2', m('lvl', 1));
    tw(old, { o: .12 }, m('sub'), .5);
    L(p, [['1040 − 1000 = ', COL.chalk], ['40', OK]], x0, 530, m('sub'), 30);
    // the remainder slides into a new bar
    const nb = G(p, { o: 0 });
    mk('rect', { x: x0, y: 580, width: 1000 * u, height: h, rx: 10, fill: 'none', stroke: COL.faint, 'stroke-width': 2.5 }, nb);
    show(nb, m('rest', -.2));
    const rest = G(p, { o: 0 });
    mk('rect', { x: 0, y: 0, width: 40 * u, height: h, rx: 6, fill: OK, 'fill-opacity': .8 }, rest);
    put(rest, { x: bx(1000), y });
    show(rest, m('rest', -.2), .2);
    tw(rest, { x: x0, y: 580 }, m('rest'), .9, io);
    say(p, 'остаток 40 ПО не сгорает → в счёт 3-го уровня', x0 + 60, 618, m('rest', 1.2), { size: 25, fill: OK, weight: 600, anchor: 'start' });
    pillsC(p, [['1-й → 2-й: 1000', RULE, m('same', .4)], ['2-й → 3-й: 1000', RULE, m('same', 2.2)], ['3-й → 4-й: 1000', RULE, m('same', 3)]], SHX, 740, 24);
    say(p, 'порог на любом уровне один и тот же', SHX, 820, m('same', 3.4), { size: 25, fill: COL.dim });
  }],
  ['check', 'Чек-лист нового уровня', (m) => {
    const p = panel(0);
    title(p, 'Чек-лист нового уровня');
    [['Уровень +1, из ПО вычесть 1000', 's1'], ['Максимум ПЗ + число из описания класса', 's2'],
      ['Строка нового уровня в таблице развития класса: всё, что в ней', 's3'], ['Черты из этой строки', 's4'],
      ['Заклинателю: ячейки и заклинания', 's5'], ['Бонусы умения с рангом изучен и выше +1, пересчитать то, что изменили повышения', 's6'],
      ['Черты и способности, которые растут с уровнем', 's7']].forEach(([s, mark], i) => step(p, i + 1, s, 140, 150 + i * 70, m(mark), 27));
    box(p, 100, 650, 1400, 200, RULE, m('ord', -.2));
    say(p, 'порядок шагов можно менять', 140, 700, m('ord'), { size: 28, fill: RULE, weight: 700, anchor: 'start' });
    say(p, 'герой 10-го уровня:', 140, 780, m('ord', 1.6), { size: 25, fill: COL.dim, anchor: 'start' });
    pill(p, '1) повышение: Сила +2 → +3', HERO, 620, 770, m('ord', 2.4), 24);
    pill(p, '2) черта «Устрашающий вид»: нужна Сила +3', RULE, 1180, 770, m('ft'), 24);
    yesNo(p, true, 1180, 828, m('ft', 1.5), .8);
  }],
  ['hp', 'ПЗ за уровень', (m) => {
    const p = panel(0);
    title(p, 'ПЗ за уровень');
    pillsC(p, [['класс барда: 8', CLS, m('cls', .5)], ['+ Выносливость · каждый уровень', HERO, m('cls', 2.5)], ['народ: 10 · один раз, на 1-м', ANC, m('anc')],
      ['Живучесть: + уровень', TOUGH, m('tough', 3.5)]], 800, 135, 23);
    hpHead(p, m('sh', -.3));
    hpRow(p, 1, { old: m('sh', -.2), now: m('sh', .2) });
    L(p, [['Шиппа: Выносливость +2 → ', COL.chalk], ['8 + 2 = 10', HERO], [' за уровень', COL.chalk]], 240, 740, m('sh', 1), 27);
    hpRow(p, 2, { old: m('l2', -.3), now: m('l2', .2) });
    hpRow(p, 3, { old: m('l3', -.3), now: m('l3', .2), tough: m('l3', .9) });
    hpRow(p, 4, { old: m('l4', -.3), now: m('l4', .2), tough: m('l4', 3) });
  }],
  ['backpay', 'Выносливость выросла', (m) => {
    const p = panel(0);
    title(p, 'Выносливость выросла: пересчёт задним числом');
    pillsC(p, [['народ 10', ANC, .3], ['класс 8', CLS, .4], ['Выносливость', HERO, .5], ['Живучесть', TOUGH, .6]], 800, 135, 22);
    hpHead(p, .3);
    [1, 2, 3, 4].forEach(lv => hpRow(p, lv, { old: .3, now: .3 }));
    L(p, [['5-й уровень: Выносливость ', COL.chalk], ['+2 → +3', HERO]], 240, 715, m('up'), 26);
    hpRow(p, 5, { old: m('past', -.4), retro: m('past', .6), now: m('l5'), tough: m('t5'), sum: m('sum', 3) });
    L(p, [['54 + ', COL.chalk], ['4', OK], [' + ', COL.chalk], ['11', CLS], [' + ', COL.chalk], ['1', TOUGH], [' = 70', COL.chalk]], 800, 715, m('sum'), 28);
    const f1 = 'проверка: 10', f2 = ' + 5 × (8 + 3)', fx1 = 240 + uiW(f1, 28), fx2 = fx1 + uiW(f2, 28);
    L(p, [['проверка: ', COL.dim], ['10', ANC]], 240, 790, m('chk'), 28);
    L(p, [[f2, HERO]], fx1, 790, m('five'), 28);
    L(p, [[' + 5', TOUGH], [' = 10 + 55 + 5 = ', COL.chalk], ['70', OK]], fx2, 790, m('tf'), 28);
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-hp', prompt: ['Опыт и ПЗ.'], build: blanks(Q_HP),
  }, {
    id: 'c-hp-tf', prompt: ['Верно или неверно?'], build: grid(Q_HP_TF, TF, { multi: false, text: true }),
  }], done) }],
  ['prof', 'Бонус умения растёт сам', (m) => {
    const p = panel(0);
    title(p, 'Бонус умения растёт сам');
    colorLine(p, [['бонус умения = ', COL.chalk], ['уровень', LVL], [' + ', COL.chalk], ['прибавка ранга', RULE]], 800, 140, .4, { size: 32 });
    pillsC(p, [['изучен +2', RULE, m('rk')], ['эксперт +4', RULE, m('rk', 1.1)], ['мастер +6', RULE, m('rk', 2.1)], ['легенда +8', RULE, m('rk', 3.1)]], 800, 205, 24);
    const base = 760, k = 40, gx = lv => 230 + (lv - 1) * 190;
    path(p, `M120 ${base}H1080`, { stroke: COL.dim, 'stroke-width': 3 });
    const bar = (x, lv, rk, t0) => {
      const g = G(p, { o: 0 });
      mk('rect', { x, y: base - lv * k, width: 54, height: lv * k, fill: LVL, 'fill-opacity': .55 }, g);
      mk('rect', { x, y: base - (lv + rk) * k, width: 54, height: rk * k, fill: RULE, 'fill-opacity': .7 }, g);
      T(g, '+' + (lv + rk), { x: x + 27, y: base - (lv + rk) * k - 12, size: 24, fill: COL.chalk, weight: 700, anchor: 'middle' });
      show(g, t0, .4);
    };
    for (let lv = 1; lv <= 5; lv++) {
      const t0 = m('lv', .4 + (lv - 1) * .6);
      say(p, lv + '-й', gx(lv), 800, t0, { size: 24, fill: COL.dim, weight: 600 });
      bar(gx(lv) - 62, lv, 2, t0); bar(gx(lv) + 2, lv, 4, t0 + .2);
      const u = G(p, { o: 0 });
      path(u, `M${gx(lv) + 64} ${base - 4}H${gx(lv) + 110}`, { stroke: NO, 'stroke-width': 5 });
      T(u, '0', { x: gx(lv) + 87, y: base - 14, size: 22, fill: NO, weight: 700, anchor: 'middle' });
      show(u, m('un', .6 + (lv - 1) * .2));
    }
    say(p, 'уровень 1–5 · слева изучен, справа эксперт', 600, 850, m('lv', .3), { size: 22, fill: COL.dim });
    const col = (s, y, t0, fill = COL.chalk, size = 23) => say(p, s, 1160, y, t0, { size, fill, anchor: 'start' });
    col('каждый уровень +1:', 330, m('all'), COL.dim, 22);
    ['КБ, атаки, Внимание,', 'испытания, навыки,', 'атака заклинанием,', 'СЛ заклинаний, классовая СЛ'].forEach((s, i) => col(s, 375 + i * 40, m('all', .5 + i * .8)));
    hr(p, 560, m('un', -.3), 1160, 1520);
