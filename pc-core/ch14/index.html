'use strict';
const CHAPTER = { number: 14, title: 'Заклинания', minutes: 13, language: 'ru', next: '../ch15/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Spells, spell names and areas MAG; slots and focus points (resources) RULE; heroes HERO, the bandit FOE.
const MAG = COL.real;
const PPL = { b: ['Бронна', HERO], t: ['Тиль', HERO], r: ['Разбойник', FOE], s: ['Шиппа', HERO] };
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch08–ch09).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// A die outline of `sides` with the rolled number inside, no label (as in ch09).
function dieNum(p, sides, n, x, y, t0, size = 44, colr = RULE) {
  const d = dieShape(p, sides, x, y, colr, t0, size, null, false);
  T(d, String(n), { y: size * .3, size: size * .8, fill: colr, weight: 700, anchor: 'middle' });
  return d;
}
// Pills in a row centred on cx (as in ch07, ch09).
const pw = (s, size) => s.length * size * .56 + 44;
function pillRow(p, items, cx, y, size, colr, t0s) {
  const w = items.map(s => pw(s, size)), tot = w.reduce((a, b) => a + b + 18, -18);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, colr, x + w[i] / 2, y, t0s[i], size); x += w[i] + 18; return g; });
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f with a degree of success (as in ch09).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}
// A ring with a letter, no name (tight diagrams, as in ch09).
function tok(p, letter, colr, x, y, t0, r = 30) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// A spell slot: amber square; use(t, spell) crosses it out with the spell named below, tag(t, spell) only names it, free(t) restores it.
function slotBox(p, x, y, t0, sub = '1-й круг', w = 180, h = 140) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 16, fill: '#22322d', stroke: RULE, 'stroke-width': 3 }, g);
  const f = mk('rect', { x, y, width: w, height: h, rx: 16, fill: RULE, 'fill-opacity': .25 }, g);
  T(g, 'ячейка', { x: x + w / 2, y: y + h / 2 - 4, size: 26, weight: 600, anchor: 'middle' });
  T(g, sub, { x: x + w / 2, y: y + h / 2 + 30, size: 21, fill: COL.dim, anchor: 'middle' });
  const lab = T(g, '', { x: x + w / 2, y: y + h + 34, size: 23, fill: MAG, weight: 600, anchor: 'middle', o: 0 });
  const X = path(g, `M${x + 26} ${y + 22}L${x + w - 26} ${y + h - 22}M${x + w - 26} ${y + 22}L${x + 26} ${y + h - 22}`, { stroke: NO, 'stroke-width': 6 }, { d: 0 });
  show(g, t0);
  const tag = (t1, s) => { prog(() => { lab.textContent = s; }, t1, 0); show(lab, t1, .3); };
  return {
    g,
    tag,
    use(t1, s) { if (s) tag(t1, s); draw(X, t1 + .2, .4); tw(f, { o: 0 }, t1 + .2, .4); },
    free(t1) { tw(X, { d: 0 }, t1, .4); tw(f, { o: 1 }, t1, .4); hide(lab, t1, .4); },
  };
}
// A focus point token.
function fpTok(p, x, y, t0, r = 30) {
  const g = G(p, { x, y, o: 0, s: .6 });
  mk('circle', { r, fill: mix(COL.board, RULE, .35), stroke: RULE, 'stroke-width': 3 }, g);
  T(g, 'ФП', { y: r * .3, size: r * .7, fill: COL.chalk, weight: 700, anchor: 'middle' });
  pop(g, t0);
  return g;
}
// A square grid of `cols` × `rows` cells of size c from (x, y); fill(cells, colour, t0) paints [col, row] cells.
// Distances follow movement: every second diagonal costs 10 feet (dist5, in feet, for a step of (dx, dy) cells).
const dist5 = (dx, dy) => { const a = Math.max(Math.abs(dx), Math.abs(dy)), b = Math.min(Math.abs(dx), Math.abs(dy)); return 5 * (a + Math.floor(b / 2)); };
function cellGrid(p, x, y, cols, rows, c, t0, { thin = false } = {}) {
  const g = G(p, { o: 0 });
  if (thin) {
    for (let i = 0; i <= cols; i++) path(g, `M${x + i * c} ${y}V${y + rows * c}`, { stroke: COL.faint, 'stroke-width': 1 });
    for (let j = 0; j <= rows; j++) path(g, `M${x} ${y + j * c}H${x + cols * c}`, { stroke: COL.faint, 'stroke-width': 1 });
  } else for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++)
    mk('rect', { x: x + i * c + 3, y: y + j * c + 3, width: c - 6, height: c - 6, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
  show(g, t0);
  const top = G(p);
  const XY = (i, j) => [x + i * c + c / 2, y + j * c + c / 2];
  return {
    XY, c,
    fill(cells, colr, t1, op = .4, step = 0) {
      return cells.map(([i, j], k) => {
        const r = mk('rect', { x: x + i * c + (thin ? 0 : 3), y: y + j * c + (thin ? 0 : 3), width: c - (thin ? 0 : 6), height: c - (thin ? 0 : 6), rx: thin ? 0 : 6, fill: colr, 'fill-opacity': op }, top);
        put(r, { o: 0 }); show(r, t1 + k * step, .3);
        return r;
      });
    },
  };
}
// The mill yard of chapter 8 (smaller): 7 × 3 cells of 5 feet, barn in the last column.
const MAP = { x: 100, y: 140, c: 90 };
const cellXY = (c, r) => [MAP.x + c * MAP.c + MAP.c / 2, MAP.y + r * MAP.c + MAP.c / 2];
function yard(p, t0) {
  const g = G(p, { o: 0 }), { x, y, c } = MAP;
  for (let i = 0; i < 7; i++) for (let j = 0; j < 3; j++)
    mk('rect', { x: x + i * c + 3, y: y + j * c + 3, width: c - 6, height: c - 6, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
  mk('rect', { x: x + 7 * c + 6, y: y - 10, width: c - 6, height: 3 * c + 20, rx: 6, fill: '#2a2620', stroke: COL.dim, 'stroke-width': 3 }, g);
  T(g, 'амбар', { x: x + 7.5 * c + 3, y: y + 1.5 * c + 8, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  T(g, 'мельничный двор · клетка 5 футов', { x: x + 3.5 * c, y: y + 3 * c + 40, size: 22, fill: COL.dim, anchor: 'middle' });
  show(g, t0);
}
function mtok(p, k, c, r, t0) {
  const [x, y] = cellXY(c, r);
  return tok(p, PPL[k][0][0], PPL[k][1], x, y, t0, 30);
}
