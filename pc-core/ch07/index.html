'use strict';
const CHAPTER = { number: 7, title: 'Навыки и их действия', minutes: 13, language: 'ru', next: null };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Attribute modifier, proficiency bonus, armour penalty (as in ch03, ch06); NPCs that are not foes — dim chalk.
const ATTR = HERO, PROF = RULE, NPC = COL.dim;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const pw = (s, size) => s.length * size * .56 + 44;   // width of a pill()
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
// Pills in a row centred on cx; t0s[i] is when pill i appears.
function pillRow(p, items, cx, y, size, colr, t0s) {
  const w = items.map(s => pw(s, size)), tot = w.reduce((a, b) => a + b + 18, -18);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, [].concat(colr)[i] || [].concat(colr)[0], x + w[i] / 2, y, t0s[i], size); x += w[i] + 18; return g; });
}
// A padlock: actions only for the trained.
function padlock(p, x, y, colr, t0, s = 1) {
  const g = G(p, { x, y, o: 0, s });
  path(g, 'M-13 -8V-20A13 13 0 0 1 13 -20V-8', { stroke: colr, 'stroke-width': 5 });
  mk('rect', { x: -20, y: -9, width: 40, height: 32, rx: 6, fill: colr }, g);
  mk('circle', { cx: 0, cy: 5, r: 4.5, fill: COL.board }, g);
  if (t0 != null) show(g, t0);
  return g;
}
// The totals 0…30 with the four degrees of success for one DC; marks: { s, cs, f, cf } -> time each band appears; texts under the names.
function degScale(p, { dc, y, t0, marks, texts = {}, x0 = 170, u = 42 }) {
  const X = v => x0 + v * u;
  draw(path(p, `M${X(0)} ${y}H${X(30)}`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), t0, .6);
  for (let v = 0; v <= 30; v++) {
    path(p, `M${X(v)} ${y - (v % 5 ? 6 : 10)}V${y + (v % 5 ? 6 : 10)}`, { stroke: COL.dim, 'stroke-width': 2 });
    if (v % 5 === 0) say(p, String(v), X(v), y + 40, t0, { size: 22, fill: COL.dim });
  }
  const span = { cs: [dc + 9.5, 30.5], s: [dc - .5, dc + 9.5], f: [dc - 9.5, dc - .5], cf: [-.5, dc - 9.5] };
  DEG.forEach(([k, name, colr, op]) => {
    const [a, b] = span[k].map(v => Math.max(-.5, Math.min(30.5, v)));
    if (b <= a || marks[k] == null) return;
    const r = mk('rect', { x: X(a), y: y - 126, width: X(b) - X(a), height: 112, rx: 6, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, p);
    put(r, { o: 0 }); show(r, marks[k]);
    if (X(b) - X(a) < 140) return;   // too narrow for a label
    say(p, name, (X(a) + X(b)) / 2, y - 80, marks[k] + .1, { size: 22, weight: 700 });
    if (texts[k]) say(p, texts[k], (X(a) + X(b)) / 2, y - 42, marks[k] + .3, { size: 20, fill: COL.chalk });
  });
  const dl = path(p, `M${X(dc)} ${y - 150}V${y + 12}`, { stroke: RULE, 'stroke-width': 4 }, { d: 0 });
  draw(dl, t0 + .3, .4);
  say(p, 'СЛ ' + dc, X(dc) + 10, y - 132, t0 + .5, { size: 24, fill: RULE, weight: 700, anchor: 'start' });
  return X;
}
// A marker on a degScale at total v.
function scaleMark(p, X, y, v, colr, t0, label, ghost) {
  const g = G(p, { x: X(v), y, o: 0 });
  mk('circle', { r: 13, fill: ghost ? COL.board : colr, stroke: colr, 'stroke-width': 3, ...(ghost ? { 'stroke-dasharray': '5 4' } : {}) }, g);
  if (label) T(g, label, { y: -150 - 14, size: 24, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0, .3);
  return g;
}
// A die with its roll and a coloured sum after it, left-aligned at x.
function roll(p, n, x, y, parts, t0, size = 30) {
  numDie(p, n, x, y - 10, t0, 34);
  colorLine(p, parts, x + 56, y, t0 + .3, { size, anchor: 'start' });
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [

    H.forEach(([n, x, y, line, sk, mark, smark]) => {

    say(p, '−', x0 + a + b + 90, 180, m('arm'), { size: 36, fill: COL.dim });
    pill(p, 'штраф доспеха', NO, x0 + a + b + 120 + c / 2, 170, m('arm'), 28);
    say(p, 'только навыки на Силу и Ловкость', x0 + a + b + 120 + c / 2, 236, m('arm', .4), { size: 21, fill: NO });

  }],

    say(p, 'только для изученных', 1200, 168, m('tr'), { size: 34, fill: PROF, weight: 700 });

    hr(p, 360, m('sh', -.3), 110, 730);

    yesNo(p, true, 420, 730, m('dem', 1), 1.2);

    say(p, 'нужно изученное Воровство', 1180, 390, m('lock', 1.4), { size: 26 });

  ['lore', 'Знание', (m) => {

    draw(path(p, 'M520 330H1080', { stroke: NO, 'stroke-width': 5, 'stroke-linecap': 'round' }, { d: 0 }), m('no', 2), .4);

    const u = 26, x0 = 520, bar = (y, label, dc, colr, t0) => {

    who(p, 'Ведущий', GMC, 200, 690, m('secret'));
    numDie(p, '?', 330, 700, m('secret', .4), 40);
    const scr = mk('rect', { x: 400, y: 610, width: 26, height: 170, rx: 6, fill: COL.faint, stroke: COL.dim, 'stroke-width': 2 }, p);

    colorLine(p, [['тайная проверка: ', RULE], ['кубик бросает ведущий', COL.chalk]], 480, 670, m('secret', .8), { size: 30, anchor: 'start' });

  ['recall', 'Вспомнить информацию', (m) => {
    const p = panel(0);
    title(p, 'Вспомнить информацию');
    actGlyph(p, 1, 600, 128, RULE, m('act')); put(p.lastChild, { s: .6 });
    colorLine(p, [['без обучения', OK], [' · тайная', RULE]], 640, 138, m('act'), { size: 28, anchor: 'start' });
    pillRow(p, ['Мистицизм', 'Религия', 'Природа', 'Общество', 'Знание', '…'], 800, 210, 24, COL.chalk, [0, 1, 2, 3, 4, 5].map(i => m('sk', .3 + i * .6)));
    bubble(p, 'Что это за тварь?', 800, 290, HERO, m('q'), { size: 24 });
    const y = 540;
    const X = degScale(p, { dc: 15, y, t0: m('q', .5), marks: { s: m('s'), cs: m('cs'), f: m('f'), cf: m('cf') },

    roll(p, 14, 440, 800, [['14 + 3 = ', COL.chalk], ['17', COL.chalk]], m('roll'), 34);
    scaleMark(p, X, y, 17, HERO, m('roll', 1.5), '17');
    colorLine(p, [['успех: ', OK], ['знак бога мёртвых', COL.chalk]], 1000, 810, m('res', .4), { size: 30, anchor: 'start' });
    scaleMark(p, X, y, 25, OK, m('crit'), '25', true);
    say(p, 'для подробности нужно 25', 1460, 860, m('crit', .3), { size: 22, fill: OK, anchor: 'end' });

  ['obst', 'Ломание и Взлом замка', (m) => {
    const p = panel(0);
    title(p, 'Дверь склада: Ломание и Взлом замка');
    box(p, 50, 100, 730, 780, COL.faint, m('fo', -.2));
    actGlyph(p, 1, 100, 160, RULE, m('fo')); put(p.lastChild, { s: .6 });
    say(p, 'Ломание', 140, 172, m('fo'), { size: 34, weight: 700, anchor: 'start' });
