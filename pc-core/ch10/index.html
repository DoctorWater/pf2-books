<script>
'use strict';
const CHAPTER = { number: 10, title: 'Движение и позиция на поле', minutes: 13, language: 'ru', next: '../ch11/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Heroes HERO, bandit and mercenary FOE, costs and rules RULE, difficult terrain TERR, safe OK, risky / penalties NO.
const TERR = COL.real;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const XR = 880;   // left edge of the right-hand column beside the board
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch09).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// A ring with a letter, no name under it (as in ch09).
function tok(p, letter, colr, x, y, t0, r = 34) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  if (t0 != null) show(g, t0);
  return g;
}
// A few strokes of a bush around (0,0), scale k.
const bushMark = (g, k = 1) => path(g, `M${-30 * k} ${8 * k}q${10 * k} ${-20 * k} ${20 * k} 0q${10 * k} ${-20 * k} ${20 * k} 0q${10 * k} ${-20 * k} ${20 * k} 0`, { stroke: TERR, 'stroke-width': 3 });

/* ---------- the board: columns a–g, rows 1–5, north up; one cell = 5 feet ---------- */
const BX = 70, BY = 150, C = 104, COLS = 'abcdefg';
const cx = c => BX + (COLS.indexOf(c[0]) + .5) * C, cy = c => BY + (+c[1] - .5) * C;
const at = c => ({ x: cx(c), y: cy(c) });
const HOME = { Ш: ['a3', HERO], Б: ['b4', HERO], Р: ['e3', FOE] };              // before the fight
const R2 = { Ш: ['e2', HERO], Б: ['e4', HERO], Р: ['e3', FOE] };                // round 2: the bandit is flanked
const R2M = { ...R2, Н: ['f1', FOE] };                                          // … and the mercenary has come
const MERC_REACH = ['e1', 'e2', 'f2', 'g1', 'g2'];
// Draw the board at t0 with tokens at pos {letter: [cell, colour]}. Returns {tk, lay (routes under the tokens), wag, bush}.
function field(p, t0, pos) {
  const g = G(p, { o: 0 });
  for (let i = 0; i < 7; i++) for (let j = 0; j < 5; j++)
    mk('rect', { x: BX + i * C + 3, y: BY + j * C + 3, width: C - 6, height: C - 6, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
  [...COLS].forEach((s, i) => T(g, s, { x: BX + (i + .5) * C, y: BY - 14, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' }));
  for (let j = 1; j <= 5; j++) T(g, String(j), { x: BX - 22, y: BY + (j - .5) * C + 8, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  const bush = ['c4', 'd4'].map(c => {
    const b = G(g, at(c));
    mk('rect', { x: -C / 2 + 4, y: -C / 2 + 4, width: C - 8, height: C - 8, rx: 8, fill: TERR, 'fill-opacity': .14, stroke: TERR, 'stroke-width': 2 }, b);
    [[-14, -18], [14, 6], [-10, 28]].forEach(([x, y]) => { const q = G(b, { x, y }); bushMark(q, .7); });
    return b;
  });
  const wag = G(g, { x: cx('c2'), y: (cy('c2') + cy('c3')) / 2 });
  mk('rect', { x: -C / 2 + 8, y: -C + 8, width: C - 16, height: 2 * C - 16, rx: 12, fill: mix(COL.board, COL.dim, .3), stroke: COL.dim, 'stroke-width': 3 }, wag);
  const wl = G(wag, { r: -90 });
  T(wl, 'повозка', { y: 8, size: 24, fill: COL.chalk, weight: 600, anchor: 'middle' });
  show(g, t0);
  const lay = G(p);
  const tk = {};
  Object.entries(pos).forEach(([k, [c, colr]], i) => { tk[k] = tok(p, k, colr, cx(c), cy(c), t0 + .2 + i * .1); });
  return { g, tk, lay, wag, bush };
}
// A translucent cell highlight.
function hlCell(p, c, colr, t0, op = .2) {
  const r = mk('rect', { x: cx(c) - C / 2 + 4, y: cy(c) - C / 2 + 4, width: C - 8, height: C - 8, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2 }, p);
  put(r, { o: 0 }); show(r, t0, .3);
  return r;
}
// One leg of a route between cell centres, drawn on at t0 (dashed if asked); d shifts the line for a second route.
function leg(p, a, b, colr, t0, { dash = false, d = 0, w = 5 } = {}) {
  const e = path(p, `M${cx(a) + d} ${cy(a) + d}L${cx(b) + d} ${cy(b) + d}`, { stroke: colr, 'stroke-width': w, ...(dash ? { 'stroke-dasharray': '12 9' } : {}) });
  put(e, { o: 0 }); show(e, t0, .35);
  return e;
}
// A small cost label in a cell (upper right), parts [[text, colour], …].
function tag(p, c, parts, t0, size = 22, dx = 22, dy = -26) {
  const str = parts.map(q => q[0]).join(''), w = uiW(str, size) + 22, h = size + 14;
  const g = G(p, { x: cx(c) + dx, y: cy(c) + dy, o: 0, s: .6 });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: COL.board, stroke: COL.faint, 'stroke-width': 1.5 }, g);
  const t = T(g, '', { y: size * .36, size, weight: 700, anchor: 'middle' });
  parts.forEach(([s, c2 = RULE]) => { mk('tspan', { fill: c2 }, t).textContent = s; });
  pop(g, t0);
  return g;
}
// Move a token through cells, one step every dt seconds from t0.
function walk(e, cells, t0, dt = .45) { cells.forEach((c, i) => tw(e, at(c), t0 + i * dt, dt * .9)); }
// A legend row: small token, text.
function key(p, letter, colr, text, x, y, t0) {
  tok(p, letter, colr, x, y - 9, t0, 22);
  return say(p, text, x + 38, y, t0, { size: 25, anchor: 'start' });
}
// A grid of n × m small dashed cells (size s) with its top left at (x, y); returns the cell centre function.
function miniGrid(p, x, y, n, m, s, t0) {
  const g = G(p, { o: 0 });
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++)
    mk('rect', { x: x + i * s + 2, y: y + j * s + 2, width: s - 4, height: s - 4, rx: 5, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '5 4' }, g);
  show(g, t0);
  return (i, j) => [x + (i + .5) * s, y + (j + .5) * s];
}
// A filled mini cell.
function miniCell(p, [x, y], s, colr, t0, op = .2) {
  const r = mk('rect', { x: x - s / 2 + 2, y: y - s / 2 + 2, width: s - 4, height: s - 4, rx: 5, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2 }, p);
  put(r, { o: 0 }); show(r, t0, .3);
  return r;
}
// Twenty faces as a thin strip from x (face width 25): hits from `need` filled with colr.
function strip(p, x, y, need, colr, t0) {
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) mk('rect', { x: x + (f - 1) * 25, y, width: 22, height: 22, rx: 3, fill: f >= need ? colr : COL.faint, 'fill-opacity': f >= need ? .7 : .3 }, g);
  show(g, t0);
  return g;
}
// The flank line on the board: centre of e2 to centre of e4, under the tokens.
const flankLine = (F, t0) => { const e = path(F.lay, `M${cx('e2')} ${cy('e2')}L${cx('e4')} ${cy('e4')}`, { stroke: RULE, 'stroke-width': 4, 'stroke-dasharray': '12 9' }); put(e, { o: 0 }); show(e, t0); return e; };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Движение и позиция на поле', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 4 «Бой» · Глава 10', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Движение и позиция на поле', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'клетки, досягаемость, тиски и укрытие', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['table', 'Поле в клетках', (m) => {
    const p = panel(0);
    title(p, 'Поле в клетках');
    const F = field(p, .3, HOME);
    bubble(p, 'Раз, два, три, четыре, пять — стою рядом', 1200, 200, HERO, m('say'), { size: 24 });
    // the player's count: two diagonals, then straight; the fifth cell is one too many
    const P = ['b2', 'c1', 'd1', 'e1', 'e2'], cnt = [3.4, 3.9, 4.6, 5.0, 5.6], ghost = G(p), gl = G(F.lay);
    P.forEach((c, i) => {
      leg(gl, i ? P[i - 1] : 'a3', c, HERO, cnt[i] - .2, { dash: true, w: 4 });
      tag(ghost, c, [[String(i + 1), HERO]], cnt[i]);
    });
    bubble(p, 'Вторая диагональ стоит 10 футов', 1200, 320, GMC, m('gm'), { size: 24 });
    tag(ghost, 'c1', [['10', NO]], m('gm', 4.7), 22, 22, 26);
    yesNo(ghost, false, cx('e2'), cy('e2'), m('gm', 6.5), 1.6);
    hide(ghost, m('map', -.3), .5); hide(gl, m('map', -.3), .5);
    say(p, 'столбцы a–g · строки 1–5 · север сверху', 1200, 430, m('map', 1.6), { size: 24, fill: COL.dim });
    key(p, 'Ш', HERO, 'Шиппа · a3', XR + 30, 520, m('heroes'));
    key(p, 'Б', HERO, 'Бронна · b4', XR + 30, 580, m('heroes', .6));
    key(p, 'Р', FOE, 'разбойник · e3 · КБ 16', XR + 30, 640, m('foe'));
    grow(F.tk.Ш, 1, m('heroes')); grow(F.tk.Б, 1, m('heroes', .6)); grow(F.tk.Р, 1, m('foe'));
    L(p, [['повозка', COL.chalk], [' · c2, c3', COL.dim]], XR + 8, 710, m('wagon'), 25);
    L(p, [['кусты', TERR], [' · c4, d4', COL.dim]], XR + 8, 770, m('bush'), 25);
    grow(F.wag, 1, m('wagon')); F.bush.forEach(b => grow(b, 1, m('bush')));
  }],
  ['speed', 'Клетки и Скорость', (m) => {
    const p = panel(0);
    title(p, 'Клетки и Скорость');
    const F = field(p, .3, HOME);
    hlCell(p, 'g1', RULE, .6, .25);
    say(p, '5 фт', cx('g1'), cy('g1') + 9, .7, { size: 24, fill: RULE, weight: 700 });
    L(p, [['1 клетка = ', COL.chalk], ['5 футов', RULE]], XR, 200, .6, 30);
    L(p, [['Скорость', HERO], [' ÷ 5 = клеток за одно Перемещение', COL.chalk]], XR, 280, m('spd'), 27);
    const count = (who, cells, t0) => cells.forEach((c, i) => {
      leg(F.lay, i ? cells[i - 1] : who, c, HERO, t0 + i * .35, { dash: true, w: 4 });
      tag(p, c, [[String(i + 1), HERO]], t0 + i * .35 + .2);
    });
    count('a3', ['a4', 'a5', 'b5', 'c5', 'd5'], m('ship', .4));
    L(p, [['Шиппа: ', HERO], ['25 ÷ 5 = 5 клеток', COL.chalk]], XR, 400, m('ship'), 28);
    count('b4', ['b3', 'b2', 'b1', 'c1'], m('bron', .4));
    L(p, [['Бронна: ', HERO], ['20 ÷ 5 = 4 клетки', COL.chalk]], XR, 480, m('bron'), 28);
  }],
  ['diag', 'Диагонали', (m) => {
    const p = panel(0);
    title(p, 'Диагонали: 5, 10, 5, 10');
    const F = field(p, .3, HOME);
    L(p, [['по прямой: каждая клетка ', COL.chalk], ['5', RULE]], XR, 190, .5, 27);
    // a staircase of four diagonal cells on the right
    const s = 84, x0 = 960, y0 = 700, cc = k => [x0 + k * s + s / 2, y0 - k * s + s / 2];
    const stairs = G(p, { o: 0 }), under = G(p);
    for (let k = 0; k <= 4; k++) mk('rect', { x: x0 + k * s + 2, y: y0 - k * s + 2, width: s - 4, height: s - 4, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, stairs);
    show(stairs, m('d1', -.4));
    tok(p, 'Ш', HERO, ...cc(0), m('d1', -.4), 28);
    const top = G(p);
    [['5', 'd1'], ['10', 'd2'], ['5', 'd3'], ['10', 'd4']].forEach(([v, mk_], i) => {
      const [x, y] = cc(i + 1), [a, b] = cc(i);
      const e = path(under, `M${a} ${b}L${x} ${y}`, { stroke: HERO, 'stroke-width': 4, 'stroke-dasharray': '10 8' }); put(e, { o: 0 }); show(e, m(mk_, .1), .3);
      const r = mk('rect', { x: x - s / 2 + 2, y: y - s / 2 + 2, width: s - 4, height: s - 4, rx: 6, fill: RULE, 'fill-opacity': v === '10' ? .32 : .12 }, under);
      put(r, { o: 0 }); show(r, m(mk_), .3);
      say(top, v, x, y + 12, m(mk_), { size: 34, fill: RULE, weight: 700 });
    });
    L(p, [['5 + 10 + 5 + 10 = ', COL.chalk], ['30 футов', RULE]], XR, 300, m('sum'), 30);
    // across the whole turn: one diagonal in the first Stride, the next one already costs 10
    leg(F.lay, 'a3', 'b2', HERO, m('turn', 4), { dash: true, w: 4 }); walk(F.tk.Ш, ['b2'], m('turn', 4));
    tag(p, 'b2', [['5', RULE]], m('turn', 4.3));
    leg(F.lay, 'b2', 'c1', HERO, m('next', .3), { dash: true, w: 4 }); walk(F.tk.Ш, ['c1'], m('next', .3));
    tag(p, 'c1', [['10', RULE]], m('next', 2.5));
    L(p, [['Перемещение 1: ', COL.chalk], ['диагональ — 5', RULE]], 70, 730, m('turn', 4));
    L(p, [['Перемещение 2: ', COL.chalk], ['диагональ уже 2-я за ход — 10', RULE]], 70, 780, m('next'));
    L(p, [['конец хода → ', COL.chalk], ['счёт с нуля', OK]], 70, 830, m('reset'));
  }],
  ['path', 'Путь Шиппы', (m) => {
    const p = panel(0);
    title(p, 'Путь Шиппы в обход повозки');
    const F = field(p, .3, HOME);
    hlCell(p, 'e2', HERO, .6, .12);
    const blk = G(p);
    arrowTo(blk, cx('a3') + 40, cy('a3'), cx('c3') - 70, cy('a3'), NO, m('block'), true);
    yesNo(blk, false, cx('b3') + 34, cy('b3') - 40, m('block', .5), 1.2);
    hide(blk, m('s1', -.2), .3);
    const head = [['шаг', XR], ['как', XR + 150], ['стоит', XR + 420], ['всего', XR + 540]];
    head.forEach(([s, x]) => say(p, s, x, 190, m('s1', -.3), { size: 22, fill: COL.dim, anchor: 'start' }));
    hr(p, 206, m('s1', -.3), XR, 1520);
    const S4 = [['a3', 'b2', '5', '5', '1-я диагональ', 's1'], ['b2', 'c1', '10', '15', '2-я диагональ', 's2'],
      ['c1', 'd1', '5', '20', 'прямо', 's3'], ['d1', 'e2', '5', '25', '3-я диагональ', 's4']];
    S4.forEach(([a, b, c, tot, how, mk_], i) => {
      const t0 = m(mk_), y = 250 + i * 52;
      leg(F.lay, a, b, HERO, t0); walk(F.tk.Ш, [b], t0 + .1);
      tag(p, b, [[c, RULE]], t0 + .5);
      say(p, a + ' → ' + b, XR, y, t0, { size: 25, anchor: 'start' });
      say(p, how, XR + 150, y, t0 + .1, { size: 25, fill: COL.dim, anchor: 'start' });
      say(p, c, XR + 420, y, t0 + .2, { size: 25, fill: RULE, weight: 700, anchor: 'start' });
      say(p, tot, XR + 540, y, t0 + .5, { size: 25, weight: 700, anchor: 'start' });
    });
    L(p, [['25 футов = ', COL.chalk], ['одно Перемещение', OK]], XR, 490, m('s4', 2.2), 28);
    // without diagonals: seven cells
    const A = ['a3', 'b3', 'b2', 'b1', 'c1', 'd1', 'e1', 'e2'];
    A.slice(1).forEach((c, i) => leg(F.lay, A[i], c, COL.dim, m('alt', i * .3), { dash: true, d: 10, w: 4 }));
    L(p, [['без диагоналей: 7 клеток × 5 = ', COL.dim], ['35 футов', COL.chalk]], XR, 590, m('alt', .6), 26);
    L(p, [['больше 25 → ', COL.dim], ['два Перемещения', NO]], XR, 640, m('two', .5), 26);
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-diag', prompt: ['Клетки и диагонали.'], build: blanks(Q_DIAG),
  }], done) }],
  ['stride', 'Перемещение и Шаг', (m) => {
    const p = panel(0);
    title(p, 'Перемещение и Шаг');
    glyph(p, 1, 120, 150, .3, .5);
    say(p, 'Перемещение', 158, 162, .3, { size: 34, weight: 700, anchor: 'start' });
    say(p, 'до Скорости · остаток пропадает', 430, 162, m('up'), { size: 26, fill: COL.dim, anchor: 'start' });
    say(p, 'разорвать нельзя: 3 клетки, Удар, ещё 2 клетки —', 100, 250, m('split'), { size: 26, anchor: 'start' });
    const tc = turnCells(p, 100, 280, m('split', 1), { w: 220, h: 112, react: false });
    tc.spend(0, 'Перемещение', m('c1'), '3 клетки'); tc.spend(1, 'Удар', m('c2')); tc.spend(2, 'Перемещение', m('c3'), '2 клетки');
    say(p, 'все три действия', 100 + 344, 440, m('c3', 1), { size: 24, fill: RULE, weight: 600 });
    // passing through: an ally, an enemy, stopping in another's cell
    const row = (y, a, b, txt, ok, t0, stop) => {
      const s = 76, x = 900, c = i => x + i * s + s / 2;
      const g = miniGrid(p, x, y - s / 2, 3, 1, s, t0);
      tok(p, a[0], a[1], c(0), y, t0, 26); tok(p, b[0], b[1], c(1), y, t0, 26);
      arrowTo(p, c(0) + 30, y - 34, (stop ? c(1) : c(2)) - 8, y - 34, ok ? OK : NO, t0 + .3);
      [].concat(txt).forEach((q, k, a) => say(p, q, x + 3 * s + 24, y + 9 + (k - (a.length - 1) / 2) * 34, t0 + .4, { size: 25, fill: ok ? OK : NO, weight: 600, anchor: 'start' }));
    };
    row(260, ['Ш', HERO], ['Б', HERO], 'сквозь союзника — можно', true, m('ally'));
    row(400, ['Ш', HERO], ['Р', FOE], ['сквозь врага —', 'только Перекатом'], false, m('enemy'));
    row(540, ['Ш', HERO], ['Б', HERO], ['закончить ход', 'в чужой клетке — нельзя'], false, m('end'), true);
    hr(p, 620, m('step', -.3));
    glyph(p, 1, 120, 690, m('step'), .5);
    say(p, 'Шаг', 158, 702, m('step'), { size: 34, weight: 700, anchor: 'start' });
    say(p, '1 клетка, 5 футов', 260, 702, m('step', .6), { size: 26, fill: COL.dim, anchor: 'start' });
    L(p, [['не провоцирует ответных действий на движение', OK]], 100, 770, m('safe'), 27);
    L(p, [['в пересечённую местность — ', COL.chalk], ['нельзя', NO]], 100, 830, m('nodiff'), 27);
    const bg = G(p, { x: 640, y: 820, o: 0 });
    mk('rect', { x: -40, y: -40, width: 80, height: 80, rx: 8, fill: TERR, 'fill-opacity': .14, stroke: TERR, 'stroke-width': 2 }, bg);
    bushMark(bg, .9);
