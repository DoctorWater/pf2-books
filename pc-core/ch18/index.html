'use strict';
const CHAPTER = { number: 18, title: 'Архетипы', minutes: 14, language: 'ru', next: '../ch19/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Archetype and dedication ARC (purple), slots, rules and numbers RULE, Shippa HERO, GM GMC, the rogue FOE, right OK, wrong NO.
const ARC = COL.real;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0, dash) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: dash ? 'none' : '#22322d', stroke: colr, 'stroke-width': 2.5, ...(dash ? { 'stroke-dasharray': '10 8' } : {}) }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2, x = 800) => say(p, s, x, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };
const pw = (s, size) => s.length * size * .56 + 44;
// Pills of their own colours [[text, colour, t0], …] in a row centred on cx.
function pillsC(p, items, cx, y, size = 24) {
  const w = items.map(([s]) => pw(s, size)), tot = w.reduce((a, b) => a + b + 16, -16);
  let x = cx - tot / 2;
  return items.map(([s, c, t0], i) => { const g = pill(p, s, c, x + w[i] / 2, y, t0, size); x += w[i] + 16; return g; });
}
// A numbered step: amber disc with n, text after it (and a dim second line); returns the group (hidden until t0).
function step(p, n, str, x, y, t0, size = 27, sub) {
  const g = G(p, { x: -20, o: 0 });
  mk('circle', { cx: x, cy: y - size * .36, r: 22, fill: mix(COL.board, RULE, .3), stroke: RULE, 'stroke-width': 2.5 }, g);
  T(g, String(n), { x, y: y - size * .36 + 9, size: 24, fill: RULE, weight: 700, anchor: 'middle' });
  if (typeof str === 'string') T(g, str, { x: x + 40, y, size, fill: COL.chalk, weight: 500 });
  else { const e = T(g, '', { x: x + 40, y, size, weight: 500 }); str.forEach(([s, c = COL.chalk]) => { mk('tspan', { fill: c }, e).textContent = s; }); }
  if (sub) (Array.isArray(sub) ? sub : [sub]).forEach((s, i) => T(g, s, { x: x + 40, y: y + 36 + i * 30, size: 22, fill: COL.dim }));
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  return g;
}
// A square token for the feat count: D dedication, F other feat, E empty (dashed).
function sq(p, x, y, kind, t0, s = 64) {
  const g = G(p, { x, y, o: 0 });
  const c = kind === 'D' ? ARC : RULE;
  mk('rect', { x: 0, y: 0, width: s, height: s, rx: 10, fill: kind === 'E' ? 'none' : c, 'fill-opacity': kind === 'E' ? 1 : .5, stroke: kind === 'E' ? COL.faint : c, 'stroke-width': 2.5,
    ...(kind === 'E' ? { 'stroke-dasharray': '7 6' } : {}) }, g);
  if (kind !== 'E') T(g, kind === 'D' ? 'П' : 'Ч', { x: s / 2, y: s / 2 + 10, size: 30, fill: COL.chalk, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f (as in ch09, ch14, ch16).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}

/* ---------- Shippa's sheet (page 1) at levels 1 and 2 ---------- */
const SH1 = [['name', 'Шиппа'], ['lvl', '1'], ['anc', 'гоблин'], ['her', 'небьющийся гоблин'], ['bg', 'трактирщик'], ['cls', 'бард'],
  ['a0', '0'], ['a1', '+3'], ['a2', '+2'], ['a3', '0'], ['a4', '0'], ['a5', '+4'], ['hp', '20', '10+8+2'], ['ac', '18', '10+3+3+2'],
  ['per', '+5', 'эксперт'], ['will', '+5', 'эксперт'], ['fort', '+5', 'изучен'], ['ref', '+6', 'изучен'],
  ['sk0', 'Дипломатия', 'изучен · +7'], ['sk1', 'Знание (выпивка)', 'изучен · +3'], ['sk2', 'Оккультизм', 'изучен · +3'], ['sk3', 'Исполнение', 'изучен · +7'],
  ['sk4', 'Обман, Общество, Религия, Скрытность', ''], ['ft_anc', 'Гоблинская песня'], ['ft_skill', 'Неформальное общение'], ['ft_cls', 'Продолжительная композиция'],
  ['size', 'Небольшой'], ['spd', '25 футов'], ['sense', 'ночное зрение'], ['lang', 'всеобщий, гоблинский'], ['prof', 'изучен']];
const SH2 = [['lvl', '2'], ['hp', '30', '20+8+2'], ['ac', '19', '10+3+4+2'], ['per', '+6', 'эксперт'], ['sk0', 'Дипломатия', 'изучен · +8'],
  ['sk1', 'Знание (выпивка)', 'изучен · +4'], ['sk2', 'Оккультизм', 'изучен · +4'], ['sk3', 'Исполнение', 'изучен · +8'],
  ['fort', '+6', 'изучен'], ['ref', '+7', 'изучен'], ['will', '+6', 'эксперт']];
const SH2F = [['ft_cls', 'Посвящение в плуты'], ['ft_skill', 'Обаятельный лжец']];
const SHSK = [['sk0', 'Запугивание', 'изучен · +8'], ['sk1', 'Воровство', 'изучен · +6'], ['sk2', 'Дипломатия', 'изучен · +8'], ['sk3', 'Исполнение', 'изучен · +8'],
  ['sk4', 'Обман, Скрытность, Оккультизм и др.', ''], ['ft_skill', 'Быстрая угроза, Лжец']];
// A sheet beat: the first one of a run builds the sheet on a fresh panel filled with `states`; the next keeps it and replaces the left part.
function shBeat(states) {
  if (S.sh && S.shPanel === S.panel) {
    hide(S.shLeft, .1, .4);
    return [S.sh, (S.shLeft = G(S.panel)), true];
  }
  const p0 = panel(0), sh = S.sh = charSheet(p0, .3);
  S.shPanel = p0;
  states.forEach(l => l.forEach(a => sh.fill(...a)));
  return [sh, (S.shLeft = G(p0)), false];
}
const SHX = 560;   // centre of the picture left of the sheet

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Архетипы', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 8 «Развитие» · Глава 18', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Архетипы', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'чужие приёмы при своём классе', 800, 560, Math.max(m('sub'), 1.2), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['what', 'Что такое архетип', (m) => {
    const p = panel(0);
    title(p, 'Что такое архетип');
    pillsC(p, [['плутовские приёмы', ARC, m('cl', -5.4)], ['медицина', ARC, m('cl', -3.6)], ['тяжёлая броня', ARC, m('cl', -2.2)]], 800, 140, 24);
    say(p, 'набор черт вокруг одной темы', 800, 205, m('cl', -6), { size: 24, fill: COL.dim });
    box(p, 100, 260, 640, 300, HERO, m('cl', -.4));
    say(p, 'Класс: бард', 140, 325, m('cl'), { size: 34, fill: HERO, weight: 700, anchor: 'start' });
    say(p, 'класс один и растёт по своей таблице', 140, 365, m('cl', 1.2), { size: 22, fill: COL.dim, anchor: 'start' });
    ['пункты здоровья', 'бонус умения', 'заклинания', 'классовые особенности'].forEach((s, i) => say(p, s, 140, 420 + i * 36, m('cl', 5 + i * 1), { size: 26, anchor: 'start' }));
    say(p, '+', 800, 430, m('ar'), { size: 80, fill: RULE, weight: 700 });
    box(p, 860, 260, 640, 300, ARC, m('ar', -.2));
    say(p, 'Архетип', 900, 325, m('ar'), { size: 34, fill: ARC, weight: 700, anchor: 'start' });
    say(p, 'не второй класс', 900, 365, m('ar', .6), { size: 22, fill: COL.dim, anchor: 'start' });
    ['отдельные черты', 'пара навыков'].forEach((s, i) => say(p, s, 900, 430 + i * 44, m('ar', .8 + i * .9), { size: 26, anchor: 'start' }));
    box(p, 100, 640, 1400, 150, HERO, m('sh'));
    say(p, 'Шиппа', 140, 700, m('sh'), { size: 32, fill: HERO, weight: 700, anchor: 'start' });
    L(p, [['бард 2-го уровня, ', COL.chalk], ['30 ПЗ', COL.chalk]], 300, 700, m('sh', .3), 30);
    pill(p, '+ Посвящение в плуты', ARC, 1160, 692, m('sh', 5.5), 28);
    say(p, 'хочет красться и колоть в спину', 140, 755, m('sh', 2.5), { size: 24, fill: COL.dim, anchor: 'start' });
  }],
  ['slot', 'Слот классовой черты', (m) => {
    const [sh, p] = shBeat([SH1, SH2]);
    title(p, 'Посвящение занимает слот', .2, SHX);
    say(p, 'слот классовой черты · 2-й уровень барда', 80, 150, .6, { size: 23, fill: COL.dim, anchor: 'start' });
    box(p, 80, 175, 560, 100, RULE, .8, true);
    const tok = G(p, { x: 100, y: 190, o: 0 });
    mk('rect', { width: 520, height: 70, rx: 35, fill: '#22322d', stroke: ARC, 'stroke-width': 2.5 }, tok);
    const tt = T(tok, 'черта посвящения', { x: 260, y: 46, size: 28, fill: ARC, weight: 600, anchor: 'middle' });
    show(tok, m('ded'));
    setText(tt, 'Посвящение в плуты', m('sh'));
    sh.set('ft_cls', 'Посвящение в плуты', m('sh', 1.2));
    pill(p, 'черта барда 2-го уровня', COL.dim, 880, 225, m('sh', 2.2), 22);
    yesNo(p, false, 690, 225, m('sh', 3), .9);
    say(p, 'слот один', 360, 322, m('sh', 3.4), { size: 25, fill: NO, weight: 600 });
    hr(p, 360, m('all', -.3), 80, 1040);
    say(p, 'после посвящения — любая черта архетипа по критериям', 80, 410, m('all'), { size: 25, anchor: 'start' });
    pill(p, 'классовая черта архетипа', ARC, 300, 480, m('all', 4.5), 24);
    say(p, 'занимает слот классовой черты', 560, 488, m('all', 6), { size: 23, fill: COL.dim, anchor: 'start' });
    hr(p, 540, m('lim', -.3), 80, 1040);
    say(p, 'слот с ограничением', 80, 585, m('lim'), { size: 25, anchor: 'start' });
    box(p, 80, 610, 960, 80, RULE, m('lim', 1), true);
    pillsC(p, [['не выше 4-го уровня', RULE, m('lim', 1.6)], ['дескриптор «дварф»', RULE, m('lim', 3)]], 560, 650, 24);
    const t1 = pill(p, 'черта архетипа: 4-й уровень, «дварф»', ARC, 460, 740, m('dw'), 24);
    yesNo(p, true, 800, 740, m('dw', 1), .9);
    pill(p, 'черта архетипа: 6-й уровень', ARC, 400, 810, m('dw', 3), 24);
    yesNo(p, false, 740, 810, m('dw', 4), .9);
  }],
  ['two', 'Посвящение и две другие черты', (m) => {
    const p = panel(0);
    title(p, 'Посвящение и две другие черты');
    say(p, 'новое посвящение — после двух других черт текущего архетипа; само посвящение не считается', 800, 130, m('rule'), { size: 24, fill: COL.dim });
    [['только посвящение', 'D', 'r1', 1, false], ['посвящение и одна другая черта', 'DF', 'r2', 2, false], ['посвящение и две другие черты', 'DFF', 'r3', 3, true]].forEach(([s, kinds, mark, n, good], i) => {
      const y = 190 + i * 95, t0 = m(mark);
      [...kinds].forEach((k, j) => sq(p, 120 + j * 80, y, k, t0 + j * .25));
      say(p, s, 420, y + 44, t0, { size: 27, anchor: 'start' });
      pill(p, good ? 'можно' : 'нельзя', good ? OK : NO, 1280, y + 32, t0 + .6, 26);
    });
    hr(p, 500, m('sh', -.3));
    const X3 = [260, 800, 1340];
    path(p, 'M140 600H1460', { stroke: COL.faint, 'stroke-width': 3 });
    [['2-й уровень', 'D', 'Посвящение', 'другие черты: 0', m('sh', .3)], ['4-й уровень', 'F', 'черта архетипа', 'другие черты: 1', m('sh', 3.5)], ['6-й уровень', 'E', 'вторая другая черта', 'другие черты: 2', m('sh', 9.5)]].forEach(([lv, k, s, c, t0], i) => {
      say(p, lv, X3[i], 545, t0, { size: 26, fill: COL.dim, weight: 600 });
      sq(p, X3[i] - 32, 570, k, t0);
      say(p, s, X3[i], 670, t0 + .3, { size: 25, fill: k === 'E' ? COL.dim : COL.chalk });
      say(p, c, X3[i], 705, t0 + .6, { size: 22, fill: k === 'E' ? OK : COL.dim });
    });
    pill(p, 'теперь можно другой архетип', OK, 1340, 770, m('sh', 13), 22);
    hr(p, 800, m('rt', -.3));
    L(p, [['посвящение нельзя переподготовить (глава 16), пока есть другие черты архетипа', COL.chalk]], 100, 840, m('rt'), 25);
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'a-tf', prompt: ['Верно или неверно?'], build: grid(Q_TF1, TF, { multi: false, text: true }),
  }, {
    id: 'a-num', prompt: ['Посчитайте.'], build: blanks(Q_N1),
  }], done) }],
  ['limits', 'Три ограничения', (m) => {
    const p = panel(0);
    title(p, 'Три ограничения посвящения');
    const col = (i, head, mark, lines) => {
      const x = 100 + i * 490, t0 = m(mark);
      box(p, x, 130, 440, 400, RULE, t0 - .2);
      say(p, head, x + 28, 190, t0, { size: 29, fill: RULE, weight: 700, anchor: 'start' });
      lines.forEach(([s, c, d, size = 24], k) => say(p, s, x + 28, 260 + k * 56, t0 + d, { size, fill: c ?? COL.chalk, anchor: 'start' }));
    };
    col(0, '1. Не раньше 2-го уровня', 'l1', [['у большинства уровень черты 2', COL.chalk, .6], ['бывает 4 или 6', COL.chalk, 3], ['на 1-м уровне посвящений нет', NO, 6, 24]]);
    col(1, '2. Критерии', 'l2', [['плут: Ловкость +2', COL.chalk, .6], ['у Шиппы Ловкость +3', OK, 3.4], ['проверяют по текущим числам,', COL.chalk, 6.6, 23], ['а не по числам при создании', COL.chalk, 6.9, 23]]);
    col(2, '3. «Мультикласс»', 'l3', [['нельзя взять посвящение', COL.chalk, .6], ['класса, в котором вы уже состоите', COL.chalk, .9, 23]]);
    const bx = 100 + 2 * 490 + 28;
    pill(p, 'бард: Посвящение в барды', NO, bx + 190, 410, m('mc'), 22);
    pill(p, 'воин: Посвящение в воины', NO, bx + 190, 480, m('mc', 1.2), 22);
    yesNo(p, false, bx + 395, 410, m('mc', .3), .7); yesNo(p, false, bx + 395, 480, m('mc', 1.5), .7);
    say(p, 'Шиппе открыты посвящения любых классов, кроме барда', 800, 620, m('mc', 3.5), { size: 27 });
    pillsC(p, [['в плуты', OK, m('mc', 6.6)], ['в воины', OK, m('mc', 7.4)], ['в волшебники', OK, m('mc', 8.4)]], 800, 700, 26);
  }],
  ['multi', 'Мультиклассовые архетипы', (m) => {
    const p = panel(0);
    title(p, 'Мультиклассовые архетипы');
    const grp = (cx, head, names, mark) => {
      say(p, head, cx, 130, m(mark), { size: 25, fill: COL.dim, weight: 600 });
      return names.map((s, i) => pill(p, s, ARC, cx + (i % 2 ? 115 : -115), 190 + Math.floor(i / 2) * 58, m(mark, .3 + i * .25), 22));
    };
    const a = grp(430, 'Основные правила · 8 классов', ['бард', 'жрец', 'друид', 'воин', 'следопыт', 'плут', 'ведьма', 'волшебник'], 'pc1');
    const b = grp(1170, 'вторая книга · ещё 8', ['алхимик', 'варвар', 'поборник', 'следователь', 'монах', 'оракул', 'чародей', 'сорвиголова'], 'pc2');
    pulse(a[0], m('bard'), 1.3); pulse(b[3], m('inv'), 1.3);
    const card = (x, mark, head, lines) => {
      box(p, x, 450, 690, 220, RULE, m(mark, -.2));
      say(p, head, x + 28, 500, m(mark), { size: 28, fill: RULE, weight: 700, anchor: 'start' });
      lines.forEach(([s, c = COL.chalk], i) => say(p, s, x + 28, 550 + i * 40, m(mark, .8 + i * 1.8), { size: 24, fill: c, anchor: 'start' }));
    };
    card(100, 'bard', 'Бард · критерий: Харизма +2', [['Харизма — ключевая для заклинаний'], ['два оккультных фокуса'], ['изучены Оккультизм и Исполнение']]);
    card(810, 'inv', 'Следователь · критерий: Интеллект +2', [['занятие «Рассмотрение зацепки»'], ['изучено Общество и ещё один навык'], ['Общество уже есть — другой навык', COL.dim]]);
    const lad = [['посвящение: набор', ARC], ['4-й: простые черты', RULE], ['6-й: продвинутые', RULE], ['выше: мастерские', RULE]];
    lad.forEach(([s, c], i) => {
      const x = 110 + i * 366, t0 = m('step', .2 + i * .9);
      box(p, x, 730, 300, 90, c, t0);
      say(p, s, x + 150, 784, t0, { size: 22, fill: c, weight: 600 });
      if (i) arrowTo(p, x - 62, 775, x - 6, 775, COL.dim, t0);
    });
  }],
  ['others', 'Остальные архетипы', (m) => {
    const p = panel(0);
    title(p, 'Остальные архетипы');
    pill(p, 'больше тридцати без «мультикласс» · у каждого своя тема', ARC, 800, 140, .5, 24);
    box(p, 100, 200, 660, 420, COL.int, m('sen', -.3));
    say(p, 'Страж', 130, 255, m('sen'), { size: 32, fill: COL.int, weight: 700, anchor: 'start' });
    say(p, 'Посвящение в стражи', 300, 255, m('sen'), { size: 22, fill: COL.dim, anchor: 'start' });
    say(p, 'изучены лёгкая и средняя броня', 130, 330, m('sen', 1.2), { size: 26, anchor: 'start' });
    say(p, 'обе уже изучены → изучена тяжёлая', 130, 385, m('sen', 3.8), { size: 26, anchor: 'start' });
    say(p, 'для тех, кто хочет броню тяжелее, чем даёт класс', 130, 450, m('sen', 6.2), { size: 22, fill: COL.dim, anchor: 'start' });
