<script>
'use strict';
const CHAPTER = { number: 3, title: 'Из каких чисел состоит герой', minutes: 11, language: 'ru', next: '../ch04/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Parts of a number on the sheet: attribute modifier, proficiency bonus, armour (item) bonus; HP parts: ancestry, class.
const ATTR = HERO, PROF = RULE, ITEM = COL.real, ANC = COL.dim, CLS = COL.int;
// A number with a caption under it, centred on (x, y).
function addend(p, v, cap, colr, x, y, t0, size = 44) {
  const g = G(p, { x, y, o: 0 });
  T(g, v, { size, fill: colr, weight: 700, anchor: 'middle' });
  if (cap) T(g, cap, { y: 36, size: 22, fill: colr, anchor: 'middle' });
  if (t0 != null) show(g, t0);
  return g;
}
// A sum centred on cx: terms [value, caption, colour, t0] joined by '+', then '=' and the total; each '+' comes with its term.
function sumRow(p, cx, y, terms, total, size = 44) {
  const all = [...terms, total], ws = all.map(([v, cap]) => Math.max(uiW(v, size), cap ? uiW(cap, 22) : 0));
  const op = 64, W = ws.reduce((a, b) => a + b, 0) + op * (all.length - 1);
  let x = cx - W / 2;
  return all.map(([v, cap, colr, t0], i) => {
    if (i) { say(p, i === all.length - 1 ? '=' : '+', x + op / 2, y, t0, { size, fill: COL.dim, weight: 700 }); x += op; }
    const g = addend(p, v, cap, colr, x + ws[i] / 2, y, t0, size);
    x += ws[i];
    return g;
  });
}
const hr = (p, y, t0, x1 = 120, x2 = 1480) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const strike = (p, x1, y1, x2, y2, t0) => draw(path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: NO, 'stroke-width': 5, 'stroke-linecap': 'round' }, { d: 0 }), t0, .4);

// The dwarf fighter of the chapter, 1st level.
const DW_ATTRS = [['Сила', '+4'], ['Ловкость', '+1'], ['Выносливость', '+2'], ['Интеллект', '0'], ['Мудрость', '+1'], ['Харизма', '−1']];
// Sheet rows: label, sum at level 1, total, sum at level 2, total.
const DW_ROWS = [
  ['Внимание (эксперт)', [['1', ATTR], [' + ', COL.dim], ['5', PROF]], '+6', [['1', ATTR], [' + ', COL.dim], ['6', PROF]], '+7'],
  ['Стойкость (эксперт)', [['2', ATTR], [' + ', COL.dim], ['5', PROF]], '+7', [['2', ATTR], [' + ', COL.dim], ['6', PROF]], '+8'],
  ['Реакция (эксперт)', [['1', ATTR], [' + ', COL.dim], ['5', PROF]], '+6', [['1', ATTR], [' + ', COL.dim], ['6', PROF]], '+7'],
  ['Воля (изучен)', [['1', ATTR], [' + ', COL.dim], ['3', PROF]], '+4', [['1', ATTR], [' + ', COL.dim], ['4', PROF]], '+5'],
  ['Атлетика (изучен)', [['4', ATTR], [' + ', COL.dim], ['3', PROF]], '+7', [['4', ATTR], [' + ', COL.dim], ['4', PROF]], '+8'],
  ['Дипломатия (неизучен)', [['−1', ATTR], [' + ', COL.dim], ['0', PROF]], '−1', null, null],
  ['Длинный меч (эксперт)', [['4', ATTR], [' + ', COL.dim], ['5', PROF]], '+9', [['4', ATTR], [' + ', COL.dim], ['6', PROF]], '+10'],
  ['КБ, кольчуга (изучен)', [['10'], [' + ', COL.dim], ['1', ATTR], [' + ', COL.dim], ['3', PROF], [' + ', COL.dim], ['4', ITEM]], '18',
    [['10'], [' + ', COL.dim], ['1', ATTR], [' + ', COL.dim], ['4', PROF], [' + ', COL.dim], ['4', ITEM]], '19'],
  ['ПЗ', [['10', ANC], [' + ', COL.dim], ['10', CLS], [' + ', COL.dim], ['2', ATTR]], '22', [['22'], [' + ', COL.dim], ['10', CLS], [' + ', COL.dim], ['2', ATTR]], '34'],
  ['Скорость', [['дварф', COL.dim]], '20 футов', null, null],
];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Из каких чисел состоит герой', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 1 «Основы» · Глава 3', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Из каких чисел состоит герой', { x: 800, y: 440, size: 76, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'характеристики, умение, испытания, навыки, КБ, ПЗ', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['attrs', 'Шесть характеристик', (m) => {
    const p = panel(0);
    say(p, 'Шесть характеристик', 800, 80, .2, { size: 36, weight: 600 });
    // modifier scale −1 … +4
    const sx = v => 660 + v * 130, sy = 200;
    say(p, 'модификатор на 1-м уровне', 490, sy + 8, m('mod'), { size: 24, fill: COL.dim, anchor: 'end' });
    draw(path(p, `M${sx(-1)} ${sy}H${sx(4)}`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('mod', .2), .6);
    for (let v = -1; v <= 4; v++) {
      draw(path(p, `M${sx(v)} ${sy - 10}V${sy + 10}`, { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), m('mod', .3), .3);
      say(p, v > 0 ? '+' + v : v < 0 ? '−1' : '0', sx(v), sy - 24, m('mod', .4 + (v + 1) * .1), { size: 26, fill: ATTR, weight: 700 });
    }
    const dot = G(p, { x: sx(0), y: sy, o: 0 });
    mk('circle', { r: 12, fill: ATTR, stroke: COL.board, 'stroke-width': 3 }, dot);
    show(dot, m('zero'), .3);
    const c0 = say(p, 'средний человек', sx(0), sy + 46, m('zero'), { size: 24, fill: COL.chalk });
    hide(c0, m('four', -.1), .3);
    tw(dot, { x: sx(4) }, m('four'), .9);
    say(p, 'лучшее в начале пути', sx(4), sy + 46, m('four', .6), { size: 24, fill: COL.chalk });
    arrowTo(p, sx(4) + 24, sy, sx(4) + 140, sy, ATTR, m('grow'), true);
    say(p, 'с уровнями — выше', sx(4) + 156, sy + 8, m('grow', .3), { size: 24, fill: COL.dim, anchor: 'start' });
    // six cards: names at once, uses on the word
    const cards = [
      ['Сила', ['атаки в ближнем бою', 'Атлетика'], 'str'], ['Ловкость', ['стрельба и метание', 'КБ, Реакция'], 'dex'],
      ['Выносливость', ['пункты здоровья', 'Стойкость'], 'con'], ['Интеллект', ['знания, Ремесло', '+1 = ещё один навык'], 'int'],
      ['Мудрость', ['Внимание', 'Воля'], 'wis'], ['Харизма', ['Дипломатия, Обман', 'Запугивание'], 'cha'],
    ];
    cards.forEach(([name, lines, mark], i) => {
      const x = 130 + (i % 3) * 460, y = i < 3 ? 350 : 620;
      const b = mk('rect', { x, y, width: 420, height: 176, rx: 18, fill: '#22322d', stroke: ATTR, 'stroke-width': 2.5 }, p);
      put(b, { o: 0 }); show(b, .4 + i * .08);
      say(p, name, x + 28, y + 48, .5 + i * .08, { size: 32, fill: ATTR, weight: 700, anchor: 'start' });
      lines.forEach((ln, j) => say(p, ln, x + 28, y + 100 + j * 44, m(mark, .3 + j * .4), { size: 25, anchor: 'start' }));
    });
    say(p, 'физические', 130, 330, m('phys'), { size: 24, fill: COL.dim, weight: 600, anchor: 'start' });
    say(p, 'ментальные', 130, 600, m('ment'), { size: 24, fill: COL.dim, weight: 600, anchor: 'start' });
    say(p, 'как распределить модификаторы — главы 4–6', 800, 860, m('later'), { size: 26, fill: COL.dim });
  }],
  ['ranks', 'Умение: пять рангов', (m) => {
    const p = panel(0), x0 = 640, u = 50, ys = [240, 330, 420, 510, 600], add = [0, 2, 4, 6, 8];
    say(p, 'Умение: пять рангов', 800, 80, .2, { size: 36, weight: 600 });
    const names = ['неизучен', 'изучен', 'эксперт', 'мастер', 'легенда'], forms = ['0', 'уровень + 2', 'уровень + 4', 'уровень + 6', 'уровень + 8'];
    const marks = ['untr', 'tr', 'ex', 'ms', 'lg'];
    // legend
    const lg = G(p, { x: 640, y: 160, o: 0 });
    mk('rect', { x: 0, y: -20, width: 28, height: 28, rx: 5, fill: COL.dim, 'fill-opacity': .35, stroke: COL.dim, 'stroke-width': 2 }, lg);
    T(lg, 'уровень героя', { x: 40, y: 2, size: 24, fill: COL.dim });
    mk('rect', { x: 230, y: -20, width: 28, height: 28, rx: 5, fill: PROF, 'fill-opacity': .6, stroke: PROF, 'stroke-width': 2 }, lg);
    T(lg, 'надбавка ранга', { x: 270, y: 2, size: 24, fill: PROF });
    show(lg, m('tr', .6));
    const lvT = say(p, 'уровень героя: 1', 1340, 160, m('lvl1'), { size: 30, weight: 700 });
    const rows = names.map((nm, i) => {
      const y = ys[i], t0 = m(marks[i]);
      say(p, nm, 300, y + 10, .4 + i * .1, { size: 30, weight: 600, anchor: 'end' });
      say(p, forms[i], 330, y + 9, t0, { size: 26, fill: PROF, anchor: 'start' });
      if (!i) {
        const d = G(p, { x: x0, y, o: 0 });
        mk('circle', { r: 10, fill: PROF }, d);
        show(d, t0 + .3);
        return null;
      }
      const lv = mk('rect', { x: x0, y: y - 22, width: 0, height: 44, rx: 6, fill: COL.dim, 'fill-opacity': .35, stroke: COL.dim, 'stroke-width': 2 }, p);
      const rk = mk('rect', { x: x0, y: y - 22, width: 0, height: 44, rx: 6, fill: PROF, 'fill-opacity': .6, stroke: PROF, 'stroke-width': 2 }, p);
      const val = say(p, '+' + (1 + add[i]), x0, y + 11, m('lvl1', .4 + (i - 1) * .55), { size: 32, fill: PROF, weight: 700, anchor: 'start' });
      return { lv, rk, val, a: add[i] };
    });
    // a row's bar for level L, grown to fraction q
    const setRow = (r, L, q = 1) => {
      r.lv.setAttribute('width', L * u * q);
      r.rk.setAttribute('x', x0 + L * u * q);
      r.rk.setAttribute('width', r.a * u * q);
      put(r.val, { x: x0 + (L + r.a) * u * q + 16 });
      r.val.textContent = '+' + (Math.round(L) + r.a);
    };
    rows.forEach((r, i) => { if (r) prog(q => setRow(r, 1, q), m(marks[i], .2), .7); });
    // gap between untrained and trained, drawn on the untrained row
    const gy = ys[0], gap = path(p, '', { stroke: NO, 'stroke-width': 4, 'stroke-dasharray': '10 8' });
    const head = G(p, { o: 0 });
    mk('path', { d: 'M0 0L-18 -10L-18 10Z', fill: NO }, head);
    put(gap, { o: 0 });
    const gT = say(p, '', x0 + 75, gy - 30, m('key', 1.4), { size: 26, fill: NO, weight: 700 });
    const setGap = L => {
      const xe = x0 + (L + 2) * u;
      gap.setAttribute('d', `M${x0 + 16} ${gy}H${xe - 14}`);
      put(head, { x: xe, y: gy });
      put(gT, { x: (x0 + xe) / 2 });
      gT.textContent = 'разрыв ' + (Math.round(L) + 2);
    };
    prog(() => setGap(1), m('key', 1.2), .01);
    show(gap, m('key', 1.2)); show(head, m('key', 1.2));
    rows.forEach(r => { if (r) pulse(r.lv, m('key', .3), 1.04); });
    // level 1 → 5: every bar except untrained grows by 4
    prog(q => {
      const L = 1 + 4 * q;
      rows.forEach(r => r && setRow(r, L));
      setGap(L);
      lvT.textContent = 'уровень героя: ' + Math.round(L);
    }, m('up', .3), 2.6);
    pulse(rows[1].val, m('lvl5'), 1.3);
    pulse(gT, m('gap', .2), 1.3);
    say(p, 'волшебник 5-го уровня: Мистицизм изучен → +7 · воин не изучал → 0', 800, 720, m('ex5'), { size: 26 });
    say(p, 'ранги дают: класс, происхождение, Интеллект', 800, 800, m('src'), { size: 26, fill: COL.dim });
  }],
  ['formula', 'Одна формула', (m) => {
    const p = panel(0);
    say(p, 'Почти любое число на листе', 800, 80, .2, { size: 34, weight: 600 });
    const parts = [['модификатор характеристики', ATTR], ['бонус умения', PROF], ['постоянные бонусы', ITEM]];
    const ws = parts.map(([s]) => s.length * 28 * .56 + 44), W = ws.reduce((a, b) => a + b, 0) + 2 * 64;
    let x = 800 - W / 2;
    parts.forEach(([s, c], i) => {
      if (i) { say(p, '+', x + 32, 202, m('f', i * .9), { size: 40, fill: COL.dim, weight: 700 }); x += 64; }
      pill(p, s, c, x + ws[i] / 2, 190, m('f', i * .9), 28);
      if (i === 2) S.permX = x + ws[i] / 2;
      x += ws[i];
    });
    say(p, 'например, бонус предмета от волшебного меча', S.permX - 60, 262, m('perm'), { size: 24, fill: ITEM });
    colorLine(p, [['ситуативные бонусы — ', COL.dim], ['не на лист', NO], [', а при броске', COL.dim]], 800, 322, m('sit'), { size: 26 });
    hr(p, 380, m('perc', -.4));
    colorLine(p, [['Внимание', COL.chalk], [' = ', COL.dim], ['Мудрость', ATTR], [' + ', COL.dim], ['бонус умения', PROF]], 800, 450, m('perc'), { size: 38 });
    say(p, 'шорох за дверью, ложь в голосе, засада в кустах', 800, 500, m('perc', 1.6), { size: 24, fill: COL.dim });
    who(p, 'Дварф-воин', HERO, 260, 640, m('dw'));
    const [, , tot] = sumRow(p, 800, 650, [['1', 'Мудрость', ATTR, m('wis', .4)], ['5', 'эксперт: 1 + 4', PROF, m('rank', .6)]], ['+6', 'Внимание', COL.chalk, m('sum')]);
    pulse(tot, m('sum', .4), 1.2);
    colorLine(p, [['в начале боя: бросок Внимания = ', COL.dim], ['инициатива', COL.chalk]], 800, 820, m('init'), { size: 28 });
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-prof', prompt: ['Посчитайте.'], build: blanks(Q_PROF),
  }], done) }],
  ['saves', 'Испытания', (m) => {
    const p = panel(0), ys = [300, 420, 540];
    say(p, 'Испытания', 800, 80, .2, { size: 36, weight: 600 });
    const saves = [['Стойкость', 'Выносливость', 'fort'], ['Реакция', 'Ловкость', 'ref'], ['Воля', 'Мудрость', 'will']];
    saves.forEach(([sv, at, mark], i) => {
      say(p, sv, 120, ys[i] + 12, .3 + i * .12, { size: 36, weight: 600, anchor: 'start' });
      say(p, '←', 370, ys[i] + 10, m(mark), { size: 34, fill: COL.dim, weight: 700 });
      pill(p, at, ATTR, 530, ys[i], m(mark), 26);
    });
    say(p, 'любой герой — как минимум «изучен»; где эксперт — решает класс', 800, 650, m('min'), { size: 26, fill: COL.dim });
    const col = (title, x, ranks, t0, step) => {
      say(p, title, x, 200, t0, { size: 28, fill: COL.dim, weight: 600 });
      ranks.forEach((r, i) => pill(p, r, PROF, x, ys[i], t0 + .3 + i * step, 24));
    };
    col('воин', 800, ['эксперт', 'эксперт', 'изучен'], m('ftr'), .6);
    col('волшебник', 1040, ['изучен', 'изучен', 'эксперт'], m('wiz'), .3);
    say(p, 'дварф-воин', 1360, 200, m('calc'), { size: 28, fill: HERO, weight: 600 });
    [[['2', ATTR], [' + ', COL.dim], ['5', PROF], [' = ', COL.dim], ['+7']], [['1', ATTR], [' + ', COL.dim], ['5', PROF], [' = ', COL.dim], ['+6']],
      [['1', ATTR], [' + ', COL.dim], ['3', PROF], [' = ', COL.dim], ['+4']]]
      .forEach((sg, i) => {
        const t0 = m(['calc', 'calc2', 'calc3'][i], i ? .2 : 1.4);
        colorLine(p, sg, 1360, ys[i] + 13, t0, { size: 38, weight: 700 });
        say(p, ['Выносливость + эксперт', 'Ловкость + эксперт', 'Мудрость + изучен'][i], 1360, ys[i] + 50, t0 + .3, { size: 20, fill: COL.dim });
      });
  }],
  ['skills', '17 навыков', (m) => {
    const p = panel(0);
    say(p, '17 навыков по характеристикам', 800, 70, .2, { size: 34, weight: 600 });
    const cols = [
      ['Сила', ['Атлетика'], 'str'], ['Ловкость', ['Акробатика', 'Воровство', 'Скрытность'], 'dex'], ['Выносливость', [], 'con'],
      ['Интеллект', ['Знание', 'Мистицизм', 'Общество', 'Оккультизм', 'Ремесло'], 'int'], ['Мудрость', ['Медицина', 'Природа', 'Выживание', 'Религия'], 'wis'],
      ['Харизма', ['Дипломатия', 'Обман', 'Запугивание', 'Исполнение'], 'cha'],
    ];
    const el = {};
    cols.forEach(([at, sk, mark], i) => {
      const x = 160 + i * 256;
      say(p, at, x, 140, .4 + i * .08, { size: 28, fill: ATTR, weight: 700 });
      if (!sk.length) say(p, 'нет навыков', x, 190, m(mark), { size: 24, fill: COL.dim });
      sk.forEach((s, j) => { el[s] = say(p, s, x, 190 + j * 42, m(mark, .2 + j * .25), { size: 25 }); });
    });
    hr(p, 440, m('ath', -.4));
    say(p, 'Атлетика (изучен)', 120, 540, m('ath'), { size: 30, weight: 600, anchor: 'start' });
    pulse(el['Атлетика'], m('ath'), 1.3);
    sumRow(p, 940, 540, [['4', 'Сила', ATTR, m('s4')], ['3', 'изучен', PROF, m('a3')]], ['+7', 'Атлетика', COL.chalk, m('a7')]);
    say(p, 'Дипломатия (неизучен)', 120, 660, m('dip'), { size: 30, weight: 600, anchor: 'start' });
    pulse(el['Дипломатия'], m('dip'), 1.3);
    sumRow(p, 940, 660, [['−1', 'Харизма', ATTR, m('c1')], ['0', 'неизучен', PROF, m('z0')]], ['−1', 'Дипломатия', COL.chalk, m('d1')]);
    say(p, 'неизученный навык пробовать можно: бонус умения 0', 800, 780, m('try'), { size: 28, fill: OK, weight: 600 });
    pulse(el['Воровство'], m('lock'), 1.3);
    colorLine(p, [['но часть действий — только обученным: ', COL.chalk], ['вскрыть замок без изученного Воровства нельзя', NO]], 800, 840, m('lock', .3), { size: 26 });
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-attr', prompt: ['От какой характеристики считают?'],
    build: grid(Q_ATTR, ATTR_COLS, { multi: false, text: true }),
  }], done) }],
  ['ac', 'Класс брони', (m) => {
    const p = panel(0), base = 590, bh = 40, step = 46, cxs = [420, 1180];
    say(p, 'Класс брони (КБ) — сложность для атак по герою', 800, 70, .2, { size: 32, weight: 600 });
    colorLine(p, [['КБ', COL.chalk], [' = ', COL.dim], ['10', COL.chalk], [' + ', COL.dim], ['Ловкость', ATTR], [' + ', COL.dim], ['умение в броне', PROF], [' + ', COL.dim], ['бонус брони', ITEM]], 800, 145, m('f', -2.4), { size: 34 });
    colorLine(p, [['Ловкость', ATTR], [' — не больше предела брони', ITEM]], 800, 195, m('cap'), { size: 26 });
    const armour = [['Кожаный доспех', '+1 к КБ · предел Ловкости +4', 4, 'lea'], ['Кольчуга', '+4 к КБ · предел Ловкости +1', 1, 'ch']];
    armour.forEach(([name, spec, cap, mark], a) => {
      const cx = cxs[a], t0 = m(mark);
      say(p, name, cx, 270, t0, { size: 30, weight: 700 });
      say(p, spec, cx, 310, t0 + .4, { size: 24, fill: ITEM });
      for (let k = 1; k <= 4; k++) {
        const r = mk('rect', { x: cx - 40, y: base - k * step, width: 80, height: bh, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, p);
