<script>
'use strict';
const CHAPTER = { number: 6, title: 'Собираем героя', minutes: 12, language: 'ru', next: '../ch07/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Attribute modifier, proficiency rank, armour/item bonus; HP parts: ancestry, class (as in ch03, ch05).
const ATTR = HERO, PROF = RULE, ITEM = COL.real, ANC = COL.dim, CLS = COL.int;
const GOLD = '#f0c55a', SILV = '#cfd8dc', COPR = '#d38a5a';
const hr = (p, y, t0, x1 = 60, x2 = 1060) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const pw = (s, size) => s.length * size * .56 + 44;   // width of a pill()
const title = (p, s, t0 = .2) => say(p, s, 560, 62, t0, { size: 36, weight: 600 });
function hpSeg(p, x, y, n, u, colr, t0, h = 56) {
  const r = mk('rect', { x, y, width: 0, height: h, rx: 6, fill: colr, 'fill-opacity': .55, stroke: colr, 'stroke-width': 2 }, p);
  tw(r, { a_width: n * u - 2 }, t0, .6);
  return r;
}
function mint(p, x, y, r, colr, label, t0) {
  const g = G(p, { x, y, o: 0, s: .6 });
  mk('circle', { r, fill: colr, 'fill-opacity': .85, stroke: colr, 'stroke-width': 2 }, g);
  if (label) T(g, label, { y: r * .36, size: r * .9, fill: COL.board, weight: 700, anchor: 'middle' });
  pop(g, t0);
  return g;
}
// A boost on a flawed column cancels the flaw (pf.js bump stacks it above zero, which ch05 relies on).
function lift(b, tk, i, t0) {
  const c = b.cols[i];
  tw(tk, { x: c.x, y: b.y0 + CH / 2, s: .7 }, t0, .7); hide(tk, t0 + .6, .25);
  hide(c.dn, t0 + .65, .3); c.dn = null;
  const v = ++c.v;
  prog(() => { c.val.textContent = sgn(v); }, t0 + .65, 0);
  b.sheet?.set('a' + i, sgn(v), t0 + .65);
  pulse(c.val, t0 + .65, 1.35);
}

/* ---------- Shippa's sheet: what each step adds (fills are the state before the step) ---------- */
const SH_STEPS = [
  /* 0 */ [['name', 'Шиппа'], ['lvl', '1'], ['anc', 'гоблин'], ['her', 'небьющийся гоблин'], ['bg', 'трактирщик'], ['cls', 'бард'],
    ['a0', '0'], ['a1', '+2'], ['a2', '+1'], ['a3', '0'], ['a4', '−1'], ['a5', '+3'], ['hp', '19', '10+8+1'],
    ['per', '+4', 'эксперт'], ['will', '+4', 'эксперт'], ['fort', '+4', 'изучен'], ['ref', '+5', 'изучен'],
    ['sk0', 'Дипломатия', 'изучен'], ['sk1', 'Знание (выпивка)', 'изучен'], ['sk2', 'Оккультизм', 'изучен'], ['sk3', 'Исполнение', 'изучен'], ['sk4', 'ещё четыре на выбор'],
    ['ft_anc', 'Гоблинская песня'], ['ft_skill', 'Неформальное общение'], ['size', 'Небольшой'], ['spd', '25 футов'],
    ['sense', 'ночное зрение'], ['lang', 'всеобщий, гоблинский'], ['prof', 'изучен']],
  /* 1 boosts */ [['a1', '+3'], ['a2', '+2'], ['a4', '0'], ['a5', '+4']],
  /* 2 hit points */ [['hp', '20', '10+8+2']],
  /* 3 skills, feat */ [['sk4', 'Обман, Общество, Религия, Скрытность', ''], ['ft_cls', 'Продолжительная композиция']],
  /* 4 purse */ [['gold', '15 зм']],
  /* 5 weapons */ [['st0', 'Кинжал', '1d4 колющий'], ['st1', 'Рапира', '1d6 колющий'], ['st2', 'Праща', '1d6 дробящий']],
  /* 6 armour class */ [['ac', '18', '10+3+3+2']],
  /* 7 kit */ [['it0', 'Клёпаный кожаный доспех', '3 зм'], ['it1', 'Кинжал', '2 см'], ['it2', 'Рапира', '2 зм'], ['it3', 'Праща', '0'],
    ['it4', 'Пращные ядра ×20', '2 мм'], ['it5', 'Комплект искателя приключений', '15 см'], ['it6', 'Музыкальный инструмент (ручной)', '8 см'],
    ['gold', '7 зм 4 см 8 мм']],
  /* 8 perception, saves */ [['per', '+5', 'эксперт'], ['will', '+5', 'эксперт'], ['fort', '+5', 'изучен'], ['ref', '+6', 'изучен']],
  /* 9 strikes, skills */ [['st0', 'Кинжал', '+6 · 1d4 колющий'], ['st1', 'Рапира', '+6 · 1d6 колющий'], ['st2', 'Праща', '+6 · 1d6 дробящий'],
    ['sk0', 'Дипломатия', 'изучен · +7'], ['sk1', 'Знание (выпивка)', 'изучен · +3'], ['sk2', 'Оккультизм', 'изучен · +3'], ['sk3', 'Исполнение', 'изучен · +7']],
  /* 10 bulk */ [['bulk', '4', 'из 5']],
  /* 11 class DC, hero points */ [['cdc', '17', '10+3+4'], ['hero', '1']],
];
// Open a sheet beat on page `page` with the sheet as it is before step `step`. The first beat of a run builds the sheet on a fresh
// panel; the next ones keep it, hide the previous left part and flip the page if needed.
function flip(sh, n, t0) { sh.page(n, t0); S.shPage = n; }
function shBeat(step, page) {
  let sh = S.shSheet, p0;
  if (sh && S.shPanel === S.panel) { p0 = S.panel; hide(S.shLeft, .1, .4); }
  else {
    p0 = panel(0); sh = S.shSheet = charSheet(p0, .3); S.shPanel = p0; S.shPage = 1;
    SH_STEPS.slice(0, step).forEach(l => l.forEach(a => sh.fill(...a)));
    flip(sh, page);
  }
  S.shLeft = G(p0);
  if (S.shPage !== page) flip(sh, page, .3);
  return [sh, S.shLeft];
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Собираем героя', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 2 «Создание героя» · Глава 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Собираем героя', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'последние шаги листа', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['steps', 'Десять шагов', (m) => {
    const [sh, p] = shBeat(1, 1);
    title(p, 'Создание героя: десять шагов');
    const done = ['1–2 замысел', '3 народ', '4 происхождение', '5 класс'];
    const w = done.map(s => pw('✓ ' + s, 24)), total = w.reduce((a, b) => a + b + 20, -20);
    let x = 560 - total / 2;
    done.forEach((s, i) => {
      pill(p, '✓ ' + s, OK, x + w[i] / 2, 150, .5 + i * .3, 24);
      x += w[i] + 20;
    });
    say(p, 'уже на листе: главы 4 и 5', 560, 214, 1.8, { size: 22, fill: COL.dim });
    const rows = [['6', 'Четыре универсальных повышения', '+1 в четыре разные характеристики', 's6'], ['7', 'Детали класса', 'ПЗ, навыки, особенности 1-го уровня', 's7'],
      ['8', 'Снаряжение', '15 зм: оружие, броня, вещи', 's8'], ['9', 'Расчёт чисел', 'Внимание, испытания, удары, навыки', 's9'],
      ['10', 'Последние штрихи', 'вес, классовая СЛ, пункты героизма, имя', 's10']];
    rows.forEach(([n, t, sub, mark], i) => {
      const y = 330 + i * 100, g = G(p, { x: -40, y, o: 0 });
      mk('circle', { cx: 100, cy: -8, r: 32, fill: mix(COL.board, RULE, .3), stroke: RULE, 'stroke-width': 3 }, g);
      T(g, n, { x: 100, y: 4, size: 32, fill: RULE, weight: 700, anchor: 'middle' });
      T(g, t, { x: 170, size: 34, weight: 600 });
      T(g, sub, { x: 170, y: 36, size: 23, fill: COL.dim });
      tw(g, { o: 1, x: 0 }, m(mark), .6, out);
    });
    say(p, 'лист справа — после главы 5', 560, 868, m('sheet'), { size: 24, fill: COL.dim });
    ['cls', 'hp', 'per'].forEach((k, i) => sh.flash(k, m('sheet', .3 + i * .3)));
  }],
  ['boosts', 'Шаг 6: четыре повышения', (m) => {
    const [sh, p] = shBeat(1, 1);
    title(p, 'Шаг 6 · четыре универсальных повышения');
    colorLine(p, [['каждое ', COL.chalk], ['+1', RULE], [' — в ', COL.chalk], ['другую', ATTR], [' характеристику', COL.chalk]], 560, 126, m('rules'), { size: 28 });
    yesNo(p, false, 200, 172, m('diff'), .7);
    say(p, 'два повышения в одну — нельзя', 250, 180, m('diff'), { size: 26, fill: NO, weight: 600, anchor: 'start' });
    colorLine(p, [['на 1-м уровне: ', COL.chalk], ['от −1 до +4', RULE]], 560, 238, m('cap'), { size: 28 });
    const b = S.sh = attrBoard(p, 600, 470, .3, { dx: 150, cw: 84, nameSize: 20 });
    [[1, 1], [1, 1], [2, 1], [4, -1], [5, 1], [5, 1], [5, 1]].forEach(([i, d]) => bump(b, i, d, .4));
    b.sheet = sh;
    tw(b.cap, { c_stroke: RULE, 'a_stroke-width': 5 }, m('cap'), .4); tw(b.cap, { c_stroke: COL.faint, 'a_stroke-width': 2 }, m('board'), .6);
    say(p, '+4', b.xR - 4, b.capY - 12, m('cap'), { size: 22, fill: RULE, weight: 700, anchor: 'end' });
    b.cols.forEach((c, i) => { pulse(c.val, m('board', .2 + i * .45), 1.3); sh.flash('a' + i, m('board', .2 + i * .45)); });
    const tok = (str, mark, mark2, i) => {
      const tk = boostToken(p, str, 'free', b.cols[i].x, 300, m(mark));
      return tk;
    };
    const t1 = tok('+1', 'cha', 'cha2', 5); give(b, t1, 5, 1, m('cha2', -.7));
    const t2 = tok('+1', 'dex', 'dex2', 1); give(b, t2, 1, 1, m('dex2', -.7));
    const t3 = tok('+1', 'con', 'con2', 2); give(b, t3, 2, 1, m('con2', -.7));
    const t4 = tok('+1', 'wis', 'wis2', 4); lift(b, t4, 4, m('wis2', -.7));
    [['Харизма +4', ' — ключевая, потолок', 'cha2'], ['Ловкость +3', ' — КБ и Реакция', 'dex2'], ['Выносливость +2', ' — ПЗ и Стойкость', 'con2'], ['Мудрость 0', ' — Внимание и Воля', 'wis2']]
      .forEach(([a, c, mark], i) => colorLine(p, [[a, ATTR], [c, COL.dim]], 120, 676 + i * 46, m(mark), { size: 28, anchor: 'start' }));
    say(p, 'Сила и Интеллект — по нулям', 120, 868, m('res'), { size: 26, anchor: 'start' });
    b.cols.forEach((c, i) => sh.flash('a' + i, m('res', .5 + i * .2)));
  }],
  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-boost', prompt: ['Верно или неверно?'], build: grid(Q_BOOST, TF, { multi: false, text: true }),
  }], done) }],
  ['hp', 'Шаг 7: ПЗ', (m) => {
    const [sh, p] = shBeat(2, 1);
    title(p, 'Шаг 7 · детали класса: ПЗ');
    colorLine(p, [['ПЗ = ', COL.chalk], ['народ', ANC], [' + ', COL.dim], ['класс', CLS], [' + ', COL.dim], ['Выносливость', ATTR]], 560, 150, m('hp'), { size: 32 });
    const x0 = 80, u = 36, y = 300;
    say(p, 'в главе 5', x0, y - 24, m('old'), { size: 22, fill: COL.dim, anchor: 'start' });
    hpSeg(p, x0, y, 10, u, ANC, m('o1'));
    say(p, 'небьющийся гоблин 10', x0 + 5 * u, y + 92, m('o1', .3), { size: 22, fill: ANC, weight: 600 });
    hpSeg(p, x0 + 10 * u, y, 8, u, CLS, m('o2'));
    say(p, 'бард 8', x0 + 14 * u, y + 92, m('o2', .3), { size: 22, fill: CLS, weight: 600 });
    const con = hpSeg(p, x0 + 18 * u, y, 1, u, ATTR, m('o3'));
    say(p, 'Выносливость', x0 + 18 * u + u / 2, y + 128, m('o3', .3), { size: 22, fill: ATTR, weight: 600 });
    const tot = say(p, '19', x0 + 19 * u + 28, y + 40, m('o3', .8), { size: 44, weight: 700, anchor: 'start' });
    colorLine(p, [['Выносливость ', COL.chalk], ['+1', ATTR], [' → ', COL.dim], ['+2', ATTR]], 560, 520, m('new'), { size: 34 });
    tw(con, { a_width: 2 * u - 2 }, m('add'), .6);
    tw(tot, { x: x0 + 20 * u + 28 }, m('add'), .6);
    prog(q => { tot.textContent = q > .5 ? '20' : '19'; }, m('add'), .6, lin);
    draw(path(p, `M${x0 + 19 * u - 1} ${y - 14}V${y + 70}`, { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, { d: 0 }), m('add'), .4);
    say(p, 'было 19', x0 + 19 * u - 6, y - 24, m('add', .3), { size: 22, fill: COL.dim, anchor: 'end' });
    colorLine(p, [['10 + 8 + 2 = ', COL.chalk], ['20', COL.chalk]], 560, 620, m('tot'), { size: 40 });
    sh.set('hp', '20', m('tot'), '10+8+2');
    sh.flash('a2', m('new'));
    colorLine(p, [['обещание из главы 5 выполнено ', OK], ['✓', OK]], 560, 740, m('promise'), { size: 30 });
  }],
  ['cls1', 'Шаг 7: навыки и особенности', (m) => {
    const [sh, p] = shBeat(3, 1);
    title(p, 'Шаг 7 · навыки и особенности 1-го уровня');
    say(p, 'Навыки: обязательные + несколько на выбор', 560, 130, m('sk'), { size: 28, weight: 600 });
    colorLine(p, [['4 + ', COL.chalk], ['Интеллект 0', ATTR], [' = 4 на выбор', COL.chalk]], 560, 186, m('int'), { size: 30 });
    say(p, 'Дипломатия — уже от происхождения, её не берём', 560, 234, m('dip'), { size: 22, fill: COL.dim });
    const sk = ['Обман', 'Общество', 'Религия', 'Скрытность'], w = sk.map(s => pw(s, 26)), tot = w.reduce((a, b) => a + b + 20, -20);
    let x = 560 - tot / 2;
    sk.forEach((s, i) => { pill(p, s, HERO, x + w[i] / 2, 296, m('pick', .2 + i * .5), 26); x += w[i] + 20; });
    sh.set('sk4', 'Обман, Общество, Религия, Скрытность', m('pick', 2.2), '');
    box(p, 60, 370, 1000, 500, COL.faint, m('tab', -.2));
    say(p, 'Таблица развития барда · 1-й уровень', 560, 420, m('tab'), { size: 28, weight: 700 });
    [['заклинания', 'f1', 230], ['композиции', 'f2', 560], ['муза', 'f3', 890]].forEach(([s, mark, cx]) => pill(p, s, PROF, cx, 500, m(mark), 28));
    pill(p, 'муза-маэстро', HERO, 300, 620, m('muse'), 28);
    arrowTo(p, 430, 620, 540, 620, COL.dim, m('feat', -.6));
    say(p, 'черта 1-го уровня', 485, 590, m('feat', -.4), { size: 19, fill: COL.dim });
    pill(p, 'Продолжительная композиция', HERO, 780, 620, m('feat'), 26);
    say(p, 'композиции действуют дольше', 780, 700, m('feat', 1.4), { size: 24, fill: COL.dim });
    sh.set('ft_cls', 'Продолжительная композиция', m('feat', 1.2));
  }],
  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(WIDE, [{
    id: 'c-hp', prompt: ['Посчитайте ПЗ на 1-м уровне.'], build: blanks(Q_HP),
  }, {
    id: 'c-skills', prompt: ['Бард выбирает навыки: 4 плюс Интеллект.'], build: blanks(Q_SKILLS),
  }], done) }],
  ['money', 'Шаг 8: деньги', (m) => {
    const [sh, p] = shBeat(4, 2);
    title(p, 'Шаг 8 · снаряжение: деньги');
    for (let i = 0; i < 15; i++) mint(p, 130 + i * 50, 150, 21, GOLD, 'зм', m('start', .1 + i * .08));
    say(p, 'в кошельке: 15 зм', 560, 214, m('start', 1.4), { size: 26, weight: 600 });
    sh.set('gold', '15 зм', m('start', 1.4));
    // ladders: 1 gold = 10 silver, 1 silver = 10 copper
    mint(p, 130, 310, 25, GOLD, 'зм', m('ten'));
    say(p, '=', 185, 320, m('ten', .2), { size: 34, fill: COL.dim });
    for (let i = 0; i < 10; i++) mint(p, 240 + i * 44, 310, 18, SILV, 'см', m('ten', .3 + i * .1));
    colorLine(p, [['1 зм = 10 см', COL.chalk]], 880, 320, m('ten', 1.2), { size: 30, anchor: 'start' });
    mint(p, 130, 400, 18, SILV, 'см', m('hund'));
    say(p, '=', 185, 410, m('hund', .2), { size: 34, fill: COL.dim });
    for (let i = 0; i < 10; i++) mint(p, 240 + i * 44, 400, 14, COPR, 'мм', m('hund', .3 + i * .1));
    colorLine(p, [['1 см = 10 мм', COL.chalk]], 880, 410, m('hund', 1.2), { size: 30, anchor: 'start' });
    hr(p, 470, m('total', -.3));
    colorLine(p, [['15 зм', GOLD], [' = ', COL.dim], ['150 см', SILV], [' = ', COL.dim], ['1500 мм', COPR]], 560, 540, m('total'), { size: 44 });
    yesNo(p, true, 130, 650, m('buy'), .8);
    say(p, 'обычные предметы — можно', 180, 660, m('buy'), { size: 28, anchor: 'start' });
    yesNo(p, false, 130, 720, m('buy', 2), .8);
    say(p, 'необычные — только с разрешением ведущего', 180, 730, m('buy', 2), { size: 28, anchor: 'start' });
    pill(p, 'готовый набор класса', RULE, 560, 820, m('kit'), 30);
  }],
  ['weapons', 'Шаг 8: оружие', (m) => {
    const [sh, p] = shBeat(5, 2);
    title(p, 'Шаг 8 · оружие');
    const W = [{ n: 'Кинжал', price: '2 см', n6: 4, type: 'колющий', cls: 'простое', fin: true, x: 60 }, { n: 'Рапира', price: '2 зм', n6: 6, type: 'колющий', cls: 'особое', fin: true, x: 400 },
      { n: 'Праща', price: 'бесплатно', n6: 6, type: 'дробящий', cls: 'простое', fin: false, x: 740 }];
    W.forEach((w, i) => {
      const cx = w.x + 160;
      box(p, w.x, 110, 320, 620, COL.faint, m('tab', i * .3));
      say(p, w.n, cx, 170, m('tab', .2 + i * .3), { size: 34, weight: 700 });
      say(p, w.price, cx, 214, m('tab', .4 + i * .3), { size: 26, fill: RULE, weight: 600 });
      dieShape(p, w.n6, cx, 330, RULE, i ? m('d6', (i - 1) * .6) : m('d4'), 54, 'd' + w.n6);
      pill(p, w.type, COL.chalk, cx, 500, m('type', i * .4), 26);
      pill(p, w.cls, w.cls === 'особое' ? PROF : COL.dim, cx, 574, m('cls', i * .4), 26);
      if (w.fin) pill(p, 'фехтовальное', HERO, cx, 648, m('fin', i * .5), 26);
    });
    say(p, 'ядра: 1 мм за 10 штук', 900, 700, m('sling'), { size: 22, fill: COL.dim });
    colorLine(p, [['атака в ближнем бою: ', COL.dim], ['Ловкость', ATTR], [' вместо ', COL.dim], ['Силы', ATTR]], 560, 790, m('fin', 2.5), { size: 28 });
    colorLine(p, [['урон: всё равно ', COL.dim], ['Сила', ATTR]], 560, 840, m('dmg'), { size: 28 });
    ['st0', 'st1', 'st2'].forEach((k, i) => sh.set(k, ['Кинжал', 'Рапира', 'Праща'][i], m('sheet', i * .5), ['1d4 колющий', '1d6 колющий', '1d6 дробящий'][i]));
  }],
  ['armor', 'Шаг 8: броня', (m) => {
