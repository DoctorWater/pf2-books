<script>
'use strict';
const CHAPTER = { number: 13, title: 'Внимание и скрытность', minutes: 14, language: 'ru', next: '../ch14/' };

/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// Heroes HERO, bandits FOE, GM GMC, rules and dice RULE, light LIGHT (yellow), success OK, failure and penalties NO.
const LIGHT = COL.int;
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
// A d20 with its roll and a coloured line after it, left-aligned at x (as in ch08–ch09).
function roll(p, n, x, y, parts, t0, size = 25) {
  numDie(p, n, x + 16, y - 9, t0, 22);
  colorLine(p, parts, x + 46, y, t0 + .3, { size, anchor: 'start' });
}
// A ring with a letter, no name under it (as in ch09).
function tok(p, letter, colr, x, y, t0, r = 34, dash = false) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4, ...(dash ? { 'stroke-dasharray': '7 6' } : {}) }, g);
  T(g, letter, { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  show(g, t0);
  return g;
}
// Pills in a row centred on cx (as in ch07, ch09).
const pw = (s, size) => s.length * size * .56 + 44;
function pillRow(p, items, cx, y, size, colr, t0s) {
  const w = items.map(s => pw(s, size)), tot = w.reduce((a, b) => a + b + 18, -18);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, colr, x + w[i] / 2, y, t0s[i], size); x += w[i] + 18; return g; });
}
// The twenty faces of a d20 in a row (ch09); paint(f, deg, t0) colours face f with a degree of success.
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}
// A tile coloured by a degree of success: key, two lines of text.
function degTile(p, key, x, y, w, h, lines, t0, size = 23) {
  const [, name, colr, op] = DEG.find(d => d[0] === key);
  const r = mk('rect', { x, y, width: w, height: h, rx: 14, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, p);
  put(r, { o: 0 }); show(r, t0);
  say(p, name, x + w / 2, y + 38, t0, { size: 24, weight: 700 });
  lines.forEach((s, i) => say(p, s, x + w / 2, y + 76 + i * 32, t0 + .2, { size, fill: COL.chalk }));
}
// An action heading: one-action glyph, name, descriptor pills.
function actHead(p, name, traits, y, t0, x = 110) {
  glyph(p, 1, x, y - 12, t0, .5);
  const n = say(p, name, x + 40, y, t0, { size: 36, weight: 700, anchor: 'start' });
  let px = x + 60 + uiW(name, 36);
  traits.forEach((s, i) => { const w = pw(s, 22); pill(p, s, RULE, px + w / 2, y - 12, t0 + .4 + i * .3, 22); px += w + 14; });
  return px;
}

/* ---------- the night field: barn, torch, light zones to scale (1 foot = 8 px) ---------- */
const FT = 8, TX = 300, TY = 450;   // the torch by the barn door
const at = (ft, dy = 0) => [TX + ft * FT, TY + dy * FT];   // ft feet right of the torch, dy feet down
const SP = { s45: at(45), s35: at(35), s25: at(25), s25b: at(25, 10), s15: at(15), ban: at(4, 5), ban2: at(19, 10), owl: at(8, -13) };
function field(p, t0, { zones = true } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x: 0, y: 96, width: 830, height: 724, fill: '#121c19' }, g);
  const zb = G(g, { o: zones ? 1 : 0 }), zd = G(g, { o: zones ? 1 : 0 }), zn = G(g, { o: zones ? 1 : 0 });
  mk('circle', { cx: TX, cy: TY, r: 40 * FT, fill: LIGHT, 'fill-opacity': .09 }, zd);
  mk('circle', { cx: TX, cy: TY, r: 20 * FT, fill: LIGHT, 'fill-opacity': .13 }, zb);
  // barn and door
  mk('rect', { x: -10, y: 250, width: 290, height: 400, fill: '#2a2622', stroke: COL.faint, 'stroke-width': 3 }, g);
  T(g, 'амбар', { x: 130, y: 460, size: 30, fill: COL.dim, weight: 600, anchor: 'middle' });
  mk('rect', { x: 266, y: 415, width: 14, height: 70, fill: '#5a4632' }, g);
  // the torch
  const torch = G(g, { x: TX, y: TY });
  path(torch, 'M-10 22L0 4', { stroke: '#8a6a48', 'stroke-width': 5 });
  mk('circle', { cy: -2, r: 9, fill: LIGHT }, torch);
  T(g, 'факел', { x: TX, y: TY - 26, size: 20, fill: LIGHT, weight: 600, anchor: 'middle' });
  // the ruler: feet from the torch, zones on it
  const rx = ft => TX + ft * FT, ry = 852;
  path(g, `M${rx(0)} ${ry + 6}H${rx(60)}`, { stroke: COL.dim, 'stroke-width': 2 });
  [0, 20, 40, 60].forEach(v => {
    path(g, `M${rx(v)} ${ry - 8}V${ry + 12}`, { stroke: COL.dim, 'stroke-width': 2 });
    T(g, String(v), { x: rx(v), y: ry + 36, size: 18, fill: COL.dim, anchor: 'middle' });
  });
  T(g, 'футов от факела', { x: rx(0) - 14, y: ry + 36, size: 18, fill: COL.dim, anchor: 'end' });
  [[zb, 0, 20, .7, 'яркий свет', LIGHT], [zd, 20, 40, .3, 'тусклый свет', LIGHT], [zn, 40, 60, .5, 'темнота', COL.faint]].forEach(([z, a, b, op, s, c]) => {
    mk('rect', { x: rx(a) + 2, y: ry - 4, width: (b - a) * FT - 4, height: 10, rx: 3, fill: c, 'fill-opacity': op }, z);
    T(z, s, { x: rx((a + b) / 2), y: ry - 14, size: 20, fill: c === COL.faint ? COL.dim : LIGHT, weight: 600, anchor: 'middle' });
  });
  show(g, t0, .4);
  return { g, zb, zd, zn, torch, rx, ry };
}
// A participant on the field: a small ring with a name under it; the group moves with tw(…, {x, y}).
// Shippa's name sits above her ring (up), so it stays clear of the bandit who comes up beside her.
function ftok(p, name, colr, [x, y], t0, up = false) {
  const g = G(p, { x, y, o: 0 }), r = 24;
  mk('circle', { r, fill: COL.board, stroke: colr, 'stroke-width': 4 }, g);
  T(g, name[0], { y: r * .36, size: r, fill: colr, weight: 700, anchor: 'middle' });
  T(g, name, { y: up ? -r - 12 : r + 30, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  show(g, t0);
  return g;
}
const moveTo = (e, [x, y], t0, dur = .9) => tw(e, { x, y }, t0, dur);
// Detection ladder of one observer (night beats): five rungs, Shippa's marker on rung i; set(i, t0) moves it.
const RUNG = ['видима', 'плохо видима', 'спрятана', 'не обнаружена', 'незамечена'];
function obsLadder(p, x, y, name, i0, t0) {
  const g = G(p, { o: 0 }), RY = i => y + 26 + i * 54;
  colorLine(g, [['для ', COL.dim], [name, FOE], [' Шиппа', COL.dim]], x + 175, y, t0, { size: 24 });
  RUNG.forEach((s, i) => {
    mk('rect', { x: x + 50, y: RY(i), width: 250, height: 44, rx: 22, fill: '#22322d', stroke: COL.faint, 'stroke-width': 2, ...(i === 1 ? { 'stroke-dasharray': '7 6' } : {}) }, g);
    T(g, s, { x: x + 175, y: RY(i) + 30, size: 22, fill: COL.dim, weight: 600, anchor: 'middle' });
  });
  const mkr = G(g, { x: 0, y: RY(i0) });
  mk('rect', { x: x + 50, y: 0, width: 250, height: 44, rx: 22, fill: HERO, 'fill-opacity': .16, stroke: HERO, 'stroke-width': 3 }, mkr);
  mk('circle', { cx: x + 20, cy: 22, r: 18, fill: COL.board, stroke: HERO, 'stroke-width': 3 }, mkr);
  T(mkr, 'Ш', { x: x + 20, y: 30, size: 20, fill: HERO, weight: 700, anchor: 'middle' });
  show(g, t0);
  return { set: (i, t1) => { tw(mkr, { y: RY(i) }, t1, .6); pulse(mkr, t1 + .6, 1.04); } };
}
// The two observers' ladders on the right of the night field.
const ladders = (p, a, b, t0) => [obsLadder(p, 860, 120, 'разбойника', a, t0), obsLadder(p, 1220, 120, 'Сыча', b, t0)];
// The night scene at the start of a beat: field, people where they stand, ladders.
function night(p, name, ship, ban, a, b, t0 = .2) {
  title(p, name);
  const F = field(p, t0);
  const T0 = {
    ban: ftok(p, 'Разбойник', FOE, ban, t0 + .1),
    owl: ftok(p, 'Сыч', FOE, SP.owl, t0 + .1),
    ship: ftok(p, 'Шиппа', HERO, ship, t0 + .15, true),
  };
  return { F, ...T0, lad: ladders(p, a, b, t0 + .2) };
}
// A burst of text that rises and fades (a sound on the field).
function burst(p, s, x, y, colr, t0) {
  const e = say(p, s, x, y, t0, { size: 24, fill: colr, weight: 700 });
  tw(e, { y: y - 30, o: 0 }, t0 + 1.6, .8);
  return e;
}

/* ---------- the big detection ladder (states beats) ---------- */
const LAD = ['видимый', 'плохо видимый', 'спрятанный', 'необнаруженный', 'незамеченный'];
const LY = i => 150 + i * 116;
function bigLadder(p, lit, t0) {
  say(p, '↓ смотрящий знает меньше', 100, 128, t0, { size: 20, fill: COL.dim, anchor: 'start' });
  return LAD.map((s, i) => {
    const g = G(p, { o: 0 });
    mk('rect', { x: 100, y: LY(i), width: 360, height: 80, rx: 40, fill: '#22322d', stroke: COL.chalk, 'stroke-width': 2.5, ...(i === 1 ? { 'stroke-dasharray': '10 7' } : {}) }, g);
    T(g, s, { x: 280, y: LY(i) + 50, size: 30, weight: 700, anchor: 'middle' });
    tw(g, { o: lit.includes(i) ? 1 : .3 }, t0, .5);
    return g;
  });
}
// Effect lines to the right of rung i: [[parts…], …] coloured lines.
const rungText = (p, i, lines, t0, step = .6) => lines.forEach((parts, k) => L(p, parts, 500, LY(i) + 34 + k * 36, t0 + k * step, 24));
const RT = {
  0: [[['на виду · бить по нему можно как обычно', COL.chalk]]],
  2: [[['знает клетку, но не видит как следует', COL.chalk]], [['смотрящий застигнут врасплох: ', RULE], ['−2 к КБ', NO]]],
  3: [[['клетку не знает · тоже застигнут врасплох', COL.chalk]], [['бить — наугад по клетке, броски тайно у ведущего', COL.dim]]],
  4: [[['даже не подозревает, что существо здесь', COL.chalk]], [['всегда ещё и необнаруженный', COL.dim]]],
  1: [[['туман, дым, тусклый свет', COL.chalk]], [['главное состояние не меняется', COL.dim]]],
};
const flatPill = (p, i, n, t0) => pill(p, 'чистая проверка ' + n, RULE, 1390, LY(i) + 40, t0, 24);

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Внимание и скрытность', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 5 «Восприятие» · Глава 13', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Внимание и скрытность', { x: 800, y: 440, size: 70, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = say(scene, 'кто кого видит и как спрятаться', 800, 560, m('sub'), { size: 34, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['barn', 'Ночь у амбара', (m) => {
    const p = panel(0);
    title(p, 'Ночь у амбара');
    field(p, .2);
    ftok(p, 'Разбойник', FOE, SP.ban, m('bandit'));
    ftok(p, 'Сыч', FOE, SP.owl, m('owl'));
    ftok(p, 'Шиппа', HERO, SP.s45, m('ship'), true);
    say(p, '45 футов от двери', SP.s45[0], SP.s45[1] + 56, m('ship', 1.5), { size: 20, fill: COL.dim });
    bubble(p, 'Подползаю ближе', SP.s45[0], 334, HERO, m('ship', 2.6), { size: 24 });
    who(p, 'Ведущий', GMC, 960, 330, m('gm', -.3), 46);
    bubble(p, 'Разбойник зевает и смотрит в другую сторону', 1220, 220, GMC, m('gm', 1.4), { size: 24, side: 'left' });
    // who sees whom: Shippa sees the lit bandit, he does not see her in the dark
    const [sx, sy] = SP.s45, [bx, by] = SP.ban;
    arrowTo(p, sx - 30, sy - 8, bx + 32, by - 14, HERO, m('why'));
    const no = G(p, { o: 0 });
    path(no, `M${bx + 30} ${by + 10}L${sx - 34} ${sy + 18}`, { stroke: FOE, 'stroke-width': 3, 'stroke-dasharray': '10 8' });
    const mx = (bx + sx) / 2, my = (by + sy) / 2 + 16;
    path(no, `M${mx - 12} ${my - 12}L${mx + 12} ${my + 12}M${mx + 12} ${my - 12}L${mx - 12} ${my + 12}`, { stroke: NO, 'stroke-width': 5 });
    show(no, m('why', 1.6));
    L(p, [['Шиппа видит разбойника: ', HERO], ['он у факела', COL.chalk]], 900, 520, m('why'), 28);
    L(p, [['разбойник Шиппу — ', FOE], ['нет: она в темноте', NO]], 900, 580, m('why', 1.6), 28);
    say(p, 'всё решают свет и глаза', 900, 680, m('why', 3.4), { size: 30, fill: RULE, weight: 600, anchor: 'start' });
  }],
  ['light', 'Свет и темнота', (m) => {
    const p = panel(0);
    title(p, 'Свет и темнота');
    const F = field(p, .2, { zones: false });
    ftok(p, 'Разбойник', FOE, SP.ban, .3);
    ftok(p, 'Сыч', FOE, SP.owl, .3);
    const row = (y, op, name, txt, t0, dash) => {
      const sw = mk('rect', { x: 880, y: y - 34, width: 44, height: 44, rx: 8, fill: dash ? 'none' : LIGHT, 'fill-opacity': op, stroke: dash ? COL.faint : LIGHT, 'stroke-width': 2 }, p);
      put(sw, { o: 0 }); show(sw, t0);
      say(p, name, 950, y, t0, { size: 30, weight: 700, anchor: 'start' });
      txt.forEach((s, k) => say(p, s[0], 950, y + 40 + k * 34, t0 + .4 + k * .4, { size: 24, fill: s[1] || COL.dim, anchor: 'start' }));
    };
    show(F.zb, m('bright'));
    row(170, .7, 'Яркий свет', [['всех видно ясно'], ['если ведущий не сказал другого', COL.dim]], m('bright'));
    pulse(F.torch, m('torch'), 1.6);
    show(F.zd, m('dim'));
    row(330, .3, 'Тусклый свет', [['от 20 до 40 футов от факела'], ['кто в нём — плохо видим', COL.chalk]], m('dim'));
    show(F.zn, m('dark'));
    row(490, 0, 'Темнота', [['дальше 40 футов'], ['не видно: спрятан или не обнаружен', COL.chalk]], m('dark'), true);
    ftok(p, 'Шиппа', HERO, SP.s45, m('ship'), true);
    const mk45 = G(p, { o: 0 });
    path(mk45, `M${F.rx(45)} ${F.ry - 16}V${F.ry + 12}`, { stroke: HERO, 'stroke-width': 4 });
    T(mk45, '45', { x: F.rx(45), y: F.ry + 36, size: 18, fill: HERO, weight: 700, anchor: 'middle' });
    show(mk45, m('ship', .4));
    box(p, 870, 620, 680, 180, NO, m('blind'));
    L(p, [['смотрящий без особого зрения в темноте: ', COL.chalk], ['слепота', NO]], 900, 672, m('blind'), 24);
    L(p, [['но освещённое место он видит', OK]], 900, 720, m('blind', 3), 24);
    arrowTo(p, SP.s45[0] - 30, SP.s45[1] - 8, SP.ban[0] + 32, SP.ban[1] - 14, HERO, m('sees'));
    L(p, [['Шиппа из темноты видит, кто у факела', COL.dim]], 900, 764, m('sees', .4), 22);
  }],
  ['senses', 'Способы восприятия', (m) => {
    const p = panel(0);
    title(p, 'Способы восприятия');
    const C = [280, 800, 1320], cs = 80, gy = 290;
    const grid3 = (cx, t0) => {
      const g = G(p, { o: 0 });
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
        mk('rect', { x: cx - 1.5 * cs + i * cs, y: gy + j * cs, width: cs - 4, height: cs - 4, rx: 6, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
      show(g, t0);
    };
    const head = (cx, s, sub, t0) => {
      say(p, s, cx, 200, t0, { size: 32, fill: RULE, weight: 700 });
      say(p, sub, cx, 244, t0 + .3, { size: 24, fill: COL.dim });
    };
    // precise: the creature is seen where it is
    head(C[0], 'точный', 'обычно зрение', m('precise'));
    grid3(C[0], m('precise'));
    tok(p, 'Р', FOE, C[0] + cs - 2, gy + cs - 2, m('precise', .8), 28);
    say(p, 'где существо и что делает', C[0], 590, m('precise', 1.6), { size: 24 });
    say(p, 'только им — цель без помех', C[0], 630, m('precise', 3.4), { size: 24, fill: OK });
    // imprecise: only the square is known
    head(C[1], 'вспомогательный', 'например, слух', m('imprecise'));
    grid3(C[1], m('imprecise'));
    const q = G(p, { o: 0 });
    mk('rect', { x: C[1] + cs / 2 - 2, y: gy + cs - 2 - cs / 2, width: cs - 4, height: cs - 4, rx: 6, fill: RULE, 'fill-opacity': .3, stroke: RULE, 'stroke-width': 2.5 }, q);
    T(q, '?', { x: C[1] + cs - 4, y: gy + cs + 12, size: 40, fill: RULE, weight: 700, anchor: 'middle' });
    show(q, m('imprecise', 1.2));
    say(p, 'только клетка', C[1], 590, m('imprecise', 1.6), { size: 24 });
    say(p, 'ушами — максимум спрятанный,', C[1], 630, m('imprecise', 4), { size: 24, fill: NO });
    say(p, 'видимым никогда', C[1], 666, m('imprecise', 4.6), { size: 24, fill: NO });
    // vague: only "someone is here"
    head(C[2], 'дополнительный', 'например, нюх', m('vague'));
    grid3(C[2], m('vague'));
    const v = mk('rect', { x: C[2] - 1.5 * cs - 6, y: gy - 6, width: 3 * cs + 8, height: 3 * cs + 8, rx: 12, fill: COL.dim, 'fill-opacity': .18, stroke: COL.dim, 'stroke-width': 2 }, p);
    put(v, { o: 0 }); show(v, m('vague', 1));
    say(p, 'кто-то здесь', C[2], gy + 1.5 * cs + 8, m('vague', 1.4), { size: 26, fill: COL.chalk, weight: 600 });
    say(p, 'только «здесь кто-то есть»', C[2], 590, m('vague', 1.6), { size: 24 });
