/* ---------- chapter drawing helpers (shared ones: lib/pf.js) ---------- */
// HP HERO, healing and success OK, damage, «при смерти» and failure NO, wounded WND (lilac), doomed DOOM (pink), hero points HPT (gold).
const WND = COL.real, DOOM = COL.rat, HPT = COL.int;
const PPL = { r: ['Разбойник', FOE], s: ['Шиппа', HERO], t: ['Тиль', HERO], b: ['Бронна', HERO] };
const hr = (p, y, t0, x1 = 80, x2 = 1520) => draw(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.faint, 'stroke-width': 2 }, { d: 0 }), t0, .5);
const box = (p, x, y, w, h, colr, t0) => { const r = mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#22322d', stroke: colr, 'stroke-width': 2.5 }, p); put(r, { o: 0 }); show(r, t0); return r; };
const title = (p, s, t0 = .2) => say(p, s, 800, 62, t0, { size: 36, weight: 600 });
const L = (p, parts, x, y, t0, size = 26) => colorLine(p, parts, x, y, t0, { size, anchor: 'start' });   // left-aligned coloured line
const blink = (e, t0) => { tw(e, { o: .25 }, t0, .25); tw(e, { o: 1 }, t0 + .25, .35); tw(e, { o: .25 }, t0 + .6, .25); tw(e, { o: 1 }, t0 + .85, .35); };
const setText = (e, s, t0) => { prog(() => { e.textContent = s; }, t0, 0); pulse(e, t0, 1.3); };
// A d20 with its roll and a coloured sum after it, left-aligned at x (as in ch08–ch09).
function roll(p, n, x, y, parts, t0, size = 26) {
  numDie(p, n, x, y - 9, t0, 22);
  colorLine(p, parts, x + 38, y, t0 + .3, { size, anchor: 'start' });
}
// The twenty faces of a d20 in a row from x0, top y; paint(f, deg, t0) colours face f with a degree of success (copy of ch09).
function faces(p, x0, y, t0, { w = 58, h = 80, gap = 4, size = 26 } = {}) {
  const X = f => x0 + (f - 1) * (w + gap), cx = f => X(f) + w / 2;
  const g = G(p, { o: 0 });
  for (let f = 1; f <= 20; f++) {
    mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    T(g, String(f), { x: cx(f), y: y + h / 2 + size * .36, size, weight: 600, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  return {
    X, cx, w, h,
    paint(f, deg, t1) {
      const [, , colr, op] = DEG.find(d => d[0] === deg);
      const r = mk('rect', { x: X(f), y, width: w, height: h, rx: 8, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, top);
      put(r, { o: 0 }); show(r, t1, .3);
      return r;
    },
  };
}
// Faces a..b painted with one degree, a label centred under them.
function band(p, F, a, b, deg, label, t0, ly, colr) {
  for (let f = a; f <= b; f++) F.paint(f, deg, t0 + (f - a) * .04);
  return say(p, label, (F.X(a) + F.X(b) + F.w) / 2, ly, t0 + .3, { size: a === b ? 20 : 23, fill: colr || DEG.find(d => d[0] === deg)[2], weight: 700 });
}
// Hit points as a row of cells from x, top y; set(v, t0) — lost cells flash red and empty, healed ones flash green and fill;
// ghost(i, t0) — a crossed dashed cell outside the bar (HP above the maximum or below zero are lost).
function hpBar(p, x, y, max, cur, t0, { cw = 50, h = 44, gap = 4, label = true, colr = HERO, op = .55, stroke = COL.faint } = {}) {
  const g = G(p, { o: 0 }), X = i => x + i * (cw + gap), cells = [];
  for (let i = 0; i < max; i++) {
    mk('rect', { x: X(i), y, width: cw, height: h, rx: 6, fill: 'none', stroke, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, g);
    cells.push(put(mk('rect', { x: X(i), y, width: cw, height: h, rx: 6, fill: colr, 'fill-opacity': op }, g), { o: i < cur ? 1 : 0 }));
  }
  const val = label ? T(g, `${cur} / ${max}`, { x: X(max) + 12, y: y + h / 2 + 11, size: 30, fill: HERO, weight: 700 }) : null;
  show(g, t0);
  let v0 = cur;
  return {
    g, X, cw, h, val,
    set(v, t1) {
      const lo = Math.min(v, v0), hi = Math.max(v, v0), down = v < v0;
      for (let i = lo; i < hi; i++) {
        const c = cells[i], t = t1 + (down ? hi - 1 - i : i - lo) * .06;
        tw(c, { c_fill: down ? NO : OK }, t, .05);
        if (down) { tw(c, { o: 0 }, t + .45, .35); tw(c, { c_fill: colr }, t + .85, .05); }
        else { tw(c, { o: 1 }, t, .3); tw(c, { c_fill: colr }, t + .8, .5); }
      }
      if (val) setText(val, `${v} / ${max}`, t1 + .2);
      v0 = v;
    },
    ghost(i, t1) {
      const gg = G(p, { o: 0 }), gx = X(i);
      mk('rect', { x: gx, y, width: cw, height: h, rx: 6, fill: 'none', stroke: NO, 'stroke-width': 2, 'stroke-dasharray': '5 4' }, gg);
      path(gg, `M${gx + 8} ${y + 8}L${gx + cw - 8} ${y + h - 8}M${gx + cw - 8} ${y + 8}L${gx + 8} ${y + h - 8}`, { stroke: NO, 'stroke-width': 3 });
      show(gg, t1, .3);
      return gg;
    },
  };
}
// A condition scale of n numbered cells (dying 1–4, wounded 1–3) from x, top y; the name on the left in its colour.
// death — the cell that kills (red frame, «смерть» under it); fill(i, t0, colour) / clear(i, t0) / set(v, t0) change the value.
function track(p, x, y, n, colr, name, t0, { cw = 120, h = 80, gap = 10, death = 0, size = 34, nameSize = 28 } = {}) {
  const g = G(p, { o: 0 }), X = i => x + (i - 1) * (cw + gap), fills = {};
  if (name) T(g, name, { x: x - 22, y: y + h / 2 + nameSize * .36, size: nameSize, fill: colr, weight: 700, anchor: 'end' });
  for (let i = 1; i <= n; i++) {
    const dz = i === death;
    mk('rect', { x: X(i), y, width: cw, height: h, rx: 10, fill: 'none', stroke: dz ? NO : COL.faint, 'stroke-width': dz ? 4 : 2, ...(dz ? {} : { 'stroke-dasharray': '7 5' }) }, g);
    T(g, String(i), { x: X(i) + cw / 2, y: y + h / 2 + size * .36, size, fill: COL.dim, weight: 700, anchor: 'middle' });
    if (dz) T(g, 'смерть', { x: X(i) + cw / 2, y: y + h + Math.max(22, size * .8), size: Math.max(18, size * .6), fill: NO, weight: 700, anchor: 'middle' });
  }
  show(g, t0);
  const top = G(p);
  let v = 0;
  const api = {
    g, X, cw, h,
    fill(i, t1, c = colr) {
      const r = put(mk('rect', { x: X(i), y, width: cw, height: h, rx: 10, fill: c, 'fill-opacity': .5, stroke: c, 'stroke-width': 3 }, top), { o: 0 });
      show(r, t1, .3); fills[i] = r; v = Math.max(v, i);
      return r;
    },
    clear(i, t1) { if (fills[i]) hide(fills[i], t1, .3); delete fills[i]; v = Math.min(v, i - 1); },
    set(nv, t1, c = colr) {
      const v0 = v;
      for (let i = v0 + 1; i <= nv; i++) api.fill(i, t1 + (i - v0 - 1) * .15, c);
      for (let i = v0; i > nv; i--) api.clear(i, t1 + (v0 - i) * .15);
    },
    // a cross over cell i (doomed: the scale is shorter)
    cross(i, t1, c = DOOM) {
      const a = X(i) + 14, b = X(i) + cw - 14;
      return draw(path(top, `M${a} ${y + 12}L${b} ${y + h - 12}M${b} ${y + 12}L${a} ${y + h - 12}`, { stroke: c, 'stroke-width': 5 }, { d: 0 }), t1, .4);
    },
  };
  return api;
}
// Hero point slots (max 3) at x, y; n filled. spend(t0) empties the last filled one, gain(t0) fills the next.
function heroPts(p, x, y, n, t0, { r = 20, dx = 56 } = {}) {
  const g = G(p, { o: 0 }), dots = [];
  for (let i = 0; i < 3; i++) {
    mk('circle', { cx: x + i * dx, cy: y, r, fill: 'none', stroke: HPT, 'stroke-width': 2.5, 'stroke-dasharray': '5 4' }, g);
    dots.push(put(mk('circle', { cx: x + i * dx, cy: y, r: r - 3, fill: HPT }, p), { o: i < n ? 1 : 0 }));
  }
  show(g, t0);
  dots.forEach((d, i) => { if (i < n) { put(d, { o: 0 }); show(d, t0); } });
  let k = n;
  return {
    spend(t1) { k--; tw(dots[k], { o: 0 }, t1, .5); },
    gain(t1) { show(dots[k], t1, .4); k++; },
  };
}
// Four tiles of degrees of success: items [[deg, big, small, t0], …] from x, top y.
function degTiles(p, items, x, y, { w = 320, h = 170, gap = 30, big = 44 } = {}) {
  return items.map(([k, v, s, t0], i) => {
    const [, name, colr, op] = DEG.find(d => d[0] === k), tx = x + i * (w + gap);
    const r = mk('rect', { x: tx, y, width: w, height: h, rx: 14, fill: colr, 'fill-opacity': op, stroke: colr, 'stroke-width': 2.5 }, p);
    put(r, { o: 0 }); show(r, t0);
    say(p, name, tx + w / 2, y + 42, t0, { size: 25, weight: 700 });
    say(p, v, tx + w / 2, y + 42 + big + 12, t0 + .2, { size: big, weight: 700 });
    if (s) say(p, s, tx + w / 2, y + h - 22, t0 + .3, { size: 21 });
    return tx;
  });
}
// The state of the forest fight at the start of a beat: initiative ring, the bandit's card, Shippa's HP, scales and hero points.
function fightBoard(p, st, t0 = .3) {
  say(p, 'инициатива', 80, 104, t0, { size: 20, fill: COL.dim, anchor: 'start' });
  const rib = ribbon(p, st.order, 130, 160, 150, t0, 30);
  box(p, 1060, 96, 460, 140, FOE, t0);
  say(p, 'Разбойник · КБ 16', 1090, 146, t0, { size: 27, fill: FOE, weight: 700, anchor: 'start' });
  say(p, 'дубинка +7 · урон d6 + 3', 1090, 200, t0, { size: 23, fill: COL.dim, anchor: 'start' });
  const ban = say(p, 'ПЗ ' + st.ban, 1490, 146, t0, { size: 30, fill: FOE, weight: 700, anchor: 'end' });
  say(p, 'Шиппа', 80, 322, t0, { size: 28, fill: HERO, weight: 700, anchor: 'start' });
  const hp = hpBar(p, 210, 292, 20, st.hp, t0, { cw: 30, h: 40, gap: 3 });
  const dy = track(p, 330, 366, 4, NO, 'при смерти', t0, { cw: 64, h: 50, gap: 8, death: 4, size: 24, nameSize: 24 });
  (st.dy || []).forEach((c, i) => dy.fill(i + 1, t0, c));
  const wd = track(p, 840, 366, 3, WND, 'ранение', t0, { cw: 64, h: 50, gap: 8, size: 24, nameSize: 24 });
  if (st.wd) wd.fill(1, t0);
  say(p, 'пункты героизма', 1120, 340, t0, { size: 22, fill: HPT, weight: 600, anchor: 'start' });
  const hero = heroPts(p, 1140, 392, st.hero, t0);
  return { rib, ban, hp, dy, wd, hero };
}
// Swap two rings of the initiative ribbon (a hero who drops moves right before the one who dropped them).
function swapRib(rib, a, b, t1) {
  tw(rib.tok[a], { x: rib.pos[b] }, t1, .9); tw(rib.tok[b], { x: rib.pos[a] }, t1, .9);
  [rib.pos[a], rib.pos[b]] = [rib.pos[b], rib.pos[a]];
}
const LOG = i => 520 + i * 48;   // log lines under the fight board
